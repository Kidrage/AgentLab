name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "pytest<9" pyyaml
      - name: Text integrity audit
        run: |
          python scripts/audit_text_integrity.py --fail-on-suspicious
      - name: Compile Python
        run: |
          python -m compileall agent_runtime agentlab_app.py scripts tests
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python -c 'from pathlib import Path; text=Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace"); starts=[i for marker in ("FAILURES", "short test summary info", "ERRORS") if (i:=text.find(marker)) >= 0]; excerpt=text[min(starts) if starts else max(0, len(text)-3500):][-3500:]; excerpt=excerpt.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A"); print(f"::error title=pytest failure excerpt::{excerpt}")'
          fi
          exit "$status"
      - name: S10 generalization gate
        run: |
          ./agentlab.sh eval-generalization --out acceptance_runs/s10_generalization_eval
          ./agentlab.sh ci-gates --dry-run
      - name: Whitespace diff check
        run: |
          git diff --check
      - name: Validate entrypoints
        run: |
          bash -n agentlab.sh
          python -m py_compile agent_runtime/run_task.py
          ./agentlab.sh --help
          ./agentlab.sh run-pipeline --help
          ./agentlab.sh p2-closure --help
          ./agentlab.sh p2-capability-map --help
      - name: Check forbidden tracked files
        run: |
          bash scripts/check_forbidden_tracked_files.sh
