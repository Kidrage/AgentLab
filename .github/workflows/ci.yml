name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "pytest<9" pyyaml
      - name: Text integrity audit
        run: |
          python scripts/audit_text_integrity.py --fail-on-suspicious
      - name: Compile Python
        run: |
          python -m compileall agent_runtime agentlab_app.py
      - name: Run tests
        run: |
          python -m pytest -q
      - name: Stable baseline smoke
        run: |
          python scripts/s0_stable_baseline_check.py
      - name: Remote raw integrity on pushed branch
        if: github.event_name == 'push'
        run: |
          python scripts/check_remote_raw_integrity.py --ref "$GITHUB_REF_NAME" --fail-on-suspicious
      - name: Whitespace diff check
        run: |
          git diff --check
      - name: Validate entrypoints
        run: |
          bash -n agentlab.sh
          python -m py_compile agent_runtime/run_task.py
          ./agentlab.sh --help
          ./agentlab.sh run-pipeline --help
          ./agentlab.sh p2-closure --help
          ./agentlab.sh p2-capability-map --help
      - name: Check forbidden tracked files
        run: |
          bash scripts/check_forbidden_tracked_files.sh
