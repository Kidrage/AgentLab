name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "pytest<9" pyyaml
      - name: Text integrity audit
        run: |
          python scripts/audit_text_integrity.py --fail-on-suspicious
      - name: Compile Python
        run: |
          python -m compileall agent_runtime agentlab_app.py scripts tests
      - name: Run tests
        run: |
          python -m pytest -q tests/test_ci_workflow_integrity.py
      - name: Run tests text integrity
        run: |
          python -m pytest -q tests/test_repository_text_integrity.py
      - name: Run tests P2 closure
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestP2CapabilityMap \
            tests/test_p2_closure.py::TestAcceptedDelivery \
            tests/test_p2_closure.py::TestNeedsRevisionDelivery \
            tests/test_p2_closure.py::TestUnsafeDelivery \
            tests/test_p2_closure.py::TestMissingArtifactsDelivery
      - name: Run tests P2 router apply
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestRouterApplyRequiresApproval \
            tests/test_p2_closure.py::TestRouterApplyWithApproval
      - name: Run tests P2 safety
        run: |
          python -m pytest -q tests/test_p2_closure.py::TestP2ClosureSafety
      - name: Run tests P2 script
        run: |
          python -m pytest -q tests/test_p2_closure.py::TestP2ClosureScript
      - name: Run tests P2 CLI
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestP2ClosureCLI::test_p2_closure_help_via_run_task
      - name: Run tests P2 CLI capability help
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestP2ClosureCLI::test_p2_capability_map_help_via_run_task
      - name: Run tests P2 CLI accepted
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestP2ClosureCLI::test_p2_closure_accepted_via_cli
      - name: Run tests P2 CLI revision
        run: |
          python -m pytest -q \
            tests/test_p2_closure.py::TestP2ClosureCLI::test_p2_closure_revision_via_cli
      - name: Run tests A-G
        run: |
          python -m pytest -q tests/test_[a-g]*.py
      - name: Run tests H-O
        run: |
          python -m pytest -q tests/test_[h-o]*.py
      - name: Run tests P
        run: |
          python -m pytest -q tests/test_p*.py
      - name: Run tests R-Z
        run: |
          python -m pytest -q tests/test_[r-z]*.py
      - name: Validate entrypoints
        run: |
          bash -n agentlab.sh
          python -m py_compile agent_runtime/run_task.py
          ./agentlab.sh --help
          ./agentlab.sh run-pipeline --help
          ./agentlab.sh p2-closure --help
          ./agentlab.sh p2-capability-map --help
      - name: Check forbidden tracked files
        run: |
          bash scripts/check_forbidden_tracked_files.sh
