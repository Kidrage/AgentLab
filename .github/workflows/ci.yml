name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install "pytest<9" pyyaml
      - name: Text integrity audit
        run: |
          python scripts/audit_text_integrity.py --fail-on-suspicious
      - name: Compile Python
        run: |
          python -m compileall agent_runtime agentlab_app.py scripts tests
      - name: Run tests
        run: |
          set -o pipefail
          set +e
          timeout 900s python -m pytest -q -vv --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          log = Path("pytest.log").read_text(encoding="utf-8", errors="replace")
          lines = log.splitlines()
          failures = [line for line in lines if line.startswith("FAILED ")]
          if not failures:
              failures = [line for line in lines if "E   " in line][-10:]
          message = "%0A".join(failures[-20:]) if failures else "pytest failed; inspect Run tests log"
          print(f"::error title=pytest failure::{message}")
          PY
          fi
          exit "$status"
      - name: S10 generalization gate
        run: |
          ./agentlab.sh eval-generalization --out acceptance_runs/s10_generalization_eval
          ./agentlab.sh ci-gates --dry-run
      - name: Whitespace diff check
        run: |
          git diff --check
      - name: Validate entrypoints
        run: |
          bash -n agentlab.sh
          python -m py_compile agent_runtime/run_task.py
          ./agentlab.sh --help
          ./agentlab.sh run-pipeline --help
          ./agentlab.sh p2-closure --help
          ./agentlab.sh p2-capability-map --help
      - name: Check forbidden tracked files
        run: |
          bash scripts/check_forbidden_tracked_files.sh
