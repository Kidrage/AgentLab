schema_version: '1.0'
mission_id: mission_creative_longform_001
created_at: null
task_type: creative_longform
user_goal: Create a longform story chapter with genre, audience, outline, continuity tracking, draft, and style revision.
intent_summary: Longform creative writing should plan before drafting.
non_goals:
  - Do not jump directly to final prose.
hard_constraints:
  - Outline must precede drafting.
soft_preferences:
  - Maintain a lyrical but clear tone.
unknowns:
  - Target word count and exact audience are not fully specified.
assumptions:
  - id: assumption_001
    text: The user wants a planning package before final drafting.
    confidence: medium
    requires_user_confirmation: true
required_capabilities:
  - capability: file_write
    reason: Write planning and draft artifacts.
    required: true
    source: inferred
required_artifacts:
  - artifact_type: document
    name: outline
    description: Outline before drafting.
    required: true
acceptance_gates:
  - gate_id: outline_first
    description: Planning artifacts exist before drafting.
    verification_method: review
    required: true
risks:
  - risk_id: continuity_drift_risk
    level: medium
    description: Longform content may drift.
    mitigation: Use a continuity ledger.
human_approval:
  required: true
  reason: Confirm outline direction before final drafting.
recommended_route: PromptEngineer -> DocManager -> Verifier
notes:
  - Example S2 creative contract.
