    reason: Convert music intent into structured non-executable requirements.
    required: true
    source: inferred
required_artifacts:
  - artifact_type: document
    name: music_generation_brief
    description: Non-executable creative brief and acceptance criteria.
    required: true
acceptance_gates:
  - gate_id: gate_001
    description: Brief includes goal, constraints, and explicit non-goals.
    verification_method: review
    required: true
risks:
  - risk_id: risk_001
    level: medium
    description: The user may expect real media generation in this foundation stage.
    mitigation: State that S1-A does not execute audio generation.
human_approval:
  required: false
  reason: Contract-only planning artifact.
recommended_route: Prompt Engineer -> Verifier
notes:
  - Audio fixture confirms task_type support without multimodal runtime work.