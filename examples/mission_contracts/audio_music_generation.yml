schema_version: '1.0'
mission_id: mission_audio_music_generation_001
created_at: null
task_type: audio_music
user_goal: Plan a short music generation task and define acceptance criteria.
intent_summary: Capture audio/music intent without invoking generation tools.
non_goals:
  - Do not call external audio generation APIs in S1-A.
hard_constraints:
  - Avoid copyrighted artist imitation requests.
soft_preferences:
  - Include tempo, mood, and instrumentation notes when available.
