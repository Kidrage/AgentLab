plan_status: ready
long_project_governance_required: true
project_brain_dir: ../../../projects/AgentLab/narrative_repair_v2/project_brain
goal: >-
  Resume the timed-out Coder node without redoing its accepted partial work and
  close the five remaining Supervisor-reproduced public-contract failures.
context_summary: >-
  The prior Coder process timed out at 600 seconds after leaving a partial patch
  and prematurely appending a completed row. The exact target check and receipt
  filename are now correct and 130 focused tests pass. Independent replay still
  proves non-canonical absolute source keys pass, validate_materialized_outputs
  passes without provenance, whitespace provenance passes, ChapterRequest has
  no provenance fields, and receipt-write failure leaves prose behind.
allowed_files:
  - agent_runtime/narrative/production/brief_compiler.py
  - agent_runtime/narrative/production/writer_contract.py
  - agent_runtime/narrative/production/chapter_engine.py
  - agent_runtime/narrative/production/state_projector.py
  - agent_runtime/writer_output_materializer.py
  - tests/test_narrative_delivery.py
  - tests/test_narrative_efficiency.py
  - tests/test_narrative_quality_gate.py
  - tests/test_writer_output_materializer.py
  - docs/narrative/NARRATIVE_PHASE1R_ACCEPTANCE.md
  - acceptance_runs/narrative_repair_v2/phase_1r/**
  - PROJECT_HANDOFF.md
forbidden_files:
  - agent_runtime/run_task.py
  - agent_runtime/pipeline_runner.py
  - agent_runtime/workflow_plan.py
  - agent_runtime/narrative_delivery.py
  - agent_runtime/narrative_eval.py
  - agent_runtime/operator_os/**
  - agent_runtime/background_jobs/**
  - config/**
  - projects/Crown_of_Ash/**
  - projects/NovelGen/**
  - release_objects/**
  - agent_templates/**
