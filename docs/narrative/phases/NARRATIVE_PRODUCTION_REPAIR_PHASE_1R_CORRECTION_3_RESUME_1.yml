must_read_artifacts:
  - PROJECT_HANDOFF.md
  - docs/narrative/phases/NARRATIVE_PRODUCTION_REPAIR_PHASE_1R_CORRECTION_3.yml
  - projects/AgentLab/runs/task_narrative_repair_v2_phase1r_correction3/blocked_Coder.md
state_contract:
  attempt: correction_3_resume_1
  retry_scope: timed_out_coder_node_only
  preserve_partial_work:
    - exact runs/<task_id>/fiction_draft.md equality
    - blocked validation has no receipt
    - writer_execution_receipt.yml filename
    - current 130 passing focused tests
  supervisor_replay_facts:
    noncanonical_dot_segment_source_key_issues: []
    root_directory_source_key_issues: []
    double_slash_source_key_issues: []
    validate_materialized_outputs_missing_provenance_status: pass
    whitespace_provenance_status: pass
    chapter_request_provenance_fields_present: false
    receipt_write_exception_escaped: true
    prose_left_after_receipt_write_failure: true
  correction_requirements:
    - >-
      Validate each source_hashes key with pathlib semantics, not startswith.
      It must be a non-empty canonical absolute path string with no dot segments
      or redundant separators and must identify a file, not a directory. Add
      parameterized tests for empty, whitespace, relative, /, //path, dot
      segments, and a valid resolved temporary file. Keep 64-hex validation.
    - >-
      Centralize stripped provenance validation so both
      validate_materialized_outputs and validate_edit_blocks block when any of
      provider, model, or call_id is empty or whitespace. Success-only receipt
      creation must be impossible with incomplete provenance.
    - >-
      Add observed writer provider/model/call_id fields to ChapterRequest and
      pass them into validate_writer_v2_output. Update all engine tests with real
      values. Prove missing or whitespace engine provenance blocks while a
      populated delta plus complete provenance remains a reachable pass.
    - >-
      Replace the mutable global projector call log with an injectable projector
      callable or explicit projector-result consumer spy at the ChapterEngine
      seam. Tests must observe 0 calls before selection and exactly 1 after.
      Avoid process-global state that can race between background jobs.
    - >-
      Use one canonical prose string returned by validation for writing and
      hashing; do not re-extract a second representation from blocks. Wrap prose
      and receipt persistence so any exception removes both
      fiction_draft.md and writer_execution_receipt.yml and returns a blocked
      result with no receipt. Add injected prose-write and receipt-write failure
      tests. The diagnostic capture may remain.
    - >-
      Run all four focused files and update strict evidence with actual numbers.
      Correct the premature correction3 completed handoff statement by appending
      truthful resume progress and final status; never delete lineage. Keep
      accepted: false. Do not start Phase 2R or touch Production.
acceptance_criteria:
  - canonical_existing_file_source_keys_only
  - stripped_provenance_required_in_both_validation_entrypoints
  - chapter_engine_provenance_is_explicit_and_success_reachable
  - projector_seam_is_injectable_and_not_global
  - prose_and_receipt_persistence_is_failure_atomic
  - canonical_prose_is_not_reparsed
  - all_four_focused_test_files_pass_with_zero_failures
  - candidate_remains_pending_supervisor_review
  - no_forbidden_or_production_changes
outputs:
  - completed Phase 1R implementation and consolidated tests
  - docs/narrative/NARRATIVE_PHASE1R_ACCEPTANCE.md
  - acceptance_runs/narrative_repair_v2/phase_1r/phase1r_acceptance.yml
  - acceptance_runs/narrative_repair_v2/phase_1r/test_results.yml
  - acceptance_runs/narrative_repair_v2/phase_1r/change_scope.yml
  - acceptance_runs/narrative_repair_v2/phase_1r/rollback.md
  - PROJECT_HANDOFF.md
roles: [Coder]
