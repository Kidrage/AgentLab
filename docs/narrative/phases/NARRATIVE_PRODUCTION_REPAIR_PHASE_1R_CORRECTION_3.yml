title: close_phase1r_exact_path_provenance_and_projector_false_greens
plan_status: ready
long_project_governance_required: true
project_brain_dir: ../../../projects/AgentLab/narrative_repair_v2/project_brain
goal: >-
  Close the remaining public-contract false greens proven by the Supervisor:
  canonical source-path validation, exact Writer target equality, mandatory
  observed provenance, success-only receipts with the required filename, and
  an observable post-selection projector boundary.
context_summary: >-
  Correction 2 reports 121 passing tests, but independent adversarial replay
  proves that empty and relative source-hash keys pass, a nested fiction target
  passes, missing provider/model/call_id still materializes prose and a receipt,
  blocked validations still carry receipts, the persisted receipt filename does
  not match the contract, and no projector call-order spy exists. Phase 1R is
  rejected; this task must fix public behavior rather than amend claims.
allowed_files:
  - agent_runtime/narrative/production/**
  - agent_runtime/writer_output_materializer.py
  - tests/test_narrative_delivery.py
  - tests/test_narrative_efficiency.py
  - tests/test_narrative_quality_gate.py
  - tests/test_writer_output_materializer.py
  - agent_templates/writer.md
  - docs/narrative/NARRATIVE_PHASE1R_ACCEPTANCE.md
  - acceptance_runs/narrative_repair_v2/phase_1r/**
