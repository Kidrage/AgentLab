  task_size: large
  agents:
  - Supervisor
  - RepoScout
  - Researcher
  - InterfaceMapper
  - TesterAuditor
  - Verifier
  - Archivist
  rationale:
  - Supervisor always defines scope, token budget, and stop rules.
  - Route selected by evaluation_task using smallest_safe_route rules.
  - Analysis-only route selected; Coder is skipped because no source implementation
    is requested.
  - Research hints detected; include Researcher when route requires current or external
    facts.
  - Evaluation hints detected; use analysis-only L3 route and skip Coder by default.
  - Interface hints detected; include InterfaceMapper for boundaries and contracts.
  - Large or risky hints detected; include the full route.
  skipped_agents:
  - Coder
  - PromptEngineer
  route_key: evaluation_task
