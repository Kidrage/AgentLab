validation_gates:
- id: preflight_context
  owner: Supervisor
  required: true
  description: Confirm project config, context pack, repo map, and user request were
    read or marked missing.
  evidence:
  - supervisor_plan.md lists files read
  - missing inputs are explicitly named
- id: route_and_budget
  owner: Supervisor
  required: true
  description: Publish selected route, skipped agents, token budget, warning threshold,
    and stop threshold.
  evidence:
  - supervisor_plan.md route section
  - supervisor_plan.md token budget table
- id: harness_status
  owner: Supervisor
  required: true
  description: Confirm AGENTS.md, harness_policy.yml, project memory, and task feedback
    artifacts are present or explicitly marked pending.
  evidence:
  - harness-status output or equivalent summary in supervisor_plan.md
  - stale or missing harness inputs listed before execution
- id: scoped_edit_authorization
  owner: Supervisor
  required: true
  description: Name editable files or explicitly keep the task in proposal-only mode.
  evidence:
  - approved editable files list
  - source write policy
- id: implementation_report
  owner: Coder
  required: true
  description: Record changed files, exact commands, backend, and unresolved risks.
  evidence:
  - implementation_report.md
- id: validation_evidence
  owner: TesterAuditor
  required: true
  description: Record validation commands that were actually run and distinguish skipped
    checks.
  evidence:
  - validation_report.md command log
  - audit_report.md findings
- id: feedback_promotion
  owner: TesterAuditor
  required: true
  description: Flag repeated user corrections or audit findings that should become
    config rules, validation gates, scripts, or AGENTS.md updates.
  evidence:
  - audit_report.md repeated-pattern notes
  - proposed harness_policy.yml or validation_gates.yml update when needed
memory_policy:
  version: 1
  storage:
    mode: local_first
    workspace_root: projects
    project_root: projects/<ProjectName>
    authoritative_task_state: runs/task_xxxx
    authoritative_project_memory: agent_docs
    server_sync: optional_future_phase
    github_private_backup: planned_local_first_manual_sync
    workspace_harness_map: AGENTS.md
  records:
    workspace_knowledge:
    - AGENTS.md
    - config/harness_policy.yml
    - config/brain_governance.yml
    - config/validation_gates.yml
    task_state:
    - user_request.md
    - supervisor_plan.md
    - reposcout_report.md
    - implementation_report.md
    - validation_report.md
    - audit_report.md
    - archive_update.md
    - workflow_plan.yml
    - cost_ledger.yml
    - brain_decisions.yml
    - USER_DECISION_REQUIRED.md
    project_memory:
    - 00_CONTEXT_PACK.md
    - 01_REPO_MAP.md
    - 02_TASK_LEDGER.yml
    - 03_DECISION_LOG.md
    - 04_INTERFACE_REGISTRY.md
    - 05_CHANGELOG_AGENT.md
    - 06_RISK_REGISTER.md
    - 07_DEVELOPMENT_LOG.md
    - 08_CODEX_DIALOGUE_LOG.md
    - 09_COST_LEDGER.yml
    - 10_SYNC_LEDGER.yml
  drift_controls:
  - Start every task from project memory and active task state, not chat history alone.
  - Keep long context compressed into reports before passing it to later agents.
  - Record assumptions and unresolved risks before implementation.
  - Update project memory only from validated reports.
  - Never claim a test, build, or manual verification passed without evidence.
  - Trigger AgentLab only when the user explicitly asks to use AgentLab.
  - Record every AgentLab team action in the project development log.
  - Record Codex Coder dialogue summaries and implementation actions in the dialogue
    log.
  - Record DeepSeek token usage when available and Codex Plus execution as manual/unavailable
    for exact billing.
  - Require a brain traversal request before any full-directory or full-repository
    scan.
  - Stop and replan when repeated loops or task-goal drift are detected.
  - Treat AGENTS.md as a map into local memory and config, not a full duplicate of
    policy.
  - Promote repeated user feedback or audit findings into harness_policy, validation
    gates, scripts, or concise project memory.
  - Run harness-status before relying on stale project memory for planning.
execution_policy:
  schema_version: 3
  budget_mode_policy:
    default_budget_mode: balanced
    available_modes:
    - frugal
    - balanced
    - max_quality
    selection_methods:
    - cli_flag: --budget {frugal|balanced|max-quality}
    - env_var: AGENTLAB_BUDGET_MODE
    - user_request_md_keyword: 'budget_mode:'
    - default: balanced
    mode_philosophy:
      frugal:
        goal: "\u6700\u4F4E\u6210\u672C\u8DD1\u901A"
        allow_sacrifice:
        - "\u63A8\u7406\u6DF1\u5EA6"
        - "\u5BA1\u67E5\u8986\u76D6\u7387"
        - "\u6A21\u578B\u5F3A\u5EA6"
        forbid_sacrifice:
        - "\u9AD8\u98CE\u9669\u4EFB\u52A1\u7684\u6D4B\u8BD5/\u786E\u8BA4\u95E8\u7981"
        auto_upgrade_on:
        - R2
        - R3
        auto_upgrade_to: balanced
      balanced:
        goal: "\u8D28\u91CF/\u6210\u672C\u5E73\u8861"
        allow_sacrifice:
        - "\u4E0D\u5FC5\u8981\u7684\u5168\u91CF\u4E0A\u4E0B\u6587\u626B\u63CF"
        forbid_sacrifice:
        - "\u6838\u5FC3\u63A5\u53E3\u7406\u89E3"
        - "\u6D4B\u8BD5\u95ED\u73AF"
        auto_upgrade_on:
        - R3
        auto_upgrade_to: max_quality
      max_quality:
        goal: "\u5173\u952E\u4EFB\u52A1\u9AD8\u53EF\u9760"
        allow_sacrifice:
        - "\u6210\u672C"
        - "\u901F\u5EA6"
        forbid_sacrifice:
        - "\u4E8B\u5B9E\u6821\u9A8C"
        - "\u53CC\u6A21\u578B\u590D\u6838"
        - "\u56DE\u6EDA\u8BA1\u5212"
  execution_policy:
    execution_tier: T3
    coder_agent: Coder
    allowed_output_modes:
    - patch_plan
    - diff
    - implementation_notes
    default_api_coder:
      model: qwen3-coder-next
      provider: openrouter
      profile_ref: qwen3_coder_next_openrouter
      max_output_tokens: 4096
      temperature: 0.1
    external_ide_window:
      enabled: false
      activation_signal:
        env_var: AGENTLAB_EXTERNAL_CODER
        signal_file: EXTERNAL_CODER_READY
        cli_flag: --executor external_ide
      allowed_for_budgets:
      - balanced
      - max_quality
      handoff_protocol: "AgentLab \u5927\u8111\u5C42\u5B8C\u6210\u6240\u6709\u89C4\
        \u5212/\u611F\u77E5\u5DE5\u4F5C\u540E, \u751F\u6210\u5B8C\u6574 handoff prompt\uFF0C\
        \u5305\u542B scope + repo context + interface \u5951\u7EA6\u3002 \u5916\u90E8\
        \ AI \u53EA\u9700\u6267\u884C\u7F16\u7801\uFF0C\u65E0\u9700\u81EA\u884C\u89C4\
        \u5212\u3002 \u5916\u90E8 AI \u53EF\u81EA\u7531\u9009\u62E9\u5B9E\u73B0\u65B9\
        \u5F0F/\u4EE3\u7801\u98CE\u683C/\u7B97\u6CD5/\u5E93, \u4F46\u5FC5\u987B\u9075\
        \u5B88 Supervisor \u6279\u51C6\u7684 scope \u548C interface \u5951\u7EA6\u3002\
        \n"
      handoff_files:
      - supervisor_plan.md
      - reposcout_report.md
      - interface_map.md
      - research_notes.md
      handoff_output: implementation_report.md
    require_context_before_coding: true
    forbid_monolithic_patch_for:
    - S2
    - S3
    - S4
    api_coder_outputs:
    - implementation_report.md
    - patch_proposal.diff
    - files_to_change.yml
    patch_application_policy: patch_proposal_first
  brain_policy:
    brain_tier: T1
    brain_agent: Supervisor
    decision_axes:
    - Size
    - Risk
    - Budget
    required_output_metadata:
    - budget_mode
    - project_size
    - risk_level
    - model_used
    - provider
    - token_usage
    - fallback_or_block_reason
    R2_required_output: risk_checklist
    R3_required_outputs:
    - risk_checklist
    - rollback_plan
    - failure_modes
  perception_policy:
    perception_tier: T2
    perception_agents:
    - RepoScout
    - InterfaceMapper
    - Researcher
    require_context_before_coding: true
    R2_extra:
      RepoScout: must_output_related_file_list
      InterfaceMapper: must_list_interface_contracts
  audit_policy:
    audit_tier: T4
    audit_agents:
    - TesterAuditor
    - Verifier
    cross_family_review: "\u4E0E Coder \u4F7F\u7528\u4E0D\u540C\u6A21\u578B\u5BB6\u65CF\
      \u3002 Coder \u7528 Qwen \u2192 \u5BA1\u67E5\u7528 DeepSeek\uFF1B Coder \u7528\
      \ DeepSeek \u2192 \u5BA1\u67E5\u7528 Qwen\uFF1B Coder \u7528\u5916\u90E8 IDE\
      \ AI \u2192 \u5BA1\u67E5\u5C42\u81F3\u5C11\u7528\u4E00\u4E2A\u72EC\u7ACB API\
      \ \u6A21\u578B\u3002\n"
    R2_required: independent_model_review
    R3_required: dual_model_review
    tester_auditor_forbidden: "\u4E0D\u53EA\u505A\u683C\u5F0F\u5316\u68C0\u67E5\u3002\
      \u5FC5\u987B\u8BBE\u8BA1\u6D4B\u8BD5\u3001\u89E3\u91CA\u6267\u884C\u7ED3\u679C\
      \u3001\u5BA1\u67E5\u56DE\u5F52\u98CE\u9669\u3002\n"
  archive_policy:
    archive_tier: T5
    archive_agent: Archivist
    required_outputs:
    - changelog
    - decisions.md
    - known_risks.md
    R2_extra: must_record_rollback_point
    R3_extra: must_record_full_risk_context
  cache_policy:
    explicit_management: true
    requires:
    - repo_context_hash
    - prompt_prefix_hash
    - provider_cache_id
    notes: "\u7F13\u5B58\u4E0D\u8DE8 provider\u3002\u540C\u4E00 provider \u5185\uFF0C\
      \u901A\u8FC7\u7EDF\u4E00 repo_context_block \u4F5C\u4E3A\u56FA\u5B9A prefix\
      \ \u6CE8\u5165\uFF0C\u540E\u7EED Agent \u590D\u7528\u540C\u4E00 prefix/context\
      \ id\u3002 \u4E0D\u5047\u5B9A\u8DE8 Agent \u81EA\u52A8 cache hit\u3002\n"
  logging_policy:
    record_per_call:
    - agent
    - model
    - provider
    - input_tokens
    - cache_hit_tokens
    - output_tokens
    - estimated_cost
    record_per_run:
    - budget_mode
    - project_size
    - risk_level
    - total_estimated_cost
    - human_confirmation_required
    - rollback_point
harness_policy:
  version: 1
  owner: Supervisor
  provider: deepseek
  source_strategy: https://openai.com/zh-Hans-CN/index/harness-engineering/
  principles:
  - Treat harness files as a navigation map, not a duplicate manual.
  - Keep repo-local knowledge as the system of record; chat memory is advisory only.
  - Promote repeated human feedback, audit findings, or recurring mistakes into rules,
    gates, or scripts.
  - Prefer small mechanical checks over repeated model judgment when the pattern is
    stable.
  - Keep every task legible through plans, reports, command evidence, and memory updates.
  - Garbage-collect stale or contradictory guidance before it becomes hidden policy
    debt.
  map_governance:
    root_map: AGENTS.md
    max_root_map_lines: 120
    required_root_maps:
    - AGENTS.md
    - README.md
    - OPERATING_MODEL.md
    - DRIVER_PROTOCOL.md
    - config/README.md
    required_project_maps:
    - project_config.yml
    - agent_docs/00_CONTEXT_PACK.md
    - agent_docs/01_REPO_MAP.md
    - agent_docs/02_TASK_LEDGER.yml
    - agent_docs/03_DECISION_LOG.md
    - agent_docs/04_INTERFACE_REGISTRY.md
    - agent_docs/06_RISK_REGISTER.md
    - agent_docs/10_SYNC_LEDGER.yml
  freshness:
    warn_after_days:
      agent_docs/00_CONTEXT_PACK.md: 30
      agent_docs/01_REPO_MAP.md: 14
      agent_docs/04_INTERFACE_REGISTRY.md: 30
      agent_docs/06_RISK_REGISTER.md: 30
  feedback_loop:
    required_task_artifacts:
    - workflow_plan.yml
    - 01_supervisor_plan.md
    - 06_implementation_report.md
    - 07_validation_report.md
    - 08_audit_report.md
    - brain_decisions.yml
