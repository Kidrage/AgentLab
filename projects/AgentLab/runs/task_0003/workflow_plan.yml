included_agents:
  Supervisor:
    template_path: agent_templates/supervisor.md
    role: Coordinates scope, routing, token budgets, stop rules, and handoffs.
    model_profile: coordinator
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
    - project_config.yml
    - agent_docs/00_CONTEXT_PACK.md
    - agent_docs/01_REPO_MAP.md
    - config/execution_policy.yml
    - runs/task_xxxx/user_request.md
    required_outputs:
    - runs/task_xxxx/supervisor_plan.md
  RepoScout:
    template_path: agent_templates/reposcout.md
    role: Reads repository structure and reports relevant context without changing
      files.
    model_profile: scout
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
    - runs/task_xxxx/reposcout_report.md
  InterfaceMapper:
    template_path: agent_templates/interface_mapper.md
    role: Tracks contracts across UI, algorithm, metadata, I/O, and integration layers.
    model_profile: architect
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
    - runs/task_xxxx/interface_map.md
  Coder:
    template_path: agent_templates/coder.md
    role: Codex Plus execution lane for real code edits, file changes, and project
      commands.
    model_profile: coder
    can_edit_source: true
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: supervisor_approved_files_only
    shell_policy: non_destructive_only
    execution_owner: codex_plus
    auxiliary_model_policy: do_not_use_deepseek_for_actual_source_edits
    quota_policy: ask_user_before_qwen_api_coding_or_pause
    quota_fallback:
      when: codex_quota_exhausted
      choices:
      - pause_until_codex_refresh
      - switch_to_deepseek_brain_qwen_coder_api
      api_fallback_provider: qwen
      api_fallback_profile: qwen_coder_aux
      automatic_patch_application: false
    allowed_backends:
    - codex
    - aider
    - qwen_api_patch_proposal
    required_outputs:
    - runs/task_xxxx/implementation_report.md
  TesterAuditor:
    template_path: agent_templates/tester_auditor.md
    role: Validates actual behavior and audits diffs before work is accepted.
    model_profile: auditor
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: validation_commands_only
    required_outputs:
    - runs/task_xxxx/validation_report.md
    - runs/task_xxxx/audit_report.md
  Archivist:
    template_path: agent_templates/archivist.md
    role: Updates project memory and long-run continuity records after validation.
    model_profile: archivist
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: true
    source_write_policy: never
    required_outputs:
    - runs/task_xxxx/archive_update.md
model_profiles:
  Supervisor:
    description: Planning, routing, budget control, and synthesis.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.2
    max_output_tokens: 1800
  RepoScout:
    description: Repository reading and concise mapping.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.1
    max_output_tokens: 2200
  InterfaceMapper:
    description: Interfaces, contracts, boundaries, and architecture-sensitive review.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.15
    max_output_tokens: 2200
  Coder:
    description: Real code edits, file changes, project commands, and implementation
      are handled by Codex Plus.
    provider: codex_plus_manual
    model: Codex Plus
    temperature: 0.15
    max_output_tokens: 3200
  TesterAuditor:
    description: Diff review, validation interpretation, and risk finding.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.1
    max_output_tokens: 2200
  Archivist:
    description: Project memory compression and continuity updates.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.1
    max_output_tokens: 1600
validation_gates:
- id: preflight_context
  owner: Supervisor
  required: true
  description: Confirm project config, context pack, repo map, and user request were
    read or marked missing.
  evidence:
  - supervisor_plan.md lists files read
  - missing inputs are explicitly named
- id: route_and_budget
  owner: Supervisor
  required: true
  description: Publish selected route, skipped agents, token budget, warning threshold,
    and stop threshold.
  evidence:
  - supervisor_plan.md route section
  - supervisor_plan.md token budget table
- id: scoped_edit_authorization
  owner: Supervisor
  required: true
  description: Name editable files or explicitly keep the task in proposal-only mode.
  evidence:
  - approved editable files list
  - source write policy
- id: implementation_report
  owner: Coder
  required: true
  description: Record changed files, exact commands, backend, and unresolved risks.
  evidence:
  - implementation_report.md
- id: validation_evidence
  owner: TesterAuditor
  required: true
  description: Record validation commands that were actually run and distinguish skipped
    checks.
  evidence:
  - validation_report.md command log
  - audit_report.md findings
- id: memory_update
  owner: Archivist
  required_for_routes:
  - medium_task
  - interface_sensitive_task
  - large_or_risky_task
  description: Update project memory only after validation evidence exists.
  evidence:
  - archive_update.md
  - proposed updates to agent_docs
memory_policy:
  version: 1
  storage:
    mode: local_first
    project_root: projects/<ProjectName>
    authoritative_task_state: runs/task_xxxx
    authoritative_project_memory: agent_docs
    server_sync: optional_future_phase
  records:
    task_state:
    - user_request.md
    - supervisor_plan.md
    - reposcout_report.md
    - implementation_report.md
    - validation_report.md
    - audit_report.md
    - archive_update.md
    - workflow_plan.yml
    - cost_ledger.yml
    - brain_decisions.yml
    - USER_DECISION_REQUIRED.md
    project_memory:
    - 00_CONTEXT_PACK.md
    - 01_REPO_MAP.md
    - 02_TASK_LEDGER.yml
    - 03_DECISION_LOG.md
    - 04_INTERFACE_REGISTRY.md
    - 05_CHANGELOG_AGENT.md
    - 06_RISK_REGISTER.md
    - 07_DEVELOPMENT_LOG.md
    - 08_CODEX_DIALOGUE_LOG.md
    - 09_COST_LEDGER.yml
  drift_controls:
  - Start every task from project memory and active task state, not chat history alone.
  - Keep long context compressed into reports before passing it to later agents.
  - Record assumptions and unresolved risks before implementation.
  - Update project memory only from validated reports.
  - Never claim a test, build, or manual verification passed without evidence.
  - Trigger AgentLab only when the user explicitly asks to use AgentLab.
  - Record every AgentLab team action in the project development log.
  - Record Codex Coder dialogue summaries and implementation actions in the dialogue
    log.
  - Record DeepSeek token usage when available and Codex Plus execution as manual/unavailable
    for exact billing.
  - Require a brain traversal request before any full-directory or full-repository
    scan.
  - Stop and replan when repeated loops or task-goal drift are detected.
execution_policy:
  version: 1
  brain_policy:
    required_provider: deepseek
    deepseek_required_for_all_agentlab_tasks: true
    applies_to:
    - simulation
    - small_task
    - medium_task
    - interface_sensitive_task
    - research_sensitive_task
    - large_or_risky_task
    - formal_engineering_task
    brain_agents:
    - Supervisor
    - RepoScout
    - Researcher
    - InterfaceMapper
    - CodexPromptGenerator
    - TesterAuditor
    - Archivist
    codex_may_simulate_brain: false
    codex_brain_override_requires_user_config_change: true
    on_deepseek_missing_key: ask_user
    on_deepseek_quota_exceeded: ask_user
    on_deepseek_rate_limited: ask_user
    on_deepseek_provider_error: ask_user
    user_decision_file: USER_DECISION_REQUIRED.md
    required_report_metadata:
    - brain_provider
    - model
    - api_called
    - token_usage
    - fallback_or_block_reason
  coder_policy:
    primary_executor: codex_plus_manual
    coding_agent: Coder
    api_fallback_executor: qwen
    api_fallback_model_profile: qwen_coder_aux
    api_fallback_stack:
      brain_provider: deepseek
      coder_provider: qwen
      mode: deepseek_brain_qwen_coder_api
    codex_quota_exact_usage_source: unavailable_manual
    quota_check_required_before_large_edits: true
    if_codex_quota_insufficient: ask_user
    no_automatic_deepseek_coding: true
    no_automatic_qwen_coding: false
    qwen_coding_requires_explicit_user_approval: true
    deepseek_coding_allowed: false
    api_coder_outputs:
    - implementation_report.md
    - patch_proposal.diff
    - files_to_change.yml
    - validation_instructions.md
    api_coder_application_policy: patch_proposal_first
    automatic_patch_application: false
    user_choices_when_quota_insufficient:
    - pause_until_codex_refresh
    - switch_to_deepseek_brain_qwen_coder_api
    decision_prompt: Codex quota may be insufficient. Should AgentLab pause until
      Codex quota refreshes, or switch to the DeepSeek brain + Qwen Coder pure API
      fallback?
  logging_policy:
    record_brain_api_calls: true
    record_codex_manual_execution: true
    record_simulation_as_deepseek_required: true
    mark_codex_brain_simulation_as_policy_violation_unless_user_approved: true
missing_inputs: []
aider_plan: null
notes:
- 'Plan only: no model calls, source edits, dependency installs, or validation commands
  were run.'
- Use this plan as the visible contract before starting agent execution.
- 'Brain policy: DeepSeek must execute planning/review brain stages for simulated,
  small, and large AgentLab tasks.'
- Codex may not silently simulate the brain layer unless the user changes the policy.
- Project config loaded.
