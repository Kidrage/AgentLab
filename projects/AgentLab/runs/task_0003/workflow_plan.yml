execution_backend: codex
route:
  task_size: medium
  agents:
  - Supervisor
  - RepoScout
  - InterfaceMapper
  - Coder
  - TesterAuditor
  - Archivist
  rationale:
  - Supervisor always defines scope, token budget, and stop rules.
  - Route selected by interface_sensitive_task using smallest_safe_route rules.
  - Coder and Tester/Auditor are required for implementation and verification.
  - Research hints detected; include Researcher when route requires current or external
    facts.
  - Interface hints detected; include InterfaceMapper for boundaries and contracts.
  skipped_agents:
  - CodexPromptGenerator
  - Researcher
  route_key: interface_sensitive_task
