# AgentLab Task Ledger / 任务账本
#
# Field definitions / 字段定义:
#   task_id:       unique task identifier / 唯一任务标识
#   title:         short description / 简短描述
#   status:        pending | active | blocked | complete | archived
#   priority:      P0 (critical) | P1 (high) | P2 (medium) | P3 (low)
#   category:      feature | bugfix | research | refactor | docs | infra
#   depends_on:    list of task_ids that must complete first / 依赖的前置任务列表
#   blocked_reason: brief reason when status=blocked / 阻塞原因（仅当 blocked 时）
#   route:         agent route used / 使用的 Agent 路线
#   summary:       one-line outcome / 一句话成果
#   started_at:    ISO 8601 timestamp when first agent ran
#   completed_at:  ISO 8601 timestamp when archivist finished

