# AgentLab Task Ledger / 任务账本
#
# === Task Lifecycle / 任务生命周期 ===
#
#   pending  →  active  →  complete  →  archived
#                ↓            ↓
#             blocked      blocked (保留 audit trail)
#                ↓
#           大脑判断 → cleared（清除）或 reopen（重新执行）
#
# === Blocking Policy / 阻塞策略 ===
#   - 当 status=blocked 超过 7 天或 blocked_reason 已过时：
#     Supervisor 可以在 supervisor_plan.md 中建议 "CLEAR" 或 "REOPEN"
#   - 用户可以在 Web UI 中手动清除或重新激活
#   - blocked 任务不清除 physical 文件（保留审计追踪），仅标记 status=archived
#
# === Naming Convention / 命名规范 ===
#   - task_id: task_0001, task_0002, ... (4-digit sequential)
#   - title: 可编辑，由 Supervisor 在 intake 阶段确定或用户手动修改
#   - 大脑层判断赋予的标题优于用户 raw 描述
#
# === Field definitions / 字段定义 ===
#   task_id:       unique sequential id / 唯一递增ID
#   title:         editable short name / 可编辑简短名称
#   status:        pending | active | blocked | complete | archived
#   priority:      P0 (critical) | P1 (high) | P2 (medium) | P3 (low)
#   category:      feature | bugfix | research | refactor | docs | infra
#   depends_on:    list of task_ids that must complete first / 依赖的前置任务
#   blocked_reason: brief reason when status=blocked / 阻塞原因
#   cleared_reason: brief reason when status=archived / 清除原因
#   route:         agent route used / 使用的 Agent 路线
#   summary:       one-line outcome / 一句话成果
#   started_at:    ISO 8601 timestamp
#   completed_at:  ISO 8601 timestamp

