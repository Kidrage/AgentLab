schema_version: 1
packet_type: agentlab_coalesced_cli_shell_session
backend: hermes
command: hermes
mode: full_cli
tier: performance
coalescing_mode: board_mediated
provider_calls_executed_by_packet_generation: false
agentlab_authority:
  project_memory_authoritative: true
  shell_state_counts_as_project_memory: false
  production_promotion_allowed: false
task_contract:
  task_kind: cli_shell_native_runtime_acceptance
  objective: Use the registered native shell coordination surface to evaluate an embedded
    synthetic fixture and return separate role evidence without reading AgentLab project
    files.
  acceptance_scope: synthetic_native_surface_smoke
  private_project_context_loaded: false
  synthetic_input_only: true
  production_changes_allowed: false
  agentlab_memory_remains_authoritative: true
execution_contract:
  trusted_runner_required: true
  trusted_runner_env: AGENTLAB_TRUSTED_CLI_SHELL_RUNNER=1
  frontdesk_role_invocations: 0
  provider_invocation_count_claimed: false
  receipts_materialized_by_agentlab_runner: true
  acceptance_scope: synthetic_native_surface_smoke
  isolated_execution_workspace_required: true
  project_read_tools_allowed: false
  native_surface: hermes_kanban
  coordination_semantics: board_orchestrated_multi_worker
  single_provider_session_claimed: false
  command_spec:
    entrypoint: hermes
    command_family: kanban
    board_slug: agentlab-cli-shell-acceptance
    role_task_command:
    - kanban
    - create
    - <role_task_title>
    - --body
    - <role_task_body>
    - --assignee
    - <configured_profile_or_default>
    - --workspace
    - scratch
    - --idempotency-key
    - <packet_and_role_id>
    - --json
    dispatch_command:
    - kanban
    - dispatch
    - --max
    - <role_count>
    - --json
    collection_commands:
    - - kanban
      - show
      - <task_id>
    - - kanban
      - runs
      - <task_id>
    worker_process_note: Kanban consolidates AgentLab submission and board governance
      but may spawn one shell-managed worker process per delegated role.
delegated_roles:
- role: Supervisor
  receipt_path: role_receipts/supervisor_role_session_receipt.yml
  validation_evidence_path: role_receipts/supervisor_validation_evidence.yml
  required_outputs:
  - role_session_receipt.yml
  - tool_or_mcp_usage_ledger.yml
  - artifact_manifest_or_findings.yml
  model_route:
    configured_model_key: codex_gpt_5_5_high_hermes_oauth
    provider: openai-codex
    model_id: gpt-5.5
    reasoning_effort: high
    base_url: https://chatgpt.com/backend-api/codex
    applied_to_shell_invocation: true
    shell_model_selection: explicit_catalog_route
    fallback_worker: claude_code
    fallback_invocation_contract: claude
    fallback_model_key: deepseek_v4_pro
    fallback_provider: deepseek
    fallback_model_id: deepseek-v4-pro
    workflow_shell_profile: agentlabsupervisor
    required_profile_config:
      model.provider: openai-codex
      model.default: gpt-5.5
      model.base_url: https://chatgpt.com/backend-api/codex
      agent.reasoning_effort: high
  task:
    objective: Validate the synthetic authority and delegation invariants from the
      Supervisor role; do not read any project files.
    read_scope: []
    write_scope:
    - returned_artifacts/
    private_project_context_loaded: false
    model_file_writes_allowed: false
    synthetic_fixture:
      fixture_id: agentlab-cli-native-surface-smoke-v1
      packet_state: candidate
      project_context: absent
      production_promotion: forbidden
      receipt_policy: one_result_per_delegated_role
      validation_policy: non_empty_findings_and_validation_per_role
      delegated_role: Supervisor
    production_changes_allowed: false
    must_return_finding_artifact: true
- role: PromptEngineer
  receipt_path: role_receipts/promptengineer_role_session_receipt.yml
  validation_evidence_path: role_receipts/promptengineer_validation_evidence.yml
  required_outputs:
  - role_session_receipt.yml
  - tool_or_mcp_usage_ledger.yml
  - artifact_manifest_or_findings.yml
  model_route:
    configured_model_key: deepseek_v4_flash
    provider: deepseek
    model_id: deepseek-v4-flash
    base_url: https://api.deepseek.com
    applied_to_shell_invocation: true
    shell_model_selection: explicit_catalog_route
    fallback_worker: hermes
    fallback_invocation_contract: hermes
    fallback_model_key: deepseek_v4_pro
    fallback_provider: deepseek
    fallback_model_id: deepseek-v4-pro
    workflow_shell_profile: agentlabpromptengineer
    required_profile_config:
      model.provider: deepseek
      model.default: deepseek-v4-flash
      model.base_url: https://api.deepseek.com
      agent.reasoning_effort: ''
  task:
    objective: Validate that the synthetic role-result contract is deterministic and
      role-separated; do not read any project files.
    read_scope: []
    write_scope:
    - returned_artifacts/
    private_project_context_loaded: false
    model_file_writes_allowed: false
    synthetic_fixture:
      fixture_id: agentlab-cli-native-surface-smoke-v1
      packet_state: candidate
      project_context: absent
      production_promotion: forbidden
      receipt_policy: one_result_per_delegated_role
      validation_policy: non_empty_findings_and_validation_per_role
      delegated_role: PromptEngineer
    production_changes_allowed: false
    must_return_finding_artifact: true
acceptance_contract:
  must_return_one_receipt_per_role: true
  must_return_validation_evidence_per_role: true
  agentlab_validation_required_before_acceptance: true
  shell_subagent_or_board_state_is_operational_only: true
source_plan: cli_shell_coalescing_plan.yml
