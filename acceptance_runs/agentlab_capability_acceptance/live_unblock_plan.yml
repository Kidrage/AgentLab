schema_version: 1
report_type: agentlab_live_unblock_plan
root: .
status: ready_for_internal_live_smoke
workflow_boundary: internal_agentlab_role_sessions
terminology:
  canonical_kind: private_role_session_acceptance_smoke
  canonical_label: private role-session acceptance smoke
  legacy_terms:
  - private live smoke
  - private live-smoke
  - live-smoke
  meaning: A minimal trusted-runner acceptance run that loads private project context
    through the configured AgentLab role-session worker and returns run-local candidate
    artifacts for structural QC.
  not_a_default_production_workflow: true
role_session_execution_boundary:
  trusted_runner_env_required: AGENTLAB_TRUSTED_LIVE_RUNNER=1
  role_session_acceptance_approval_env_required: AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
  session_health_only_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
    --session-health-only
  full_role_session_acceptance_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
    acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
  writer_role_session_acceptance_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
    acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
    --only run_crown_internal_writer_eval
  media_role_session_acceptance_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
    acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
    --only run_crown_internal_media_smoke
  session_health_requires_approval_env: false
  approval_gate_before_private_context: true
  private_context_commands_require_approval_env: true
  frontdesk_executes_role_session_acceptance_commands: false
  full_run_requires_trusted_status_pass: true
session_health_gate:
  status: fail
  clean: false
  issue_ids:
  - current_grok_session_health
  writer_selected_item_can_run: true
  media_selected_item_can_run: false
  interpretation: live_unblock_plan.status describes route/plan readiness; session_health_gate
    controls which selected private role-session item may run now.
acceptance_phase:
  entered_acceptance: true
  status: in_acceptance_pending_returned_artifacts
  final_acceptance_passed: false
  pending_item_ids:
  - run_crown_internal_writer_eval
  - run_crown_internal_media_smoke
  next_action: run_selected_trusted_live_runner_items_then_collect_selected_reports
  trusted_status_request_current: true
items:
- id: run_crown_internal_writer_eval
  capability_id: crown_formal_live_narrative_eval
  agentlab_execution_owner: Writer
  status: ready
  current_return:
    trusted_status_item_present: true
    status: pending
    pending_reason: agy_writer_session_health_blocked_before_private_writer_smoke
    required_files_exist: false
    returned_candidate_artifacts_accepted: false
    acceptance_blocker: missing_required_files
    next_action: rerun_agy_writer_contract_probe_from_trusted_runtime_then_run_trusted_writer_smoke
    selected_item_collect_status: pending_selected_item
    selected_item_accepted: false
  required_operator_action: Submit the formal Crown single-chapter live eval as an
    AgentLab Writer role-session and monitor run-local artifacts.
  risk: Private Crown context is used inside the configured AgentLab Writer workflow;
    generated prose remains candidate-only until promotion.
  route:
    ready: true
    auth_probe: 'yes'
    worker: agy
    invocation_contract: agy_writer
    capacity_route: WriterAgy
    model_key: gemini_3_5_flash_high_agy_oauth
    model_provider: agy_gemini_oauth
    model_runtime_provider: agy-gemini-oauth
  historical_blocker:
    provider: deepseek
    model: deepseek-v4-flash
    error: Connection error.
  agentlab_command: ./agentlab.sh narrative-eval run --project Crown_of_Ash --suite
    crown_live_single_chapter_probe_20260707 --mode live --chapters 1 --timestamp
    <internal_live_run_id> --writer-worker agy
  safe_command_after_approval: ./agentlab.sh narrative-eval run --project Crown_of_Ash
    --suite crown_live_single_chapter_probe_20260707 --mode live --chapters 1 --timestamp
    <internal_live_run_id> --writer-worker agy
  trusted_runner_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
    acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
    --only run_crown_internal_writer_eval
  selected_collect_command: ./agentlab.sh trusted-live-runner-collect --request acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.yml
    --out acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_collect.yml
    --item run_crown_internal_writer_eval
  must_not_do:
  - do not copy candidate chapters into production/manuscript automatically
  - do not run live narrative eval without Writer role-session evidence
  - do not run broad 1-20 or 1500-chapter live generation before one approved single-chapter
    pass
  evidence:
  - config/agent_model_profiles.yml
  - config/model_catalog.yml
  - config/agent_role_bindings.yml
  - config/worker_invocation_contracts.yml
  - config/model_capacity.yml
- id: run_crown_internal_media_smoke
  capability_id: grok_xai_media_backend
  agentlab_execution_owner: ArtifactProducer
  status: ready
  current_return:
    trusted_status_item_present: true
    status: pending
    pending_reason: missing_candidate_artifacts
    required_files_exist: false
    returned_candidate_artifacts_accepted: false
    acceptance_blocker: missing_required_files
    next_action: run_trusted_live_command_and_collect_required_artifacts
    selected_item_collect_status: pending_selected_item
    selected_item_accepted: false
  required_operator_action: Submit the Crown media role-session acceptance smoke through
    the AgentLab ArtifactProducer role-session and monitor run-local candidate artifacts.
  accepted_env: []
  route:
    backend_id: hermes_grok_oauth
    adapter_kind: local_grok_cli
    worker_id: grok
    role_owner: ArtifactProducer
    role_worker_binding: true
    internal_worker: true
    execution_mode: orchestrated_worker
    approval_required: false
    local_cli_available: pass
  agentlab_commands:
  - ./agentlab.sh media-backend-preflight --contract projects/Crown_of_Ash/runs/task_probe_crown_comic_video_poster_series_scaffold_20260707/media_generation_contract.yml
    --out acceptance_runs/agentlab_capability_acceptance/grok_media_preflight_current.yml
  - ./agentlab.sh media-backend-execute --contract projects/Crown_of_Ash/runs/task_probe_crown_comic_video_poster_series_scaffold_20260707/media_generation_contract.yml
    --out-dir projects/Crown_of_Ash/runs/task_media_role_session_acceptance_<id>/artifacts/media_backend_live_internal_<id>
    --live --role ArtifactProducer --worker grok --project Crown_of_Ash --run-id task_media_role_session_acceptance_<id>
  safe_commands_after_approval:
  - ./agentlab.sh media-backend-preflight --contract projects/Crown_of_Ash/runs/task_probe_crown_comic_video_poster_series_scaffold_20260707/media_generation_contract.yml
    --out acceptance_runs/agentlab_capability_acceptance/grok_media_preflight_current.yml
  - ./agentlab.sh media-backend-execute --contract projects/Crown_of_Ash/runs/task_probe_crown_comic_video_poster_series_scaffold_20260707/media_generation_contract.yml
    --out-dir projects/Crown_of_Ash/runs/task_media_role_session_acceptance_<id>/artifacts/media_backend_live_internal_<id>
    --live --role ArtifactProducer --worker grok --project Crown_of_Ash --run-id task_media_role_session_acceptance_<id>
  trusted_runner_command: AGENTLAB_TRUSTED_LIVE_RUNNER=1 AGENTLAB_ROLE_SESSION_ACCEPTANCE_APPROVED=1
    acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.sh
    --only run_crown_internal_media_smoke
  selected_collect_command: ./agentlab.sh trusted-live-runner-collect --request acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_request.yml
    --out acceptance_runs/agentlab_capability_acceptance/trusted_live_runner_collect.yml
    --item run_crown_internal_media_smoke
  must_not_do:
  - do not print or commit OAuth/session secret values
  - do not run media-backend-execute --live without ArtifactProducer role-session
    evidence
  - do not promote generated media without QC or human acceptance
  evidence:
  - projects/Crown_of_Ash/runs/task_probe_crown_comic_video_poster_series_scaffold_20260707/media_generation_contract.yml
  - acceptance_runs/agentlab_capability_acceptance/grok_media_preflight_current.yml
  - config/media_generation_backends.yml
  - config/agent_role_bindings.yml
  - config/worker_invocation_contracts.yml
  - agent_runtime/media_backend_adapter.py
  source_contract_is_read_only_retained_evidence: false
notes:
- This plan contains secret names only, never secret values.
- The chat/frontdesk agent submits AgentLab commands and observes artifacts; Writer
  and ArtifactProducer own the live work.
- Generated outputs remain run-local candidates until configured QC and promotion
  gates pass.
