schema_version: 1
report_type: agentlab_agent_role_chain_audit
root: .
status: pass
source_files:
- config/agent_role_bindings.yml
- config/agent_model_profiles.yml
- config/worker_invocation_contracts.yml
- config/routing_rules.yml
- config/production_packs.yml
roles:
- role: Archivist
  status: pass
  responsibility: Archive and promote accepted outputs into project memory.
  boundary: Does not force promotion for packs that exclude archive or lack acceptance.
  allowed_workers:
  - git
  - claude_code
  - agy
  - hermes
  required_session: true
  issues: []
- role: ArtifactProducer
  status: pass
  responsibility: Produce non-code artifacts that follow the selected production-pack
    contract.
  boundary: Does not replace Coder for source-code implementation.
  allowed_workers:
  - codex
  - agy
  - grok
  - qwen
  required_session: true
  issues: []
- role: Coder
  status: pass
  responsibility: Implement code changes and code artifacts under the code_factory
    pack.
  boundary: Does not default to producing fiction, media, or article artifacts.
  allowed_workers:
  - claude_code
  - codex
  - aider
  - hermes
  required_session: true
  issues: []
- role: InterfaceMapper
  status: pass
  responsibility: Map code interfaces, contracts, and cross-module boundaries.
  boundary: Does not implement patches.
  allowed_workers:
  - ast_grep
  - claude_code
  - codex
  - agy
  required_session: true
  issues: []
- role: PromptEngineer
  status: pass
  responsibility: Prepare bounded execution prompts when a task needs a handoff prompt.
  boundary: Does not own implementation or promotion.
  allowed_workers:
  - hermes
  - claude_code
  - qwen
  required_session: true
  issues: []
- role: RepoScout
  status: pass
  responsibility: Read codebase structure and repository context for code tasks.
  boundary: Does not modify files.
  allowed_workers:
  - rg
  - claude_code
  - codex
  - agy
  required_session: true
  issues: []
- role: Researcher
  status: pass
  responsibility: Produce evidence-backed domain briefs for new domains or production-pack
    synthesis.
  boundary: Does not become a truth source without cited evidence.
  allowed_workers:
  - bl
  - claude_code
  - qwen
  - hermes
  required_session: true
  issues: []
- role: Reviewer
  status: pass
  responsibility: Audit narrative continuity, character state, timeline, POV, and
    style drift.
  boundary: Does not rewrite prose by default; emits findings and rewrite proposals.
  allowed_workers:
  - qwen
  - claude_code
  required_session: true
  issues: []
- role: Scribe
  status: pass
  responsibility: Maintain narrative ledgers and state-transition proposals.
  boundary: Does not treat unapproved candidate facts as production facts.
  allowed_workers:
  - qwen
  - claude_code
  - codex
  required_session: true
  issues: []
- role: Supervisor
  status: pass
  responsibility: Mission contract, route selection, scope, budget, production-pack
    selection, and approval gates.
  boundary: Does not silently edit source or bypass approval gates.
  allowed_workers:
  - hermes
  - qwen
  - claude_code
  required_session: true
  issues: []
- role: TesterAuditor
  status: pass
  responsibility: Run or record validation commands, audit risks, and capture evidence.
  boundary: Does not declare pass without evidence.
  allowed_workers:
  - pytest
  - claude_code
  - codex
  - hermes
  required_session: true
  issues: []
- role: Verifier
  status: pass
  responsibility: Check output contracts and handoff completeness.
  boundary: Does not edit implementation artifacts.
  allowed_workers:
  - ruff
  - mypy
  - eslint
  - claude_code
  - codex
  - hermes
  required_session: true
  issues: []
- role: Writer
  status: pass
  responsibility: Draft candidate longform narrative chapters and light-path continuity
    ledgers.
  boundary: Does not promote candidate text into production memory.
  allowed_workers:
  - agy
  - qwen
  - claude_code
  required_session: true
  issues: []
