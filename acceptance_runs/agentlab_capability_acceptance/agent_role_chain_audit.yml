invariants:
- every role has a responsibility and boundary
- every role has at least one allowed worker and requires a role session
- role allowed_workers must be reciprocated by worker allowed_roles
- every worker must explicitly allow or forbid every canonical role
- every cli_agent and fallback_cli_agent must match the selected invocation contract
  worker_id
- every cli_agent and fallback_cli_agent selected by runtime profiles must be allowed
  by role bindings
- every default and effective fallback model selected by runtime profiles must exist
  in model_catalog.yml
- every agent used by representative production chains must be a canonical role
- every agent used by representative production chains must own at least one effective
  lifecycle node
