independent_review:
  attempt_1:
    status: rejected_for_correction
    standards_findings:
      - Artifact roots could escape governed Production/release locations.
      - An FTS failure marked a shard stale before serving a BM25 fallback from it.
      - Direct search without a project identifier could expose multiple projects.
      - Handoff and Production evidence were incomplete.
    specification_findings:
      - Incremental sync trusted caller-supplied pass authority for unselected Production.
      - Full builds did not require current artifact content hashes.
      - Acceptance omitted zero-provider-call and Production before/after evidence.
  correction_1:
    status: implemented_and_regression_verified
    changed_modules:
      - agent_runtime/artifact_digest.py
      - agent_runtime/knowledge_system/migration.py
      - agent_runtime/knowledge_system/runtime.py
      - agent_runtime/knowledge_system/sources.py
      - agent_runtime/knowledge_system/storage.py
      - agent_runtime/project_artifact_steward.py
    tests:
      - tests/test_knowledge_system.py
      - tests/test_project_artifact_steward.py
    rereview_status: rejected_for_correction_2
    rereview_findings:
      - Narrative promotion receipts were not bound to current candidate lineage and release slot.
      - A validated edition directory exposed undeclared extra files as accepted evidence.
      - Local project artifact-index hash migrations were omitted from changed-source and rollback evidence.
  correction_2:
    status: implemented_and_full_regression_verified
    behavior:
      - Bind current release to candidate_set_id, candidate_set_sha256, release_slot, and receipt path.
      - Validate declared chapter paths and hashes and index only those files plus the validated receipt.
      - Record all ignored local project-fact migrations separately from Production content.
    rereview_status: rejected_for_correction_3
    rereview_findings:
      - Generic artifact entries under release_objects could bypass narrative lineage checks.
      - Symlinked Production paths could resolve into candidate content before policy inspection.
      - Symlinked Project Brain directories could expose another project as canonical evidence.
  correction_3:
    status: implemented_and_full_regression_verified
    behavior:
      - Restrict generic current artifacts to hash-matching paths rooted under real Production.
      - Admit release_objects only through the validated current_release contract.
      - Reject symlink components in project roots, canonical source roots, and selected Production paths.
    rereview_status: rejected_for_correction_4
    rereview_findings:
      - A symlinked system source root could expose candidate text as project-neutral canonical evidence.
      - A symlinked projects root was not detected because the lexical root itself was not inspected.
  correction_4:
    status: implemented_and_full_regression_verified
    behavior:
      - Reject symlink components for named files and directory roots collected as system knowledge.
      - Reject a symlinked lexical root and check every walked path before reading it.
      - Refuse project discovery, domain inference, and project collection through a symlinked projects root.
    rereview_status: passed
