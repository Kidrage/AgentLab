      - generation_order.yml
    evidence_required: false

  generate_or_source_assets:
    outputs:
      - asset_manifest.yml
      - sourced_assets/
    evidence_required: true
    evidence_types:
      - asset_count
      - asset_type_count

  integrate_and_assemble:
    outputs:
      - integrated_draft/
      - assembly_log.yml
    evidence_required: true

  cross_modal_qa:
    outputs:
      - cross_modal_qa_report.yml
      - sync_issues.yml
    evidence_required: true

  define_automation_scope:
    outputs:
      - automation_scope.yml
      - safety_boundaries.yml
    evidence_required: false

  create_script_or_workflow:
    outputs:
      - automation_script.py
      - workflow_config.yml
    evidence_required: false

  test_dry_run:
    outputs:
      - dry_run_results.yml
      - dry_run_log.txt
    evidence_required: true
    evidence_types:
      - execution_log
      - error_log

  deploy_and_monitor:
