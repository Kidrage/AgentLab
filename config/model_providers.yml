version: 2

# ─── AgentLab Model Provider Registry ─────────────────────────────────────
# 分层架构 (Model Tier Architecture) v3.0:
#
#   Agent backend 选择由 config/agent_model_profiles.yml 负责。
#   full_cli 默认大脑层 Supervisor — Hermes Codex OAuth / gpt-5.6-sol xhigh
#   full_cli Observer — Agy Gemini/Claude OAuth 独立容量池
#   full_cli Writer — Claude shell / DeepSeek V4
#   full_cli Researcher/ArtifactProducer — Hermes Grok OAuth（独立合同）
#   Gemini API key 路径 — gemini-2.5-flash-high，仅显式 fallback，不默认启用
#   direct API 模式 — 使用本文件 provider defaults 与 model_catalog facts
#
#  预算模式 (Budget Modes) — 用户可选:
#    🧠 brain_allocated (默认) — Supervisor 根据 L1/L2/L3 项目体量智能分配
#    ⚡ max_quality           — 全量运算，所有 Agent 用最强模型
#    💰 frugal                — 最低成本，flash+跳过非必要 agent
#
#  本地算力: Frugal 模式下优先使用本地 LLM (Ollama/vLLM)
#  外部IDE窗口: external_ide_ai 只是可选 provider 事实。
#  Coder 默认后端由 config/agent_model_profiles.yml 决定。
#  需要外部 IDE 接管时，选择 hybrid_ide mode 或显式激活 handoff。
# ──────────────────────────────────────────────────────────────────────────

defaults:
  provider: env:LLM_PROVIDER:deepseek
  fallback_provider: env:LLM_FALLBACK_PROVIDER:qwen3

providers:

  # ── T1 大脑层 Provider ──────────────────────────────────────────────
  deepseek:
    type: openai_compatible
    display_name: DeepSeek (Brain Tier)
    api_key: env:DEEPSEEK_API_KEY
    base_url: env:DEEPSEEK_BASE_URL:https://api.deepseek.com
    default_model: deepseek-v4-pro
    pricing_key: deepseek-v4-pro
    fallback_provider: qwen3
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - Brain layer default. 用于 Supervisor 规划/路由/决策。
      - 顶级推理能力，不可降级为 flash 模型做脑力工作。
      - 不可用时询问用户，不静默 fallback 到 Codex。

  # ── T1/T2 大脑备选 + 感知层主力 ────────────────────────────────────
  qwen3:
    type: openai_compatible
    display_name: Qwen3.7-Max (Brain/Perception Tier)
    api_key: env:DASHSCOPE_API_KEY
    base_url: env:DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3.7-max
    pricing_key: qwen3.7-max
    fallback_provider: deepseek
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - 大脑层备选 (替换 deepseek-v4-pro) + 感知层主力 (RepoScout, InterfaceMapper)。
      - 强推理能力，适合代码结构理解和架构分析。中文+代码理解表现优异。
      - API: DashScope OpenAI-compatible endpoint (兼容模式)。
      - 数值定价唯一来源: config/model_pricing.yml#qwen3.7-max。
      - 大脑层 L2 标准项目若 deepseek-v4-pro 太贵可降级至此。
      - Alias: 原 qwen-max → qwen3.7-max。

  # ── T2/T4/T5 感知/审核/归档层 主力 ─────────────────────────────────
  qwen:
    type: openai_compatible
    display_name: Qwen3.6-Plus (Perception/Audit/Archive Tier)
    api_key: env:DASHSCOPE_API_KEY
    base_url: env:DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3.6-plus
    pricing_key: qwen3.6-plus
    fallback_provider: qwen3
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - 均衡推理能力；数值定价唯一来源: config/model_pricing.yml#qwen3.6-plus。
      - 用于 L2/L3: RepoScout、InterfaceMapper、Researcher、审核层、归档层。
      - 性价比优先 — 常规工作不需要 max 级别的强推理。
      - API: DashScope OpenAI-compatible endpoint (兼容模式)。
      - Alias: 原 qwen-plus → qwen3.6-plus。

  # ── T3 执行层 API 编码 主力 ───────────────────────────────────────
  qwen-coder:
    type: openai_compatible
    display_name: Qwen3-Coder-Next (Execution Tier — API Coder)
    api_key: env:DASHSCOPE_API_KEY
    base_url: env:DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3-coder-next
    pricing_key: qwen3-coder-next
    fallback_provider: qwen3
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - Coder 的 API 主力；数值定价唯一来源: config/model_pricing.yml#qwen3-coder-next。
      - 优于通用模型做编码工作。所有预算模式下的默认 API Coder。
      - 需要用户显式批准 (execution_policy.yml: qwen_coding_requires_explicit_user_approval)。
      - Alias: 原 qwen-coder-plus → qwen3-coder-next。

  # ── T3 执行层 DeepSeek 编码备选 (全量模式) ────────────────────────
  deepseek-coder:
    type: openai_compatible
    display_name: DeepSeek V4 Pro (Coder — Max Quality)
    api_key: env:DEEPSEEK_API_KEY
    base_url: env:DEEPSEEK_BASE_URL:https://api.deepseek.com
    default_model: deepseek-v4-pro
    pricing_key: deepseek-v4-pro
    fallback_provider: qwen-coder
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - 全量运算 (max_quality) 模式下的 Coder 备选，仅用于安全关键/架构重构。
      - 与 deepseek provider 共享同一 API key，但角色不同。

  # ── 本地 LLM Provider ───────────────────────────────────────────
  qwen-local:
    type: openai_compatible
    display_name: Local LLM (Ollama/vLLM — Frugal Tier)
    api_key: env:AGENTLAB_LOCAL_API_KEY:not-needed
    base_url: env:AGENTLAB_LOCAL_BASE_URL:http://localhost:11434/v1
    default_model: env:AGENTLAB_LOCAL_CODER_MODEL:qwen3.6-35b-a3b
    fallback_provider: qwen-coder
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - local_llm_not_reachable
    notes:
      - Frugal 模式优先使用。本地模型零 API 成本，仅算力消耗。
      - 需用户配置本地 LLM (Ollama/vLLM/LM Studio)。
      - 能力弱于旗舰 API 模型，仅适合 L1 轻量/高频重用场景。
      - 可通过 .env 配置: AGENTLAB_LOCAL_LLM_ENABLED, AGENTLAB_LOCAL_BASE_URL 等。

  # ── T2/T4 轻量感知/简易审核 (Frugal 模式) ─────────────────────
  qwen-flash:
    type: openai_compatible
    display_name: Qwen3.6-Flash (Frugal Tier)
    api_key: env:DASHSCOPE_API_KEY
    base_url: env:DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3.6-flash
    pricing_key: qwen3.6-flash
    fallback_provider: qwen
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
    notes:
      - 极致低成本闪速模型；数值定价唯一来源: config/model_pricing.yml#qwen3.6-flash。
      - Frugal 模式下主力: 感知层、审核层、归档层。
      - 不适合复杂推理，仅用于: 搜索汇总、简单验证、压缩记录、轻量代码扫描。
      - Alias: 原 qwen-turbo → qwen3.6-flash。

  # ── Qwen Token Plan 专用入口 ──────────────────────────────────────
  tokenplan-qwen:
    type: openai_compatible
    display_name: Qwen Token Plan
    api_key: env:QWEN_TOKEN_PLAN_API_KEY
    base_url: env:QWEN_TOKEN_PLAN_BASE_URL
    default_model: qwen3.6-plus
    fallback_provider: qwen
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - missing_base_url
      - quota_exceeded
      - rate_limited
      - provider_error
    billing:
      source: qwen_token_plan
      metering: prepaid_token_plan
    notes:
      - 用于 AGENTLAB_MODE=qwen_token_plan_cli。
      - 需要用户提供 QWEN_TOKEN_PLAN_API_KEY。
      - 需要用户提供 QWEN_TOKEN_PLAN_BASE_URL；不要猜测或硬编码未知 endpoint。
      - fallback_provider 指向普通 DashScope qwen，仅在用户明确同意时使用。

  # ── Hermes Codex OAuth Provider ────────────────────────────────────
  openai-codex:
    type: oauth_cli
    display_name: Hermes Codex OAuth
    command: hermes
    base_url: https://chatgpt.com/backend-api/codex
    default_model: gpt-5.6-sol
    reasoning_effort: xhigh
    auth: local_hermes_oauth_session
    billing:
      source: codex_oauth
      metering: subscription_or_oauth_quota
      shared_pool_id: openai_codex_agentic
    capacity_source: config/model_capacity.yml
    unavailable_action: capacity_manager
    requires_user_approval_before_fallback: false
    blocked_on:
      - missing_cli
      - oauth_session_expired
      - provider_error
    notes:
      - Runtime provider key matches Hermes' registered openai-codex OAuth provider.
      - This is not the Codex CLI worker.
      - Invoke through Hermes as: hermes --provider openai-codex -m gpt-5.6-sol.
      - xhigh is the strongest setting exposed by installed Hermes v0.17.0.
      - Never use `hermes status --all` as a probe; use `hermes auth status openai-codex`.

  xai-oauth:
    type: oauth_cli
    display_name: Hermes xAI OAuth
    command: hermes
    default_model: grok-4.3
    auth: local_hermes_oauth_session
    billing:
      source: xai_oauth
      metering: subscription_or_oauth_quota
      shared_pool_id: xai_subscription_shared
    capacity_source: config/model_capacity.yml
    unavailable_action: capacity_manager
    requires_user_approval_before_fallback: false
    blocked_on:
      - missing_cli
      - oauth_session_expired
      - subscription_exhausted
      - provider_error
    notes:
      - Grok Researcher and Grok media generation share this observed capacity pool.
      - "`hermes auth status xai-oauth` is an auth/cooldown signal, not a weekly remaining percentage."
      - "Never use `hermes status --all`; its output is not safe for AgentLab logs."

  # ── Agy / Antigravity Gemini OAuth 默认入口 ───────────────────────
  agy-gemini-oauth:
    type: oauth_cli
    display_name: Agy Gemini OAuth
    command: agy
    default_model: gemini-3.5-flash-high
    auth: local_oauth_session
    billing:
      source: agy_oauth
      metering: subscription_or_oauth_quota
      shared_pool_id: agy_gemini_observer
    capacity_source: config/model_capacity.yml
    network:
      requires_supported_region: true
      recommended_regions:
        - US
      vpn_or_proxy_required_when_region_blocked: true
    unavailable_action: capacity_manager
    requires_user_approval_before_fallback: false
    blocked_on:
      - missing_cli
      - oauth_session_expired
      - region_blocked
      - provider_error
    notes:
      - AgentLab 默认 Observer 路径。Agy 接 Gemini 模型，走本地 OAuth 认证。
      - 不读取 GEMINI_API_KEY，不按本地 Gemini API key 计费。
      - 默认模型为 gemini-3.5-flash-high。
      - Agy 不提供 quota/status 命令；remaining/reset 不得推测。

  # ── Agy / Antigravity Claude OAuth Observer 备用容量池 ─────────
  agy-claude-oauth:
    type: oauth_cli
    display_name: Agy Claude OAuth
    command: agy
    default_model: Claude Sonnet 4.6 (Thinking)
    auth: local_oauth_session
    billing:
      source: agy_oauth
      metering: separate_subscription_quota_window
      shared_pool_id: agy_claude_observer
    capacity_source: config/model_capacity.yml
    network:
      requires_supported_region: true
      recommended_regions:
        - US
      vpn_or_proxy_required_when_region_blocked: true
    never_primary: true
    unavailable_action: capacity_manager
    requires_user_approval_before_fallback: false
    blocked_on:
      - missing_cli
      - oauth_session_expired
      - region_blocked
      - provider_error
    notes:
      - 仅在 Agy Gemini Observer 返回 quota_exhausted、rate_limited 或 model_unavailable 时作为预批准独立容量池使用。
      - 与 Gemini 容量池独立；provider surface 仍为同一个 Agy CLI worker。
      - 用户说明两池各有五小时与周窗口，但 Agy 无状态 API，reset/remaining 未观测时保持 null。
      - 认证、网络、命令或输出契约错误不得触发切换；受治理的 rate_limited 属于容量故障。

  # ── Gemini API 免费额度备用入口 ──────────────────────────────────
  gemini-api:
    type: google_genai_api
    display_name: Gemini API Free Tier
    api_key: env:GEMINI_API_KEY
    default_model: gemini-2.5-flash-high
    billing:
      source: gemini_api_key
      metering: free_tier_limited
    never_default: true
    unavailable_action: ask_user
    requires_user_approval_before_fallback: true
    blocked_on:
      - missing_api_key
      - quota_exceeded
      - rate_limited
      - provider_error
    notes:
      - 本地 Gemini API key 通道，只作为显式启用的备用路径。
      - 免费 API 有次数/额度限制，不能作为默认 Gemini 路径。

  # ── 保留扩展 ──────────────────────────────────────────────────────
  openai:
    type: openai_compatible
    display_name: OpenAI
    api_key: env:OPENAI_API_KEY
    base_url: env:OPENAI_BASE_URL:https://api.openai.com/v1
    default_model: env:OPENAI_MODEL
    notes:
      - 保留作为通用扩展通道。当前默认不启用。
      - API key 仅在 agent_runtime/.env 中。

  # ── 手动执行层 ──────────────────────────────────────────────────────
  codex_plus_manual:
    type: manual_codex
    display_name: Codex Plus (Manual IDE)
    default_model: Codex Plus
    notes:
      - Codex Plus 订阅用户的手动 IDE 执行。
      - AgentLab 生成 handoff prompt，Codex Plus 在 IDE 中执行 Coder 阶段。
      - AgentLab 不通过 API 调用 Codex Plus。

  external_ide_ai:
    type: external_ide_ai
    display_name: External IDE AI (Coder Window)
    default_model: External AI
    notes:
      - Optional Coder provider for hybrid_ide or explicit handoff mode.
      - This provider entry is not the default backend decision source.
      - AgentLab 大脑层完成所有规划后，生成完整 handoff prompt + 上下文包。
      - 外部 AI 只需执行编码，无需自行规划/分析架构/确定范围。
      - 为外部 AI 节省大量 token（规划推理开销由 AgentLab 承担）。
      - 外部 AI 的可编辑窗口：可自由选择实现方式、代码风格、具体算法，
        但必须在 Supervisor 批准的 scope 内。
