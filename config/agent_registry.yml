version: 2

# ─── AgentLab Agent Registry — 分层模型绑定 v2.0 ──────────────────────────
#
# 每个 agent 绑定到对应的 model_profile (见 model_profiles.yml):
#
#   T1 大脑: Supervisor           → brain_coordinator (deepseek-v4-pro)
#                                   brain_coordinator_l1 (qwen3.6-plus)
#                                   brain_coordinator_maxq (deepseek-v4-pro + thinking)
#                                   brain_coordinator_frugal (qwen3.6-flash)
#   T2 感知: RepoScout            → perception_reposcout (qwen3.6-plus)
#                                   perception_reposcout_l3 (qwen3.7-max)
#   T2 感知: InterfaceMapper      → perception_interface (qwen3.6-plus)
#   T2 感知: Researcher           → perception_research (qwen3.6-flash)
#   T3 执行: Coder                → execution_coder_api (qwen3-coder-next)
#   T3 执行: ArtifactProducer     → execution_artifact_producer (capability-routed)
#                                   execution_coder_maxq (deepseek-v4-pro)
#                                   execution_coder_local (本地 LLM)
#   T3 执行: CodexPromptGenerator → execution_codex_prompt (qwen3.6-flash)
#   T4 审核: TesterAuditor        → audit_tester (qwen3.6-flash)
#   T4 审核: Verifier             → audit_verifier (qwen3.6-flash)
#   T5 归档: Archivist            → archive_archivist (qwen3.6-flash)
#
#  预算模式: 🧠brain_allocated / ⚡max_quality / 💰frugal
#  项目体量: L1轻量 / L2标准 / L3重型
#  runtime 根据 (budget_mode, project_size) 选择对应的 profile 后缀.
#
#  外部 IDE 窗口:
#   Coder 可选绑定 execution_external_ide profile.
#   AgentLab runtime 生成 handoff prompt 后交由外部 AI 执行.
#   外部 AI 的可编辑窗口: 自由选择实现方式、代码风格、算法,
#   但必须遵守 Supervisor 批准的 scope 和 interface 契约.
# ──────────────────────────────────────────────────────────────────────────

registry_policy:
  description: >
    Agents are configured here first; markdown templates define role voice
    and report shape.  v2.0 新增 budget_mode 和 project_size 动态选择.
  default_source_write_policy: never_without_supervisor_plan
  default_shell_policy: inspect_only
  default_memory_policy: write_reports_under_active_run
  budget_mode: brain_allocated  # 默认，可由 runtime 覆写
  project_size: L2              # 默认，可由 Supervisor 判断后覆写

agents:

  # ══════════════════════════════════════════════════════════════════════
  # T1 大脑层 (Brain Tier)
  # ══════════════════════════════════════════════════════════════════════

  Supervisor:
    template_path: agent_templates/supervisor.md
    role: >
      任务规划、路由决策、范围锁定、token 预算控制、项目体量判断 (L1/L2/L3)、
      预算模式选择与执行、合成。
    model_profile: brain_coordinator  # deepseek-v4-pro (L2/L3 默认)
    model_tier: T1
    # 按预算模式 + 项目体量的动态映射 (runtime 选择):
    profile_mapping:
      brain_allocated:
        L1: brain_coordinator_l1       # qwen3.6-plus
        L2: brain_coordinator           # deepseek-v4-pro
        L3: brain_coordinator           # deepseek-v4-pro
      max_quality:
        any: brain_coordinator_maxq     # deepseek-v4-pro + Thinking
      frugal:
        any: brain_coordinator_frugal   # qwen3.6-flash
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
      - project_config.yml
      - agent_docs/00_CONTEXT_PACK.md
      - agent_docs/01_REPO_MAP.md
      - config/execution_policy.yml
      - config/routing_rules.yml
      - runs/task_xxxx/user_request.md
    required_outputs:
      - runs/task_xxxx/supervisor_plan.md
    required_metadata:
      - budget_mode
      - project_size

  # ══════════════════════════════════════════════════════════════════════
  # T2 感知层 (Perception Tier)
  # ══════════════════════════════════════════════════════════════════════

  RepoScout:
    template_path: agent_templates/reposcout.md
    role: 仓库结构阅读、代码上下文提取、依赖关系映射.
    model_profile: perception_reposcout  # qwen3.6-plus (L2 默认)
    model_tier: T2
    profile_mapping:
      brain_allocated:
        L2: perception_reposcout          # qwen3.6-plus
        L3: perception_reposcout_l3       # qwen3.7-max
      max_quality:
        any: perception_reposcout_maxq    # qwen3.7-max
      frugal:
        any: perception_reposcout_frugal  # qwen3.6-flash
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
      - runs/task_xxxx/reposcout_report.md

  InterfaceMapper:
    template_path: agent_templates/interface_mapper.md
    role: 接口契约分析、跨层边界追踪、架构敏感审查.
    model_profile: perception_interface  # qwen3.6-plus (L2 默认)
    model_tier: T2
    profile_mapping:
      brain_allocated:
        L2: perception_interface          # qwen3.6-plus
        L3: perception_interface_l3       # qwen3.7-max
      max_quality:
        any: perception_interface_maxq    # qwen3.7-max
      frugal:
        any: perception_interface_frugal  # qwen3.6-flash (通常跳过)
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
      - runs/task_xxxx/interface_map.md

  Researcher:
    template_path: agent_templates/researcher.md
    role: Grok/Hermes 外部资料、社交与网页证据搜索，保留来源和检索时间.
    model_profile: perception_research_grok
    model_tier: T2
    profile_mapping:
      brain_allocated:
        L2: perception_research_grok
        L3: perception_research_grok
      max_quality:
        any: perception_research_grok
      frugal:
        any: null                         # 跳过
    can_edit_source: false
    can_run_shell: true
    can_browse: true
    source_write_policy: never
    execution_owner: hermes_grok_oauth
    invocation_contract: grok_research
    required_outputs:
      - runs/task_xxxx/03_research_notes.md

  Observer:
    template_path: agent_templates/observer.md
    role: >
      Read-only multimodal perception for assigned long-form text, images,
      video, audio, and PDF inputs. Produces evidence-bound observations,
      scientific context, limitations, and suggestions without acting on the
      project or approving its own conclusions.
    model_profile: perception_observer
    model_tier: T2
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    can_browse: false
    source_write_policy: never
    observation_policy: assigned_inputs_only
    execution_owner: agy
    invocation_contract: agy_observer
    required_inputs:
      - runs/task_xxxx/user_request.md
      - runs/task_xxxx/01_supervisor_plan.md
      - runs/task_xxxx/observation_contract.yml
      - exact read-only files declared by observation_contract.yml
    required_outputs:
      - runs/task_xxxx/observation_report.yml

  # ══════════════════════════════════════════════════════════════════════
  # T3 执行层 (Execution Tier)
  # ══════════════════════════════════════════════════════════════════════

  Coder:
    template_path: agent_templates/coder.md
    role: >
      代码实现与文件编辑。默认通过 API 自动编码 (qwen3-coder-next).
      系统调用 LLM API 生成 AGENTLAB_EDIT 结构化编辑块,
      然后由 patch_applicator 应用到文件系统.
      外部 IDE AI 窗口为可选增强:
        接入方式: export AGENTLAB_EXTERNAL_CODER=1
        或在 run_dir 下写入 EXTERNAL_CODER_READY 信号文件.
        接入后 AgentLab 跳过 API 编码, 生成完整 handoff prompt,
        交由外部 AI (Codex/Claude/Cline) 执行.
        外部 AI 的可编辑窗口: 自由选择实现方式/代码风格/算法/库,
        但必须遵守 Supervisor 批准的 scope 和 interface 契约.
      本地 LLM (Frugal 模式): 优先使用 Ollama/vLLM 本地模型.
    model_profile: execution_coder_api  # qwen3-coder-next (默认)
    model_tier: T3
    profile_mapping:
      brain_allocated:
        any: execution_coder_api         # qwen3-coder-next
      max_quality:
        any: execution_coder_maxq        # deepseek-v4-pro
      frugal:
        with_local: execution_coder_local # 本地 LLM (优先)
        no_local: execution_coder_api    # qwen3-coder-next (fallback)
    external_window: false
    external_window_activation:
      env_var: AGENTLAB_EXTERNAL_CODER
      signal_file: EXTERNAL_CODER_READY
    can_edit_source: true
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: supervisor_approved_files_only
    shell_policy: non_destructive_only
    execution_owner: qwen-coder
    secondary_executor: deepseek-coder
    local_executor: qwen-local
    allowed_backends:
      - api_qwen_coder        # qwen3-coder-next — 默认主力
      - api_deepseek_coder    # deepseek-v4-pro — 全量模式
      - codex_role_worker     # Codex role-session — 受控 Coder worker
      - local_llm             # 本地 Ollama/vLLM — Frugal 模式
      - external_ide          # 外部 IDE AI — 需激活信号
    required_outputs:
      - runs/task_xxxx/implementation_report.md

  ArtifactProducer:
    template_path: agent_templates/artifact_producer.md
    role: >
      泛化产物执行层。只接收 ArtifactTask 结构化合同，负责已登记能力覆盖的文本、
      图片、视频、表格和演示文稿生成、落盘、校验与失败转派；音频与跨 provider
      混合交付在没有专用适配器时必须明确阻断。
      不替代 Coder；涉及源码或自动化实现时必须由 Coder 承担代码变更。
    model_profile: execution_artifact_producer
    model_tier: T3
    profile_mapping:
      brain_allocated:
        any: execution_artifact_producer
      max_quality:
        any: execution_artifact_producer_maxq
      frugal:
        any: execution_artifact_producer_fallback
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: artifact_contract_outputs_only
    shell_policy: artifact_validation_only
    execution_owner: capability_router
    allowed_backends:
      - hermes_grok_oauth
      - qwen_cli
      - qwen_37max_api
    required_inputs:
      - runs/task_xxxx/artifact_task.yml
      - runs/task_xxxx/user_request.md
      - runs/task_xxxx/workflow_plan.yml
    required_outputs:
      - runs/task_xxxx/artifact_producer_report.md
      - runs/task_xxxx/outputs/

  Writer:
    template_path: agent_templates/writer.md
    role: >
      Pure creative Writer. Uses the bounded Claude shell with DeepSeek to draft
      high-quality Chinese prose while preserving voice, POV, continuity, and
      word-count constraints. It is not an ArtifactProducer or planner.
    model_profile: execution_writer_deepseek
    model_tier: T3
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: artifact_contract_outputs_only
    execution_owner: claude_code
    invocation_contract: claude_writer
    allowed_backends: [claude_code_deepseek]
    required_inputs:
      - runs/task_xxxx/mission_contract.yml
      - runs/task_xxxx/user_request.md
    required_outputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/continuity_ledger.yml
      - runs/task_xxxx/state_transition_proposal.yml
      - runs/task_xxxx/narrative_delivery_receipt.yml

  Reviewer:
    template_path: agent_templates/fiction_reviewer.md
    role: >
      Independent route-specific review. Narrative routes check continuity,
      character state, timeline, POV, and style drift. Media routes use an
      isolated multimodal Agy/Gemini role-session to inspect actual staged
      candidates and return four-dimension visual evidence without mutation.
    model_profile: audit_verifier
    model_tier: T4
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    allowed_backends: [agy_gemini_oauth, qwen_cli, claude_code]
    required_inputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/mission_contract.yml
    required_outputs:
      - runs/task_xxxx/fiction_review.yml

  Scribe:
    template_path: agent_templates/scribe.md
    role: >
      Creative writing ledger alias. Updates continuity, character, timeline,
      item, relationship, foreshadowing, and style ledgers after review.
    model_profile: archive_archivist
    model_tier: T5
    role_alias_of: Archivist
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: true
    source_write_policy: artifact_contract_outputs_only
    required_inputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/fiction_review.yml
      - runs/task_xxxx/mission_contract.yml
    required_outputs:
      - runs/task_xxxx/continuity_ledger.yml

  PromptEngineer:
    template_path: agent_templates/prompt_engineer.md
    role: >
      稳定生成 Coder 执行提示词。读取 Supervisor plan + RepoScout report + Interface map,
      拼接成结构化、可复现的 Coder 实现引导 prompt。确保 prompt 完整覆盖 scope、允许编辑的文件、
      禁止操作、验收标准等关键信息。输出质量稳定可控，不依赖对话记忆。
    model_profile: execution_prompt_engineer  # qwen3.6-plus (L2 默认)
    model_tier: T3
    profile_mapping:
      brain_allocated:
        L2: execution_prompt_engineer          # qwen3.6-plus
        L3: execution_prompt_engineer_l3       # qwen3.7-max
      max_quality:
        any: execution_prompt_engineer_maxq    # qwen3.7-max
      frugal:
        any: execution_prompt_engineer_frugal  # qwen3.6-flash
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/reposcout_report.md
      - runs/task_xxxx/interface_map.md
    required_outputs:
      - runs/task_xxxx/05_coder_prompt.md

  # ══════════════════════════════════════════════════════════════════════
  # T4 审核层 (Audit Tier)
  # ══════════════════════════════════════════════════════════════════════

  TesterAuditor:
    template_path: agent_templates/tester_auditor.md
    role: Diff 审查、验证解读、风险发现、行为校验.
    model_profile: audit_tester  # qwen3.6-flash (L1/L2 默认)
    model_tier: T4
    profile_mapping:
      brain_allocated:
        L1: audit_tester                 # qwen3.6-flash (可选)
        L2: audit_tester                 # qwen3.6-flash
        L3: audit_tester_l3              # qwen3.6-plus
      max_quality:
        any: audit_tester_maxq           # qwen3.7-max
      frugal:
        any: audit_tester_frugal         # qwen3.6-flash
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: validation_commands_only
    required_outputs:
      - runs/task_xxxx/validation_report.md
      - runs/task_xxxx/audit_report.md

  Verifier:
    template_path: agent_templates/verifier.md
    role: 输出匹配检查、行为完整性验证、agent 交接缺口检测.
    model_profile: audit_verifier  # qwen3.6-flash (L2 默认)
    model_tier: T4
    profile_mapping:
      brain_allocated:
        L1: null                         # 跳过
        L2: audit_verifier               # qwen3.6-flash
        L3: audit_verifier_l3            # qwen3.6-plus
      max_quality:
        any: audit_verifier_maxq         # qwen3.7-max
      frugal:
        any: null                         # 跳过
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/implementation_report.md
      - runs/task_xxxx/audit_report.md
      - runs/task_xxxx/interface_map.md
    required_outputs:
      - runs/task_xxxx/verification_report.md

  # ══════════════════════════════════════════════════════════════════════
  # T5 归档层 (Archive Tier)
  # ══════════════════════════════════════════════════════════════════════

  Archivist:
    template_path: agent_templates/archivist.md
    role: >
      项目记忆压缩、连续性更新、长期记录维护 (per-task).
      跨任务文档整合: 生成开发流程文档、使用指南、CHANGELOG、任务索引 (bulk mode).
      任务归档清理: 将旧任务移入 archive/ 目录.
    model_profile: archive_archivist_plus  # qwen3.6-plus (L2 默认, 升级自 flash)
    model_tier: T5
    profile_mapping:
      brain_allocated:
        L1: null                               # L1 不归档
        L2: archive_archivist_plus             # qwen3.6-plus
        L3: archive_archivist_l3               # qwen3.7-max
      max_quality:
        any: archive_archivist_maxq            # qwen3.7-max
      frugal:
        any: archive_archivist_frugal          # qwen3.6-flash
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: true
    source_write_policy: never
    shell_policy: read_only_inspection
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/implementation_report.md
      - runs/task_xxxx/validation_report.md
      - runs/task_xxxx/audit_report.md
      - project_config.yml (bulk mode)
    required_outputs:
      - runs/task_xxxx/archive_update.md
    bulk_mode_outputs:
      - runs/task_purge_report.yml
      - docs/development_process.md
      - docs/usage_guide.md
      - docs/CHANGELOG.md
      - docs/task_index.md
