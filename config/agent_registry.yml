version: 3

authority:
  purpose: canonical_agent_role_contracts
  owns:
    - role_identity
    - prompt_template
    - permissions
    - required_inputs
    - required_outputs
  does_not_own:
    - worker_selection
    - model_selection
    - provider_selection
    - cli_invocation_contracts
    - fallback_routes
  backend_source: config/agent_model_profiles.yml
  worker_permission_source: config/agent_role_bindings.yml
  command_template_source: config/worker_invocation_contracts.yml
  fallback_source: config/model_capacity.yml

registry_policy:
  description: >
    Define stable AgentLab role contracts here. Runtime backend and model
    choices are derived from the dedicated authority files above.
  default_source_write_policy: never_without_supervisor_plan
  default_shell_policy: inspect_only
  default_memory_policy: write_reports_under_active_run

agents:

  # ══════════════════════════════════════════════════════════════════════
  # T1 大脑层 (Brain Tier)
  # ══════════════════════════════════════════════════════════════════════

  Supervisor:
    template_path: agent_templates/supervisor.md
    role: >
      任务规划、路由决策、范围锁定、token 预算控制、项目体量判断 (L1/L2/L3)、
      预算模式选择与执行、合成。
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
      - project_config.yml
      - agent_docs/00_CONTEXT_PACK.md
      - agent_docs/01_REPO_MAP.md
      - config/execution_policy.yml
      - config/routing_rules.yml
      - runs/task_xxxx/user_request.md
    required_outputs:
      - runs/task_xxxx/supervisor_plan.md
    required_metadata:
      - budget_mode
      - project_size

  # ══════════════════════════════════════════════════════════════════════
  # T2 感知层 (Perception Tier)
  # ══════════════════════════════════════════════════════════════════════

  RepoScout:
    template_path: agent_templates/reposcout.md
    role: 仓库结构阅读、代码上下文提取、依赖关系映射.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
      - runs/task_xxxx/reposcout_report.md

  InterfaceMapper:
    template_path: agent_templates/interface_mapper.md
    role: 接口契约分析、跨层边界追踪、架构敏感审查.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_outputs:
      - runs/task_xxxx/interface_map.md

  Researcher:
    template_path: agent_templates/researcher.md
    role: 外部资料、社交与网页证据搜索，保留来源和检索时间.
    can_edit_source: false
    can_run_shell: true
    can_browse: true
    source_write_policy: never
    required_outputs:
      - runs/task_xxxx/03_research_notes.md

  Observer:
    template_path: agent_templates/observer.md
    role: >
      Read-only multimodal perception for assigned long-form text, images,
      video, audio, and PDF inputs. Produces evidence-bound observations,
      scientific context, limitations, and suggestions without acting on the
      project or approving its own conclusions.
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    can_browse: false
    source_write_policy: never
    observation_policy: assigned_inputs_only
    required_inputs:
      - runs/task_xxxx/user_request.md
      - runs/task_xxxx/01_supervisor_plan.md
      - runs/task_xxxx/observation_contract.yml
      - exact read-only files declared by observation_contract.yml
    required_outputs:
      - runs/task_xxxx/observation_report.yml

  # ══════════════════════════════════════════════════════════════════════
  # T3 执行层 (Execution Tier)
  # ══════════════════════════════════════════════════════════════════════

  Coder:
    template_path: agent_templates/coder.md
    role: >
      代码实现与文件编辑。根据 Supervisor 批准的范围和接口合同生成结构化
      AGENTLAB_EDIT 编辑块，并由受控 patch applicator 应用到文件系统。
    can_edit_source: true
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: supervisor_approved_files_only
    shell_policy: non_destructive_only
    required_outputs:
      - runs/task_xxxx/implementation_report.md

  ArtifactProducer:
    template_path: agent_templates/artifact_producer.md
    role: >
      泛化产物执行层。只接收 ArtifactTask 结构化合同，负责已登记能力覆盖的文本、
      图片、视频、表格和演示文稿生成、落盘、校验与失败转派；音频与跨 provider
      混合交付在没有专用适配器时必须明确阻断。
      不替代 Coder；涉及源码或自动化实现时必须由 Coder 承担代码变更。
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: artifact_contract_outputs_only
    shell_policy: artifact_validation_only
    required_inputs:
      - runs/task_xxxx/artifact_task.yml
      - runs/task_xxxx/user_request.md
      - runs/task_xxxx/workflow_plan.yml
    required_outputs:
      - runs/task_xxxx/artifact_producer_report.md
      - runs/task_xxxx/outputs/

  NarrativePlanner:
    template_path: agent_templates/narrative_planner.md
    role: >
      Narrative rewrite planning specialist. Converts blocking heavy-audit
      evidence and bounded project authority into a deterministic candidate
      chapter state plan for the Writer. It never drafts prose, edits project
      memory, writes production, establishes canon, or approves promotion.
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: run_local_candidate_plan_only
    shell_policy: no_tools_sealed_packet_only
    required_inputs:
      - runs/task_xxxx/mission_contract.yml
      - runs/task_xxxx/user_request.md
      - runs/task_xxxx/narrative_rewrite_contract.yml
      - heavy-audit aggregate and rewrite proposals declared by the rewrite contract
    required_outputs:
      - runs/task_xxxx/chapter_state_plan.yml

  Writer:
    template_path: agent_templates/writer.md
    role: >
      Pure creative Writer. Drafts high-quality Chinese prose while preserving
      voice, POV, continuity, and word-count constraints. It is not an
      ArtifactProducer or planner.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: artifact_contract_outputs_only
    required_inputs:
      - runs/task_xxxx/mission_contract.yml
      - runs/task_xxxx/user_request.md
    required_outputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/continuity_ledger.yml
      - runs/task_xxxx/state_transition_proposal.yml
      - runs/task_xxxx/narrative_delivery_receipt.yml

  Reviewer:
    template_path: agent_templates/fiction_reviewer.md
    template_variants:
      media_generation_task: agent_templates/visual_reviewer.md
    role: >
      Independent route-specific review. Narrative routes check continuity,
      character state, timeline, POV, and style drift. Media routes use an
      isolated multimodal Agy/Gemini role-session to inspect actual staged
      candidates and return four-dimension visual evidence without mutation.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/mission_contract.yml
    required_outputs:
      - runs/task_xxxx/fiction_review.yml

  Scribe:
    template_path: agent_templates/scribe.md
    role: >
      Creative writing ledger alias. Updates continuity, character, timeline,
      item, relationship, foreshadowing, and style ledgers after review.
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: true
    source_write_policy: artifact_contract_outputs_only
    required_inputs:
      - runs/task_xxxx/fiction_draft.md
      - runs/task_xxxx/fiction_review.yml
      - runs/task_xxxx/mission_contract.yml
    required_outputs:
      - runs/task_xxxx/continuity_ledger.yml

  PromptEngineer:
    template_path: agent_templates/prompt_engineer.md
    role: >
      稳定生成 Coder 执行提示词。读取 Supervisor plan + RepoScout report + Interface map,
      拼接成结构化、可复现的 Coder 实现引导 prompt。确保 prompt 完整覆盖 scope、允许编辑的文件、
      禁止操作、验收标准等关键信息。输出质量稳定可控，不依赖对话记忆。
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: false
    source_write_policy: never
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/reposcout_report.md
      - runs/task_xxxx/interface_map.md
    required_outputs:
      - runs/task_xxxx/05_coder_prompt.md

  # ══════════════════════════════════════════════════════════════════════
  # T4 审核层 (Audit Tier)
  # ══════════════════════════════════════════════════════════════════════

  TesterAuditor:
    template_path: agent_templates/tester_auditor.md
    role: Diff 审查、验证解读、风险发现、行为校验.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: validation_commands_only
    required_outputs:
      - runs/task_xxxx/validation_report.md
      - runs/task_xxxx/audit_report.md

  Verifier:
    template_path: agent_templates/verifier.md
    role: 输出匹配检查、行为完整性验证、agent 交接缺口检测.
    can_edit_source: false
    can_run_shell: true
    can_write_agent_docs: false
    source_write_policy: never
    shell_policy: read_only_inspection
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/implementation_report.md
      - runs/task_xxxx/audit_report.md
      - runs/task_xxxx/interface_map.md
    required_outputs:
      - runs/task_xxxx/verification_report.md

  # ══════════════════════════════════════════════════════════════════════
  # T5 归档层 (Archive Tier)
  # ══════════════════════════════════════════════════════════════════════

  Archivist:
    template_path: agent_templates/archivist.md
    role: >
      项目记忆压缩、连续性更新、长期记录维护 (per-task).
      跨任务文档整合: 生成开发流程文档、使用指南、CHANGELOG、任务索引 (bulk mode).
      任务归档清理: 将旧任务移入 archive/ 目录.
    can_edit_source: false
    can_run_shell: false
    can_write_agent_docs: true
    source_write_policy: never
    shell_policy: read_only_inspection
    required_inputs:
      - runs/task_xxxx/supervisor_plan.md
      - runs/task_xxxx/implementation_report.md
      - runs/task_xxxx/validation_report.md
      - runs/task_xxxx/audit_report.md
      - project_config.yml (bulk mode)
    required_outputs:
      - runs/task_xxxx/archive_update.md
    bulk_mode_outputs:
      - runs/task_purge_report.yml
      - docs/development_process.md
      - docs/usage_guide.md
      - docs/CHANGELOG.md
      - docs/task_index.md

professional_profiles:
  authorial_director:
    manifest_version: 2
    extends_agent_role: Supervisor
    professional_duties: [Hold authorial thesis, ending, structure, and non-negotiable promises, Resolve escalations after two bounded revision cycles]
    knowledge_namespaces: [canon, outline, promises, authorial_preferences]
    input_schema: narrative-director-input/v1
    output_schema: narrative-director-decision/v1
    tools: [context_retrieval, planning_window_read]
    runtime: {model_profile_ref: authorial_director}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/authorial_director_decision.yml]}
    forbidden_actions: [draft_chapter_prose, self_execute_state_projection]
    dependencies: []
    acceptance_rules: [Decisions cite current canon, planning-window, and promise evidence]
  canon_timeline_steward:
    manifest_version: 2
    extends_agent_role: Reviewer
    professional_duties: [Audit time age life status location objects abilities and source lineage, Separate system truth from character knowledge and reader inference]
    knowledge_namespaces: [canon, timeline, exact_name_index, character_knowledge]
    input_schema: canon-timeline-audit-input/v1
    output_schema: canon-timeline-audit/v1
    tools: [exact_fact_lookup, graph_neighbor_lookup]
    runtime: {model_profile_ref: canon_timeline_steward}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/canon_timeline_audit.yml]}
    forbidden_actions: [draft_chapter_prose, mutate_canon, approve_own_changes]
    dependencies: [authorial_director]
    acceptance_rules: [Every hard finding includes an exact evidence locator and confidence]
  plot_causality_architect:
    manifest_version: 2
    extends_agent_role: NarrativePlanner
    professional_duties: [Maintain cause consequence constraint and irreversible-choice chains, Reject outcomes without enabling causes]
    knowledge_namespaces: [event_graph, causality_graph, outline]
    input_schema: plot-causality-input/v1
    output_schema: plot-causality-review/v1
    tools: [graph_neighbor_lookup, context_retrieval]
    runtime: {model_profile_ref: plot_causality_architect}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/plot_causality_review.yml]}
    forbidden_actions: [draft_chapter_prose, commit_narrative_state]
    dependencies: [canon_timeline_steward]
    acceptance_rules: [Causal claims identify antecedent and consequence evidence]
  character_ensemble_director:
    manifest_version: 2
    extends_agent_role: NarrativePlanner
    professional_duties: [Preserve distinct motives knowledge false beliefs plans and moral thresholds, Project relevant off-stage actions before chapter planning]
    knowledge_namespaces: [character_minds, character_private_memory, event_graph]
    input_schema: character-ensemble-input/v1
    output_schema: character-ensemble-review/v1
    tools: [character_memory_lookup, graph_neighbor_lookup]
    runtime: {model_profile_ref: character_ensemble_director}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/character_ensemble_review.yml]}
    forbidden_actions: [draft_chapter_prose, merge_character_voices]
    dependencies: [canon_timeline_steward]
    acceptance_rules: [Character decisions cite knowledge motive and threshold evidence]
  relationship_director:
    manifest_version: 2
    extends_agent_role: Reviewer
    professional_duties: [Track multi-axis relationship changes injuries expectations and power differences, Block unearned intimacy trust sacrifice or rupture]
    knowledge_namespaces: [relationship_graph, character_minds, consent_boundaries]
    input_schema: relationship-review-input/v1
    output_schema: relationship-review/v1
    tools: [relationship_graph_lookup, context_retrieval]
    runtime: {model_profile_ref: relationship_director}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/relationship_review.yml]}
    forbidden_actions: [draft_chapter_prose, waive_adult_consent_gate]
    dependencies: [character_ensemble_director]
    acceptance_rules: [Every relationship delta cites a scene cause and prior edge state]
  world_archaeologist:
    manifest_version: 2
    extends_agent_role: Researcher
    professional_duties: [Treat places objects rituals battles and terrain as historical narrative entities, Separate public hidden symbolic and causal explanations]
    knowledge_namespaces: [narrative_entities, world_history, causality_graph]
    input_schema: world-archaeology-input/v1
    output_schema: world-archaeology-review/v1
    tools: [entity_lookup, research_card_lookup]
    runtime: {model_profile_ref: world_archaeologist}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/world_archaeology_review.yml]}
    forbidden_actions: [draft_chapter_prose, import_unlicensed_source_text]
    dependencies: [canon_timeline_steward]
    acceptance_rules: [World claims retain source rights and evidence provenance]
  foreshadow_mystery_keeper:
    manifest_version: 2
    extends_agent_role: NarrativePlanner
    professional_duties: [Evolve promises through declared states and due windows, Separate system truth character interpretation and reader hypothesis]
    knowledge_namespaces: [promise_graph, reader_questions, outline]
    input_schema: promise-graph-input/v1
    output_schema: promise-graph-review/v1
    tools: [promise_graph_lookup, context_retrieval]
    runtime: {model_profile_ref: foreshadow_mystery_keeper}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/promise_graph_review.yml]}
    forbidden_actions: [draft_chapter_prose, silently_retire_due_promise]
    dependencies: [plot_causality_architect]
    acceptance_rules: [Due promises are paid off transformed explicitly deferred or retired]
  arc_scene_planner:
    manifest_version: 2
    extends_agent_role: NarrativePlanner
    professional_duties: [Compile active planning windows into scene contracts, Preserve locked intent while leaving prose choices to Writer]
    knowledge_namespaces: [outline, planning_windows, causality_graph, promise_graph]
    input_schema: arc-scene-plan-input/v1
    output_schema: scene-plan/v1
    tools: [planning_window_read, context_retrieval]
    runtime: {model_profile_ref: arc_scene_planner}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/scene_plan.yml]}
    forbidden_actions: [draft_chapter_prose, supersede_locked_window]
    dependencies: [authorial_director, canon_timeline_steward]
    acceptance_rules: [Scene contracts identify purpose causal change and must-preserve elements]
  research_style_curator:
    manifest_version: 2
    extends_agent_role: Researcher
    professional_duties: [Curate source-rights-bound craft cards rather than imitation corpora, Admit only approved source-rights classes]
    knowledge_namespaces: [craft_cards, source_rights, accepted_prose]
    input_schema: research-style-input/v1
    output_schema: craft-card-set/v1
    tools: [research_card_lookup, source_rights_check]
    runtime: {model_profile_ref: research_style_curator}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/craft_cards.yml]}
    forbidden_actions: [draft_chapter_prose, store_unlicensed_fulltext, style_imitation]
    dependencies: [authorial_director]
    acceptance_rules: [Every craft card declares rights locator mechanism and originality constraints]
  writer:
    manifest_version: 2
    extends_agent_role: Writer
    professional_duties: [Draft or revise only contracted prose, Return candidates without approving or committing state]
    knowledge_namespaces: [writer_context_pack]
    input_schema: writer-context-pack/v2
    output_schema: prose-candidate/v2
    tools: [candidate_output_write]
    runtime: {model_profile_ref: writer}
    authority: {read: [runs/**/writer_context_pack/**], write: [runs/**/candidates/**]}
    forbidden_actions: [self_review, approve_own_work, commit_narrative_state, modify_canon, read_other_role_private_context]
    dependencies: [arc_scene_planner]
    acceptance_rules: [Candidate prose remains hash-bound to its exact context pack and scene contract]
  senior_editor:
    manifest_version: 2
    extends_agent_role: Reviewer
    professional_duties: [Merge hard and risk-triggered soft reviews into a minimal revision contract, Preserve strengths and escalate after two failed rounds]
    knowledge_namespaces: [audit_findings, revision_history, authorial_preferences]
    input_schema: senior-editor-input/v1
    output_schema: scene-revision-contract/v1
    tools: [audit_evidence_lookup, blind_review_compare]
    runtime: {model_profile_ref: senior_editor}
    authority: {read: [production/**, project_brain/**, runs/**], write: [runs/**/scene_revision_contract.yml]}
    forbidden_actions: [draft_chapter_prose, approve_own_edit, commit_narrative_state]
    dependencies: [writer, canon_timeline_steward]
    acceptance_rules: [Findings name evidence confidence counter-reading and minimum revision scope]
  reader_simulation_panel:
    manifest_version: 2
    extends_agent_role: Reviewer
    professional_duties: [Simulate distinct reader expectations without canon authority, Report confusion promise salience emotion and counter-readings]
    knowledge_namespaces: [reader_questions, promise_graph, authorial_preferences]
    input_schema: reader-panel-input/v1
    output_schema: reader-panel-review/v1
    tools: [blind_review_compare]
    runtime: {model_profile_ref: reader_simulation_panel}
    authority: {read: [runs/**/anonymous_candidates/**, runs/**/reader_context_pack/**], write: [runs/**/reader_panel_review.yml]}
    forbidden_actions: [identify_candidate_order, mutate_canon, commit_narrative_state]
    dependencies: [writer]
    acceptance_rules: [Reader reactions remain hypotheses with confidence and counter-interpretation]
  state_projector:
    manifest_version: 2
    extends_agent_role: Scribe
    professional_duties: [Deterministically project accepted prose evidence into append-only events, Reject unhashed prose duplicate keys and unauthorized state kinds]
    knowledge_namespaces: [accepted_prose, narrative_state_events]
    input_schema: accepted-prose-state-input/v1
    output_schema: narrative-state-delta/v2
    tools: [deterministic_state_projection]
    runtime: {model_profile_ref: state_projector}
    authority: {read: [runs/**/accepted/**, project_brain/narrative_state_snapshot.yml], write: [project_brain/narrative_state_events.jsonl]}
    forbidden_actions: [draft_chapter_prose, infer_unstated_fact, approve_prose]
    dependencies: [senior_editor]
    acceptance_rules: [Every event is idempotent and cites exact accepted-prose evidence]
