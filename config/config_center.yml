# M2-5 Config Center — master schema and settings
# Defines all known config keys, their types, requirements, and UI grouping.

active_profile: null  # Set to dev, prod, frugal, or max_quality to activate

keys:
  # ── Routing ──
  routing_policy.default_mode:
    type: str
    required: true
    ui_group: routing
    ui_label: Default Routing Mode
    description: Default mode for task-to-agent routing (full_cli, brain_allocated, max_quality, furgal)
    allowed_values: [full_cli, brain_allocated, max_quality, furgal]

  routing_policy.allow_automatic_fallback:
    type: bool
    required: false
    default: false
    ui_group: routing
    ui_label: Allow Automatic Fallback
    description: Whether routing may automatically fall back to alternative agents

  # ── Execution ──
  execution_policy.default_mode:
    type: str
    required: true
    ui_group: execution
    ui_label: Default Execution Mode
    description: How the Coder agent executes tasks
    allowed_values: [api, cli, external_ide]

  execution_policy.require_explicit_execute:
    type: bool
    required: false
    default: true
    ui_group: execution
    ui_label: Require Explicit --execute
    description: Whether run-agent commands need explicit --execute flag

  # ── Budget ──
  budget_policy.max_tokens_per_task:
    type: int
    required: false
    default: 200000
    ui_group: budget
    ui_label: Max Tokens Per Task
    description: Hard token limit per task run

  budget_policy.warning_threshold_pct:
    type: int
    required: false
    default: 80
    ui_group: budget
    ui_label: Warning Threshold %
    description: Percentage of token budget at which to emit warnings

  # ── Model ──
  model_profiles.default_budget_mode:
    type: str
    required: false
    default: brain_allocated
    ui_group: model
    ui_label: Default Budget Mode
    description: Budget mode that selects model tier (brain_allocated, max_quality, furgal)
    allowed_values: [brain_allocated, max_quality, furgal]

  # ── API Keys (secret) ──
  model_providers.deepseek_api_key:
    type: str
    required: false
    ui_group: credentials
    ui_label: DeepSeek API Key
    description: API key for DeepSeek official API
    secret: true

  model_providers.dashscope_api_key:
    type: str
    required: false
    ui_group: credentials
    ui_label: DashScope API Key
    description: API key for Aliyun DashScope (Qwen models)
    secret: true

  # ── Worker ──
  worker_registry.max_concurrent:
    type: int
    required: false
    default: 4
    ui_group: worker
    ui_label: Max Concurrent Workers
    description: Maximum number of workers allowed to run concurrently

  # ── Harness ──
  harness_policy.require_validation_gate:
    type: bool
    required: false
    default: true
    ui_group: harness
    ui_label: Require Validation Gate
    description: Whether all agent outputs must pass validation gates

  # ── Sync ──
  auto_sync_policy.truenas_sync_auto_push:
    type: bool
    required: false
    default: false
    ui_group: sync
    ui_label: Auto Push to Truenas
    description: Automatically push config/skills/memory to relay hub after changes
