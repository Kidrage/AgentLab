# M2-5 Config Center — master schema and settings
# Defines all known config keys, their types, requirements, and UI grouping.

active_profile: null  # Set to dev, prod, frugal, or max_quality to activate

keys:
  # ── Routing ──
  routing_policy.default_budget:
    type: str
    required: true
    ui_group: routing
    ui_label: Default Budget Mode
    description: Default budget mode for task-to-agent routing (alter, frugal, balanced, max_quality)
    allowed_values: [alter, frugal, balanced, max_quality]

  routing_policy.allow_automatic_fallback:
    type: bool
    required: false
    default: false
    ui_group: routing
    ui_label: Allow Automatic Fallback
    description: Whether routing may automatically fall back to alternative agents

  # ── Execution ──
  execution_policy.budget_mode_policy.default_budget_mode:
    type: str
    required: true
    ui_group: execution
    ui_label: Default Budget Mode
    description: Default budget mode for execution policy (alter, frugal, balanced, max_quality)
    allowed_values: [alter, frugal, balanced, max_quality]

  execution_policy.execution_policy.execution_tier:
    type: str
    required: false
    default: T3
    ui_group: execution
    ui_label: Execution Tier
    description: The tier at which Coder executes (T3)

  execution_policy.execution_policy.require_context_before_coding:
    type: bool
    required: false
    default: true
    ui_group: execution
    ui_label: Require Context Before Coding
    description: Whether Coder must have RepoScout + InterfaceMapper context before coding

  # ── Budget ──
  budget_policy.max_tokens_per_task:
    type: int
    required: false
    default: 200000
    ui_group: budget
    ui_label: Max Tokens Per Task
    description: Hard token limit per task run

  budget_policy.warning_threshold_pct:
    type: int
    required: false
    default: 80
    ui_group: budget
    ui_label: Warning Threshold %
    description: Percentage of token budget at which to emit warnings

  # ── Model ──
  agent_model_profiles.default_budget_mode:
    type: str
    required: false
    default: alter
    ui_group: model
    ui_label: Default Budget Mode
    description: Budget mode that selects model tier (alter, frugal, balanced, max_quality)
    allowed_values: [alter, frugal, balanced, max_quality]

  # ── API Keys (secret) ──
  model_providers.deepseek_api_key:
    type: str
    required: false
    ui_group: credentials
    ui_label: DeepSeek API Key
    description: API key for DeepSeek official API
    secret: true

  model_providers.dashscope_api_key:
    type: str
    required: false
    ui_group: credentials
    ui_label: DashScope API Key
    description: API key for Aliyun DashScope (Qwen models)
    secret: true

  model_providers.qwen_token_plan_api_key:
    type: str
    required: false
    ui_group: credentials
    ui_label: Qwen Token Plan API Key
    description: API key for the Qwen Token Plan provider
    secret: true

  model_providers.qwen_token_plan_base_url:
    type: str
    required: false
    ui_group: credentials
    ui_label: Qwen Token Plan Base URL
    description: OpenAI-compatible base URL for the Qwen Token Plan provider
    secret: true

  # ── Worker ──
  worker_registry.max_concurrent:
    type: int
    required: false
    default: 4
    ui_group: worker
    ui_label: Max Concurrent Workers
    description: Maximum number of workers allowed to run concurrently

  # ── Harness ──
  harness_policy.require_validation_gate:
    type: bool
    required: false
    default: true
    ui_group: harness
    ui_label: Require Validation Gate
    description: Whether all agent outputs must pass validation gates

  # ── Sync ──
  auto_sync_policy.truenas_sync_auto_push:
    type: bool
    required: false
    default: false
    ui_group: sync
    ui_label: Auto Push to Truenas
    description: Automatically push config/skills/memory to relay hub after changes
