schema_version: 2

core_runtime:
  - task_run_state
  - artifact_contract
  - memory_policy
  - cost_ledger
  - validation_gates
  - promotion_after_acceptance

pack_synthesis_policy:
  enabled: true
  trigger: no_configured_pack_for_non_code_domain
  agents:
    - Supervisor
    - Researcher
    - ArtifactProducer
    - Verifier
  required_outputs:
    - production_pack_proposal.yml
    - domain_memory_contract.yml
    - lifecycle_profile.yml
  approval_gate: user_or_supervisor_approval_before_execution

packs:
  - pack_id: code_factory
    name: Code Factory
    description: Strong default for codebase build, repair, refactor, testing, and architecture work.
    routes:
      - small_task
      - medium_task
      - interface_sensitive_task
      - research_sensitive_task
      - large_or_risky_task
      - evaluation_task
    project_types:
      - codebase_build_project
      - unknown_project
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - REPO_CONTEXT
      - RESEARCH_OPTIONAL
      - INTERFACE_OPTIONAL
      - CODER_IMPLEMENTATION
      - ARTIFACT_PRODUCTION
      - VALIDATION
      - AUDIT
      - VERIFY
      - ARCHIVE
      - SELF_CHECK
      - SYNC_OPTIONAL
      - FINALIZE
    memory_contract:
      - repo_context
      - architecture_constraints
      - task_packet
      - patch_plan
      - test_results
      - acceptance_report
    quality_gates:
      - implementation_report
      - validation_evidence
      - regression_risk
      - artifact_promotion

  - pack_id: narrative_longform
    name: Longform Narrative Production
    description: Candidate-only longform fiction drafting and audit with structured continuity memory.
    routes:
      - narrative_light_chapter
      - narrative_batch_chapters
      - narrative_heavy_audit
      - narrative_rewrite_plan
    project_types:
      - longform_text_project
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - NARRATIVE_REWRITE_PLAN
      - WRITER_DRAFT
      - FICTION_REVIEW
      - SCRIBE_LEDGER
      - VERIFY
      - SELF_CHECK
      - FINALIZE
    domain_phases:
      - load_authoritative_story_memory
      - prepare_chapter_packet
      - draft_candidate_chapter
      - write_continuity_ledger
      - propose_state_transitions
      - staged_audit_or_promotion
      - plan_blocking_rewrite_before_redraft
    route_contracts:
      narrative_rewrite_plan:
        roles:
          NarrativePlanner:
            required_inputs:
              - runs/task_xxxx/mission_contract.yml
              - runs/task_xxxx/user_request.md
              - runs/task_xxxx/narrative_rewrite_contract.yml
              - heavy-audit aggregate and rewrite proposals declared by narrative_rewrite_contract.yml
              - project_brain/project_fact_snapshot.yml
              - project_artifact_index.yml
            required_outputs:
              - chapter_state_plan.yml
        memory_records:
          - narrative_rewrite_contract.yml
          - chapter_state_plan.yml
          - narrative_planner_validation.yml
      narrative_light_chapter:
        roles:
          Writer:
            required_inputs:
              - runs/task_xxxx/mission_contract.yml
              - runs/task_xxxx/user_request.md
              - runs/task_xxxx/chapter_packet.yml
              - project_brain/project_fact_snapshot.yml
              - project_artifact_index.yml
              - previous continuity_ledger.yml when available
            required_outputs:
              - fiction_draft.md
              - continuity_ledger.yml
              - state_transition_proposal.yml
              - narrative_delivery_receipt.yml
        memory_records:
          - chapter_packet.yml
          - fiction_draft.md
          - continuity_ledger.yml
          - state_transition_proposal.yml
          - narrative_delivery_receipt.yml
      narrative_batch_chapters:
        roles:
          Writer:
            required_inputs:
              - runs/task_xxxx/mission_contract.yml
              - runs/task_xxxx/user_request.md
              - project_brain/project_fact_snapshot.yml
              - project_artifact_index.yml
              - previous continuity_ledger.yml when available
              - chapter range and batch constraints from Supervisor plan
            required_outputs:
              - chapter_batch_plan.yml
              - chapters/
              - batch_continuity_ledger.yml
              - state_transition_proposal.yml
              - narrative_batch_delivery_receipt.yml
        memory_records:
          - chapter_batch_plan.yml
          - chapters/
          - batch_continuity_ledger.yml
          - state_transition_proposal.yml
          - narrative_batch_delivery_receipt.yml
      narrative_heavy_audit:
        roles:
          Reviewer:
            required_inputs:
              - runs/task_xxxx/fiction_draft.md
              - runs/task_xxxx/continuity_ledger.yml
              - runs/task_xxxx/state_transition_proposal.yml
              - project_brain/project_fact_snapshot.yml
              - project_artifact_index.yml
            required_outputs:
              - fiction_review.yml
              - continuity_failure_report.yml
          Scribe:
            required_inputs:
              - runs/task_xxxx/fiction_review.yml
              - runs/task_xxxx/continuity_failure_report.yml
            required_outputs:
              - state_transition_proposal.yml
          Verifier:
            required_inputs:
              - runs/task_xxxx/fiction_review.yml
              - runs/task_xxxx/continuity_failure_report.yml
              - runs/task_xxxx/state_transition_proposal.yml
            required_outputs:
              - revision_or_rewrite_proposal.yml
        memory_records:
          - fiction_draft.md
          - continuity_ledger.yml
          - state_transition_proposal.yml
          - fiction_review.yml
          - continuity_failure_report.yml
          - revision_or_rewrite_proposal.yml
    memory_contract:
      - project_fact_snapshot
      - project_artifact_index
      - chapter_packet
      - continuity_ledger
      - state_transition_proposal
      - chapter_state_plan
      - revision_log
    quality_gates:
      - continuity
      - character_state
      - timeline
      - foreshadowing
      - no_production_write_before_promotion

  - pack_id: article_light
    name: Article Light Draft
    description: Short non-code prose production without long-project governance.
    routes:
      - article_light_draft
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - ARTIFACT_PRODUCTION
      - SELF_CHECK
      - FINALIZE
    domain_phases:
      - clarify_audience_and_angle
      - draft_article
      - structure_check
      - delivery_receipt
    route_contracts:
      article_light_draft:
        roles:
          ArtifactProducer:
            required_inputs:
              - runs/task_xxxx/mission_contract.yml
              - runs/task_xxxx/user_request.md
              - runs/task_xxxx/workflow_plan.yml
            required_outputs:
              - article_draft.md
              - article_structure_check.yml
        memory_records:
          - article_draft.md
          - article_structure_check.yml
    required_outputs:
      - article_draft.md
      - article_structure_check.yml
    memory_contract:
      - user_request
      - local_style_notes
      - article_draft
      - article_structure_check
    quality_gates:
      - article_draft
      - article_structure_check

  - pack_id: read_only_observation
    name: Read-only Multimodal Observation
    description: Evidence-bound inspection of assigned long text, image, video, audio, PDF, or document inputs without production or promotion authority.
    routes:
      - observation_task
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - OBSERVATION_OPTIONAL
      - SELF_CHECK
      - FINALIZE
    domain_phases:
      - stage_assigned_inputs_read_only
      - verify_input_hashes
      - observe_and_extract_evidence
      - report_limitations_and_suggestions
    required_outputs:
      - observation_report.yml
    memory_contract:
      - assigned_input_manifest
      - source_hashes
      - observation_report
    quality_gates:
      - assigned_input_boundary
      - source_hash_integrity
      - evidence_traceability
      - candidate_only_no_project_write

  - pack_id: media_series_production
    name: Media Series Production
    description: Multi-episode image/video production with persistent character, scene, shot, and asset continuity.
    routes:
      - media_generation_task
    project_types:
      - video_generation_project
    task_domains:
      - video_generation
      - video_editing
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - RESEARCH_OPTIONAL
      - ARTIFACT_PRODUCTION
      - VISUAL_OBSERVATION
      - VISUAL_REVIEW
      - VALIDATION
      - VERIFY
      - SELF_CHECK
      - FINALIZE
    domain_phases:
      - script_breakdown
      - episode_plan
      - character_visual_bible
      - scene_and_asset_registry
      - shot_list
      - prompt_pack
      - generation_ledger
      - continuity_qc
      - promotion_after_acceptance
    required_outputs:
      - episode_plan.yml
      - shot_list.yml
      - character_visual_bible.yml
      - asset_registry.yml
      - prompt_pack.yml
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
      - media_continuity_ledger.yml
      - visual_observation_report.yml
      - visual_review_report.yml
      - media_qc_report.yml
      - visual_verification_report.yml
      - visual_acceptance_candidate.yml
      - visual_acceptance_decision.yml
      - narrative_media_delivery_receipt.yml
    memory_contract:
      - source_script
      - show_bible
      - character_visual_bible
      - scene_registry
      - asset_registry
      - shot_ledger
      - prompt_pack
      - generation_ledger
      - generation_receipt
      - generated_assets_manifest
      - visual_observation_report
      - visual_review_report
      - media_qc_report
      - visual_acceptance_decision
    quality_gates:
      - character_visual_consistency
      - shot_continuity
      - asset_provenance
      - generation_ledger_written
      - producer_receipts_bound_to_real_asset_hashes
      - independent_observer_reviewer_verifier_acceptance
      - qa_or_human_acceptance_before_project_artifact_promotion

  - pack_id: media_generation
    name: Single Media Generation
    description: Image/video generation or editing with backend routing, cost controls, generation ledger, and QC.
    routes:
      - media_generation_task
    project_types:
      - media_generation_project
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - ARTIFACT_PRODUCTION
      - VISUAL_OBSERVATION
      - VISUAL_REVIEW
      - VALIDATION
      - VERIFY
      - SELF_CHECK
      - FINALIZE
    required_outputs:
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
      - visual_observation_report.yml
      - visual_review_report.yml
      - media_qc_report.yml
      - visual_verification_report.yml
      - visual_acceptance_candidate.yml
      - visual_acceptance_decision.yml
      - media_delivery_receipt.yml
    memory_contract:
      - media_generation_contract
      - reference_asset_manifest
      - generation_ledger
      - generation_receipt
      - generated_assets_manifest
      - visual_observation_report
      - visual_review_report
      - media_qc_report
      - visual_acceptance_decision
    quality_gates:
      - capability_auth_quota_preflight
      - generation_ledger_written
      - producer_receipts_bound_to_real_asset_hashes
      - independent_observer_reviewer_verifier_acceptance
      - media_qc_report_written

  - pack_id: generic_artifact
    name: Generic Artifact Production
    description: Non-code artifact production when no richer domain pack is configured.
    routes:
      - artifact_production_task
    lifecycle_nodes:
      - INIT_TASK
      - CONTEXT_PROFILE
      - CONTEXT_BUDGET
      - CONTEXT_PACK
      - PREPARE_PLAN
      - SUPERVISOR_PLAN
      - ARTIFACT_PRODUCTION
      - VALIDATION
      - VERIFY
      - SELF_CHECK
      - FINALIZE
    required_outputs:
      - artifact_producer_report.md
      - delivery_receipt.yml
    memory_contract:
      - artifact_task
      - artifact_manifest
      - delivery_receipt
    quality_gates:
      - artifact_contract
      - artifact_manifest
      - delivery_receipt
