schema_version: 4

# ─── AgentLab Routing Policy v4 — Size × Risk × Budget 三轴策略 ────────
# 补充 routing_rules.yml：本文件负责风险/预算策略，route agent 事实源仍是 routing_rules.yml。
# 路由流程: user_request → routing_rules route → classify Risk → select Budget
# ────────────────────────────────────────────────────────────────────────

default_budget: balanced

risk_auto_upgrade:
  R2: balanced    # 高风险强制至少 balanced
  R3: max_quality # 关键风险强制 max_quality

# ══════════════════════════════════════════════════════════════════════
# 项目体量分类 (S0-S5)
# ══════════════════════════════════════════════════════════════════════

size_thresholds:
  S0:
    label: Tiny
    files_max: 1
    context_tokens_max: 8000
    no_architecture_change: true
    typical: 改 README、改配置注释、修小 typo
    route: [Supervisor, Coder]

  S1:
    label: Small
    files_max: 5
    context_tokens_max: 30000
    may_have_local_change: true
    typical: 加 CLI 参数、修函数 bug、补单元测试
    route: [Supervisor, RepoScout, Coder, TesterAuditor]

  artifact_production:
    label: ArtifactProduction
    typical: 文本、图片、视频、音频、表格、演示文稿或混合产物生成
    route: [Supervisor, ArtifactProducer, TesterAuditor, Verifier, Archivist]

  S2:
    label: Medium
    files_max: 20
    context_tokens_max: 120000
    may_have_interface_change: true
    typical: 新功能模块、API endpoint、数据流改造
    route: [Supervisor, RepoScout, InterfaceMapper, Coder, TesterAuditor, Verifier, Archivist]

  S3:
    label: Large
    files_max: 100
    context_tokens_max: 500000
    architecture_level_change: true
    typical: 重构插件架构、引入任务队列、多 Agent 编排
    route: [Supervisor, RepoScout, Researcher, InterfaceMapper, Coder, TesterAuditor, Verifier, Archivist]

  S4:
    label: XLarge
    context_tokens_min: 500000
    multi_repo_possible: true
    typical: 平台化 AgentLab、长期维护系统、跨服务迁移
    route: [Supervisor, RepoScout, Researcher, InterfaceMapper, Coder, TesterAuditor, Verifier, Archivist]

# ══════════════════════════════════════════════════════════════════════
# 风险等级分类 (R0-R3)
# ══════════════════════════════════════════════════════════════════════

risk_keywords:
  high:
    - auth
    - authentication
    - permission
    - authorization
    - payment
    - billing
    - "database migration"
    - "schema migration"
    - delete
    - drop
    - truncate
    - production
    - prod
    - security
    - "private key"
    - token
    - credential
    - CI/CD
    - release
    - deployment
    - "data migration"
    - 鉴权
    - 认证
    - 权限
    - 支付
    - 账单
    - 数据库迁移
    - 删除
    - 生产环境
    - 安全
    - 私钥
    - 凭证
    - 部署
    - 发布

  critical:
    - irreversible
    - "user data"
    - credential
    - compliance
    - "production database"
    - "access control"
    - "data loss"
    - "GDPR"
    - "PII"
    - encryption
    - 不可逆
    - 用户数据
    - 合规
    - 生产数据库
    - 权限控制
    - 数据丢失
    - 加密

# ══════════════════════════════════════════════════════════════════════
# 预算模式选择
# ══════════════════════════════════════════════════════════════════════

budget_selection:
  methods:
    - cli_flag: "--budget {frugal|balanced|max-quality}"
    - env_var: "AGENTLAB_BUDGET_MODE"
    - user_request_md_keyword: "budget_mode:"
    - default: balanced

  descriptions:
    frugal:
      display: "💰 最低成本"
      risk_limits: [R0, R1]  # R2+ 自动升级
    balanced:
      display: "⚖️ 均衡 (默认)"
      risk_limits: [R0, R1, R2]  # R3 自动升级到 max_quality
    max_quality:
      display: "🛡️ 全量运算"
      risk_limits: [R0, R1, R2, R3]

# ══════════════════════════════════════════════════════════════════════
# Skippable Agent Rules
# ══════════════════════════════════════════════════════════════════════

skip_rules:
  RepoScout:
    skip_when: "S0 或目标文件明显"
    include_when: "S2+ 或接口相关"
  InterfaceMapper:
    skip_when: "无接口/API/Schema/数据模型变更"
    include_when: "S2+ 且有接口关键词"
    always_include: [S4]
  Researcher:
    skip_when: "任务不涉及外部文档、竞品、最新规范"
    include_when: "需要搜索外部资料"
  TesterAuditor:
    skip_when: "S0 纯文档/格式修改且 R0"
    include_when: "所有 S1+ 且 R1+"
  Verifier:
    skip_when: "S0 或 R0 或 frugal"
    include_when: "S2+ 或 R2+"
  Archivist:
    skip_when: "S0 或 frugal"
    include_when: "S2+ 或 balanced 及以上"

# ══════════════════════════════════════════════════════════════════════
# Agent 执行顺序
# ══════════════════════════════════════════════════════════════════════

agent_order:
  - Supervisor
  - RepoScout
  - Researcher
  - InterfaceMapper
  - Coder
  - ArtifactProducer
  - TesterAuditor
  - Verifier
  - Archivist

# Runtime model routing is orthogonal to the task/agent route above.  Presets
# set quality floors and cost pressure; they do not contain duplicate matrices.
runtime_routing:
  selector: hard_filters_then_quality_floor_then_min_effective_cost
  fallback_boundary: checkpoint_only
  presets:
    full:
      quality_floor: 0.88
      intent: promotion_or_high_quality
    performance:
      quality_floor: 0.82
      intent: default_quality_cost_balance
    low:
      quality_floor: 0.65
      intent: cheapest_route_above_role_floor
    promotion:
      quality_floor: 0.92
      intent: independent_acceptance
  quota:
    hard_reserve_percent: 5.0
    admission_floor: max_hard_reserve_or_predicted_unit_plus_risk_reserve
    probe_before_task: true
    probe_at_checkpoint: true
    probe_after_status_codes: [401, 402, 429]
    stale_after_seconds: 600
    long_batch_requires_fresh_telemetry: true
    resume_jitter_seconds: [60, 180]
    reprobe_before_resume: true
  task_demand_defaults:
    tokens_by_project_size:
      L1: {input: 2000, output: 1000}
      L2: {input: 5000, output: 2500}
      L3: {input: 10000, output: 5000}
    predicted_quota_percent_by_project_size: {L1: 2.0, L2: 5.0, L3: 12.0}
    risk_reserve_percent_by_risk_level: {R0: 0.0, R1: 2.0, R2: 5.0, R3: 10.0}
    long_batch_route_markers: [heavy_audit, batch, series_scale, promotion]
  privacy:
    default_data_class: private
    project_provider_allowlist_gates_switching: true
  effective_cost_weights:
    quota_scarcity: 0.5
    retry: 1.0
    latency: 0.25
    switch: 0.05
  role_demands:
    supervisor:
      capability_weights: {reasoning: 0.55, agentic_control: 0.30, audit: 0.15}
    observer:
      capability_weights: {multimodal: 0.55, audit: 0.25, summarization: 0.20}
    reposcout:
      capability_weights: {coding: 0.45, reasoning: 0.35, summarization: 0.20}
    researcher:
      capability_weights: {research: 0.60, reasoning: 0.25, summarization: 0.15}
    interface_mapper:
      capability_weights: {coding: 0.40, reasoning: 0.45, audit: 0.15}
    prompt_engineer:
      capability_weights: {writing: 0.55, reasoning: 0.30, summarization: 0.15}
    coder:
      capability_weights: {coding: 0.65, reasoning: 0.25, agentic_control: 0.10}
    artifact_producer:
      capability_weights: {artifact_generation: 0.55, writing: 0.25, reasoning: 0.20}
    tester_auditor:
      capability_weights: {audit: 0.55, coding: 0.25, reasoning: 0.20}
    verifier:
      capability_weights: {audit: 0.60, reasoning: 0.30, summarization: 0.10}
    archivist:
      capability_weights: {summarization: 0.70, audit: 0.20, writing: 0.10}
    writer:
      capability_weights: {writing: 0.45, narrative_continuity: 0.40, reasoning: 0.15}
    reviewer:
      capability_weights: {audit: 0.45, narrative_continuity: 0.35, reasoning: 0.20}
    visual_reviewer:
      capability_weights: {multimodal: 0.55, audit: 0.35, reasoning: 0.10}
      required_modalities: [image]
    scribe:
      capability_weights: {summarization: 0.55, writing: 0.30, audit: 0.15}
    narrative_planner:
      capability_weights: {narrative_continuity: 0.45, reasoning: 0.35, writing: 0.20}

