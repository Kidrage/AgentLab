schema_version: 1
policy_id: artifact_task_policy
authority: _shared/AGENT_PROTOCOL.md
summary: >
  Non-code and mixed deliverables are executed through ArtifactProducer with a
  structured ArtifactTask contract. Coder remains the code and automation role.
role: ArtifactProducer
contract:
  packet_type: agentlab_artifact_task
  required_fields:
    - artifact_type
    - output.path
    - output.format
    - requirements
    - validation
    - routing
  failure_statuses:
    - capability_mismatch
    - needs_fallback
    - validation_failed
artifact_types:
  text:
    output_formats: [markdown, txt, docx]
    required_capabilities: [write_text_artifact, write_artifact_file]
  image:
    output_formats: [png, jpg, webp]
    required_capabilities: [generate_image, write_artifact_file]
  video:
    output_formats: [mp4, mov]
    required_capabilities: [generate_video, write_artifact_file]
  audio:
    output_formats: [wav, mp3]
    required_capabilities: [generate_audio, write_artifact_file]
  spreadsheet:
    output_formats: [xlsx, csv]
    required_capabilities: [create_spreadsheet, write_artifact_file]
  presentation:
    output_formats: [pptx, pdf]
    required_capabilities: [create_presentation, write_artifact_file]
  mixed:
    output_formats: [directory]
    required_capabilities: [produce_mixed_artifacts, write_artifact_file, validate_artifact_contract]
providers:
  claude_deepseek:
    worker: claude_code
    provider_type: cli
    invocation_contract: claude
    runtime_provider_ids: [deepseek_api]
    capacity_routes:
      full: ArtifactProducerPro
      performance: ArtifactProducerPro
      low: ArtifactProducerPro
    priority: 120
    fallback: false
    handles: [text, spreadsheet, presentation]
    output_formats: [markdown, txt, docx, xlsx, csv, pptx, pdf]
    capabilities:
      - write_text_artifact
      - create_spreadsheet
      - create_presentation
      - write_artifact_file
      - validate_artifact_contract
  qwen_cli:
    worker: qwen
    provider_type: cli
    invocation_contract: qwen_artifact
    runtime_provider_ids: [dashscope_api]
    capacity_routes:
      full: ArtifactProducerQwenMax
      performance: ArtifactProducerQwen
      low: ArtifactProducerQwenLow
    priority: 90
    fallback: true
    handles: [text, spreadsheet, presentation]
    output_formats: [markdown, txt, docx, xlsx, csv, pptx, pdf]
    capabilities:
      - write_text_artifact
      - create_spreadsheet
      - create_presentation
      - write_artifact_file
      - validate_artifact_contract
  grok_media:
    status: quarantined
    automatic_use: false
    worker: grok
    provider_type: cli
    invocation_contract: grok_media
    capacity_routes:
      full: ArtifactProducer
      performance: ArtifactProducer
      low: ArtifactProducer
    priority: 110
    fallback: true
    handles: [image, video]
    output_formats: [png, jpg, webp, mp4, mov]
    capabilities:
      - generate_image
      - generate_video
      - write_artifact_file
      - validate_artifact_contract
  qwen_37max_api:
    worker: qwen
    provider_type: api
    runtime_activation: explicit_full_api_only
    allowed_runtime_providers: [qwen3, qwen, qwen-flash]
    priority: 10
    fallback: true
    handles: [text]
    output_formats: [markdown, txt]
    capabilities:
      - write_text_artifact
      - write_artifact_file
failure_contract:
  capability_mismatch:
    required_fields: [missing_capability, recommended_provider, recommended_role]
  needs_fallback:
    required_fields: [reason, attempted_provider, recommended_provider]
