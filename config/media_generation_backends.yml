schema_version: 1

defaults:
  cost_policy: free_first
  paid_api_policy: approval_required
  final_promotion_requires: qa_or_human_acceptance
  run_artifact_dir: runs/<task_id>/artifacts/
  production_artifact_dir: projects/<Project>/artifacts/
  required_ledgers:
    - artifact_manifest.yml
    - generation_ledger.yml
    - media_qc_report.yml
  refresh_handoff_after_material_change: true

backends:
  hermes_grok_oauth:
    display_name: Hermes + Grok OAuth CLI
    capabilities:
      - orchestration
      - prompt_refinement
      - reference_asset_management
      - multi_turn_image_editing
      - video_generation_handoff
    modalities:
      - image
      - video
      - image_to_video
      - mixed
    quality_tier: high
    cost_tier: subscription_or_quota
    quota_policy: prefer_for_high_quality_single_or_short_media
    auth_state: ready
    auth_probe: hermes_xai_oauth_session
    adapter_state: configured
    adapter_kind: local_grok_cli
    adapter_note: Uses Hermes xAI OAuth oneshot as the Grok worker shell for live reachability and media handoff smoke; this is an internal ArtifactProducer worker path and does not by itself prove returned media files.
    worker_id: grok
    role_owner: ArtifactProducer
    internal_worker: true
    command: hermes
    execution_kernel: hermes_workflow_shell
    orchestration_scope: bounded_role_session_backend
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - structured_output_and_qc
    agentlab_boundary:
      role_owner_remains: ArtifactProducer
      worker_id_remains: grok
      shell_state_is_not_project_memory: true
      shell_background_work_requires_status_receipt: true
    command_contract:
      session_smoke: hermes --ignore-rules --provider xai-oauth -m grok-build-0.1 -z <prompt>
    required_receipts:
      - generation_ledger.yml
      - media_qc_report.yml
      - role_session_receipt.yml
      - tool_or_mcp_usage_ledger.yml
    execution_mode: orchestrated_worker
    approval_required: false
    final_artifact_allowed: false
    fallback_rank: 10

  grok_direct:
    display_name: Grok Direct API Fallback
    capabilities:
      - direct_prompt_to_image
      - direct_prompt_to_video
    modalities:
      - image
      - video
    quality_tier: standard
    cost_tier: subscription_or_quota
    quota_policy: explicit_fallback_only_requires_user_approval
    auth_state: fallback_only
    auth_probe: grok_direct_env_or_session
    adapter_state: configured
    adapter_kind: xai_imagine_rest
    adapter_note: Fallback-only xAI Imagine REST path. The default Grok route is hermes_grok_oauth via the local grok CLI session; this API path requires explicit approval even when XAI_API_KEY is present.
    api_key: env:XAI_API_KEY
    api_key_env: XAI_API_KEY
    api_key_env_aliases:
      - GROK_API_KEY
    base_url: https://api.x.ai/v1
    endpoints:
      image_generation: /images/generations
      video_generation: /videos/generations
      video_poll: /videos/{request_id}
    models:
      image: grok-imagine-image-quality
      video: grok-imagine-video-1.5
    default_response_format: b64_json
    default_image_count: 1
    default_video_duration_seconds: 8
    execution_mode: direct_provider
    fallback_only: true
    approval_required: true
    fallback_rank: 20

  bailian_cli:
    display_name: Bailian CLI
    capabilities:
      - image_generate
      - image_edit
      - video_generate
      - video_edit
      - reference_video
    modalities:
      - image
      - video
      - reference_video
      - mixed
    quality_tier: high
    cost_tier: paid_api
    quota_policy: approval_required_before_paid_generation
    auth_state: ready
    auth_probe: bl_profile
    adapter_state: configured
    execution_mode: local_cli
    approval_required: true
    command_contract:
      image_generation: bl image generate
      image_editing: bl image edit
      video_generation: bl video generate
      video_editing: bl video edit
      reference_video: bl video ref
    forbidden_command_contracts:
      - bl text chat
    fallback_rank: 30

  ark_cli:
    display_name: Ark CLI
    capabilities:
      - image_generate
      - video_generate
      - premium_model_selection
    modalities:
      - image
      - video
      - mixed
    quality_tier: premium
    cost_tier: paid_api
    quota_policy: pending_activation_then_approval_required
    auth_state: pending_activation
    auth_probe: ark_profile_and_endpoint
    adapter_state: configured
    execution_mode: local_cli
    approval_required: true
    command_contract:
      preflight:
        - arkcli resources list
        - arkcli models get supported_params
      execute: arkcli +gen
      poll: arkcli gen get
    fallback_rank: 40

  agy_media:
    display_name: Agy Media Harness
    capabilities:
      - prompt_batch_exploration
      - low_cost_draft_candidates
      - lightweight_media_handoff
    modalities:
      - image
      - video
      - mixed
    quality_tier: draft
    cost_tier: low_or_quota
    quota_policy: high_quota_draft_only
    auth_state: ready
    auth_probe: agy_cli
    adapter_state: configured
    execution_mode: harness_route
    approval_required: false
    final_artifact_allowed: false
    fallback_rank: 50

policies:
  high_quality_single_or_short:
    description: High-quality single image or short video.
    backend_chain:
      - hermes_grok_oauth
      - grok_direct
      - bailian_cli
      - ark_cli

  fast_simple:
    description: Simple prompt to image or video direct output.
    backend_chain:
      - hermes_grok_oauth
      - grok_direct
      - bailian_cli

  draft_batch:
    description: Batch prompt exploration or low-cost draft media.
    backend_chain:
      - agy_media
      - hermes_grok_oauth
      - grok_direct
      - bailian_cli

  commercial_final:
    description: Commercial or final delivery quality target.
    backend_chain:
      - hermes_grok_oauth
      - bailian_cli
      - ark_cli

  commercial_final_after_ark_activation:
    description: Future route when Ark activation is complete.
    backend_chain:
      - ark_cli
      - hermes_grok_oauth
      - bailian_cli
