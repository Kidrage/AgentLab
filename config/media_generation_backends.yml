schema_version: 1

defaults:
  cost_policy: free_first
  paid_api_policy: approval_required
  final_promotion_requires: qa_or_human_acceptance
  producer_self_acceptance_forbidden: true
  independent_multimodal_observer_required: true
  independent_aesthetic_reviewer_required: true
  run_artifact_dir: runs/<task_id>/artifacts/
  production_artifact_dir: projects/<Project>/artifacts/
  required_ledgers:
    - artifact_manifest.yml
    - generation_ledger.yml
    - media_qc_report.yml
  refresh_handoff_after_material_change: true

backends:
  hermes_grok_oauth:
    display_name: Hermes + Grok OAuth CLI
    status: quarantined
    automatic_use: false
    capabilities:
      - orchestration
      - prompt_refinement
      - reference_asset_management
      - multi_turn_image_editing
      - video_generation_handoff
    modalities:
      - image
      - video
      - image_to_video
    quality_tier: high
    cost_tier: subscription_or_quota
    quota_policy: explicit_bounded_canary_only_while_quarantined
    auth_state: unknown
    auth_probe: hermes auth status xai-oauth
    capacity_source: config/model_capacity.yml
    adapter_state: configured
    adapter_kind: local_grok_cli
    adapter_note: Uses Hermes xAI OAuth plus the registered image-generation tool. Text output from Grok does not prove a media artifact; paths, hashes, and independent QC are mandatory.
    worker_id: grok
    role_owner: ArtifactProducer
    internal_worker: true
    command: hermes
    execution_kernel: hermes_workflow_shell
    orchestration_scope: bounded_role_session_backend
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - structured_output_and_qc
    agentlab_boundary:
      role_owner_remains: ArtifactProducer
      worker_id_remains: grok
      shell_state_is_not_project_memory: true
      shell_background_work_requires_status_receipt: true
    command_contract:
      session_smoke: hermes chat -Q --provider xai-oauth -m grok-4.3 -q <prompt>
    registered_generation_models:
      image: [grok-imagine-image-quality]
      video: [grok-imagine-video-1.5]
      image_to_video: [grok-imagine-video-1.5]
    required_receipts:
      - role_session_receipt.yml
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
      - outbound_context_manifest_media.yml
    execution_mode: orchestrated_worker
    approval_required: false
    final_artifact_allowed: false
    fallback_rank: 10

  grok_direct:
    display_name: Grok Direct API Fallback
    capabilities:
      - direct_prompt_to_image
      - direct_prompt_to_video
    modalities:
      - image
      - video
    quality_tier: standard
    cost_tier: subscription_or_quota
    quota_policy: explicit_fallback_only_requires_user_approval
    auth_state: fallback_only
    auth_probe: grok_direct_env_or_session
    adapter_state: configured
    adapter_kind: xai_imagine_rest
    adapter_note: Fallback-only xAI Imagine REST path. The quarantined Hermes+xAI OAuth shell is available only through an explicit canary policy; this API path requires explicit approval even when XAI_API_KEY is present.
    api_key: env:XAI_API_KEY
    api_key_env: XAI_API_KEY
    api_key_env_aliases:
      - GROK_API_KEY
    base_url: https://api.x.ai/v1
    endpoints:
      image_generation: /images/generations
      video_generation: /videos/generations
      video_poll: /videos/{request_id}
    models:
      image: grok-imagine-image-quality
      video: grok-imagine-video-1.5
    registered_generation_models:
      image: [grok-imagine-image-quality]
      video: [grok-imagine-video-1.5]
    default_response_format: b64_json
    default_image_count: 1
    default_video_duration_seconds: 8
    execution_mode: direct_provider
    fallback_only: true
    approval_required: true
    fallback_rank: 20

  bailian_cli:
    display_name: Bailian CLI
    capabilities:
      - image_generate
      - image_edit
      - video_generate
      - video_edit
      - reference_video
    modalities:
      - image
      - video
      - reference_video
      - mixed
    quality_tier: high
    cost_tier: paid_api
    quota_policy: approval_required_before_paid_generation
    auth_state: ready
    auth_probe: bl_profile
    adapter_state: configured
    execution_mode: local_cli
    approval_required: true
    command_contract:
      image_generation: bl image generate
      image_editing: bl image edit
      video_generation: bl video generate
      video_editing: bl video edit
      reference_video: bl video ref
    forbidden_command_contracts:
      - bl text chat
    fallback_rank: 30

  ark_cli:
    display_name: Ark CLI
    capabilities:
      - image_generate
      - video_generate
      - premium_model_selection
    modalities:
      - image
      - video
      - mixed
    quality_tier: premium
    cost_tier: paid_api
    quota_policy: pending_activation_then_approval_required
    auth_state: pending_activation
    auth_probe: ark_profile_and_endpoint
    adapter_state: configured
    execution_mode: local_cli
    approval_required: true
    command_contract:
      preflight:
        - arkcli resources list
        - arkcli models get supported_params
      execute: arkcli +gen
      poll: arkcli gen get
    fallback_rank: 40

  agy_media:
    display_name: Agy Visual Preproduction Observer
    capabilities:
      - prompt_batch_exploration
      - low_cost_visual_briefs
      - storyboard_text
      - reference_asset_observation
    modalities:
      - text
    output_modalities:
      - text
    image_generation: false
    quality_tier: preproduction_only
    cost_tier: low_or_quota
    quota_policy: high_quota_draft_only
    auth_state: unknown
    auth_probe: agy models
    capacity_source: config/model_capacity.yml
    adapter_state: configured
    execution_mode: observer_preproduction_route
    approval_required: false
    final_artifact_allowed: false
    fallback_rank: 50

policies:
  high_quality_single_or_short:
    description: High-quality single image or short video.
    backend_chain:
      - bailian_cli
      - ark_cli
      - grok_direct

  fast_simple:
    description: Simple prompt to image or video direct output.
    backend_chain:
      - bailian_cli
      - grok_direct

  draft_batch:
    description: Batch media candidates; Agy may prepare briefs but is not a renderer.
    backend_chain:
      - bailian_cli
      - grok_direct
    preproduction_observer: agy_media

  commercial_final:
    description: Commercial or final delivery quality target.
    backend_chain:
      - bailian_cli
      - ark_cli
      - grok_direct

  commercial_final_after_ark_activation:
    description: Future route when Ark activation is complete.
    backend_chain:
      - ark_cli
      - bailian_cli
      - grok_direct

  explicit_grok_canary:
    description: Operator-selected bounded canary for the quarantined Hermes xAI OAuth backend.
    backend_chain:
      - hermes_grok_oauth
