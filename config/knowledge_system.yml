version: 2
mode: assist
auto_memory: propose_only
storage:
  runtime_path: .agentlab_runtime/knowledge
  keyword_backend: auto
  catalog: sqlite
  shard_per_space: true
  replicate_derived_databases: false
indexing:
  system_sources: true
  project_sources: true
  project_allowlist:
  - AgentLab
  - Crown_of_Ash
  refresh_on_prepare: false
  bootstrap_missing_spaces: true
  max_file_bytes: 1000000
  media_payload: metadata_only
retrieval:
  top_k: 8
  required_channels:
  - keyword
  optional_channels:
  - semantic
  - graph
  fusion: deterministic_rrf
  eligible_authority:
  - canonical
  - accepted
  eligible_lifecycle:
  - active
