# Capability Schema Definitions for AgentLab M2-2
capabilities:
  planning:
    display_name: Planning
    description: Formulate plans and strategic paths.
    risk_level: medium
  task_decomposition:
    display_name: Task Decomposition
    description: Break tasks down into smaller steps.
    risk_level: low
  budget_reasoning:
    display_name: Budget Reasoning
    description: Analyze and control task token and monetary budgets.
    risk_level: low
  read_only_repo_search:
    display_name: Read-only Repo Search
    description: Search files and directory structures inside repository without modifying.
    risk_level: low
  symbol_lookup:
    display_name: Symbol Lookup
    description: Look up functions, classes, and types definition.
    risk_level: low
  structural_ast_scan:
    display_name: Structural AST Scan
    description: Analyze syntax trees and code structures.
    risk_level: low
  external_research:
    display_name: External Research
    description: Run deep surveys of external resources or documentation.
    risk_level: medium
  web_search:
    display_name: Web Search
    description: Query search engines for information.
    risk_level: medium
  context_assembly:
    display_name: Context Assembly
    description: Construct the context package and prompt for workers.
    risk_level: low
  prompt_handoff:
    display_name: Prompt Handoff
    description: Handle handoffs of prompts and context to executors.
    risk_level: low
  file_edit:
    display_name: File Edit
    description: Modify file contents directly.
    risk_level: high
  patch_generation:
    display_name: Patch Generation
    description: Generate repository diffs and git patches.
    risk_level: high
  shell_execution:
    display_name: Shell Execution
    description: Run arbitrary shell commands.
    risk_level: high
  test_execution:
    display_name: Test Execution
    description: Execute unit and integration test suites.
    risk_level: medium
  diff_review:
    display_name: Diff Review
    description: Perform code reviews on diff outputs.
    risk_level: medium
  lint_check:
    display_name: Lint Check
    description: Run linter tools to verify style and semantics.
    risk_level: low
  format_check:
    display_name: Format Check
    description: Verify formatting styles on codebase.
    risk_level: low
  secret_scan:
    display_name: Secret Scan
    description: Detect exposed credentials, keys, or passwords.
    risk_level: low
  artifact_archive:
    display_name: Artifact Archive
    description: Save and package task outputs into archive directory.
    risk_level: low
  git_commit:
    display_name: Git Commit
    description: Create git commits and manage branch history.
    risk_level: medium
  multimodal_generation:
    display_name: Multimodal Generation
    description: Generate or process images, audio, or video files.
    risk_level: high
  cloud_upload:
    display_name: Cloud Upload
    description: Upload assets or data to remote cloud servers.
    risk_level: high
  rag_query:
    display_name: RAG Query
    description: Query local or remote knowledge base.
    risk_level: low
  frontdesk_chat:
    display_name: Frontdesk Chat
    description: Handle chat gateway and operator communication.
    risk_level: low
  approval_ui:
    display_name: Approval UI
    description: Prompt and manage operator approvals.
    risk_level: low
  long_context:
    display_name: Long Context
    description: Inspect bounded long-form input without truncating required evidence.
    risk_level: low
  tool_routing:
    display_name: Tool Routing
    description: Select a governed tool or worker for a bounded task.
    risk_level: medium
  external_network:
    display_name: External Network
    description: Access a network outside the local workspace.
    risk_level: high
  multimodal_observation:
    display_name: Multimodal Observation
    description: Read assigned text, image, video, audio, or PDF evidence without mutation.
    risk_level: low
  evidence_quality_review:
    display_name: Evidence Quality Review
    description: Evaluate evidence quality, uncertainty, integrity, and acceptance claims.
    risk_level: low
  artifact_task_contract:
    display_name: Artifact Task Contract
    description: Execute only within a governed artifact-production contract.
    risk_level: medium
  write_artifact_file:
    display_name: Write Artifact File
    description: Materialize a non-code candidate artifact to an authorized path.
    risk_level: high
  validate_artifact_contract:
    display_name: Validate Artifact Contract
    description: Validate artifact outputs against their declared contract.
    risk_level: medium
  write_text_artifact:
    display_name: Write Text Artifact
    description: Draft candidate prose or another governed text deliverable.
    risk_level: medium
  generate_image:
    display_name: Generate Image
    description: Generate a raster image candidate through a registered backend.
    risk_level: high
  generate_video:
    display_name: Generate Video
    description: Generate a video candidate through a registered backend.
    risk_level: high
  generate_audio:
    display_name: Generate Audio
    description: Generate an audio candidate through a registered backend.
    risk_level: high
  create_spreadsheet:
    display_name: Create Spreadsheet
    description: Create a governed spreadsheet artifact.
    risk_level: medium
  create_presentation:
    display_name: Create Presentation
    description: Create a governed presentation artifact.
    risk_level: medium
  state_ledger:
    display_name: State Ledger
    description: Maintain candidate continuity or state-transition ledgers.
    risk_level: medium
  unapproved_source_edit:
    display_name: Unapproved Source Edit
    description: Modify source outside a role's explicit authorization.
    risk_level: high
  silent_provider_fallback:
    display_name: Silent Provider Fallback
    description: Switch provider or model without a governed decision and receipt.
    risk_level: high
  unrelated_file_edit:
    display_name: Unrelated File Edit
    description: Modify a file outside the assigned task scope.
    risk_level: high
  unsafe_delete:
    display_name: Unsafe Delete
    description: Delete data without an explicit safe authorization path.
    risk_level: high
