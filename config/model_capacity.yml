schema_version: 1

authority:
  purpose: run_local_model_and_subscription_capacity_governance
  owns:
    - capacity_pool_breakers
    - provider_reset_observations
    - canary_leases
    - capacity_approved_route_chains
  does_not_own:
    - role_lifecycle
    - model_capability_facts
    - invocation_command_templates
    - pricing

ledger:
  filename: model_capacity_ledger.yml
  scope: run_local
  atomic_yaml_required: true
  persist_raw_probe_output: false
  required_observation_fields:
    - source_kind
    - observed_at
    - expires_at
    - reset_at
    - remaining
    - confidence
    - attempt_id
    - failure_class

failure_classes:
  pool_scoped: [rate_limited, quota_exhausted, auth_missing, network_required]
  route_scoped: [model_unavailable]
  non_capacity: [unknown]

canary_lease_seconds: 300
transient_network_backoff_seconds: 900

probe_policy:
  allowlist_shapes:
    - [agy, models]
    - [codex, login, status]
    - [grok, models]
    - [hermes, auth, status, "<provider>"]
  forbidden_commands:
    - [hermes, status, --all]
  notes:
    - Never use a broad Hermes status command for capacity discovery because it may expose secrets.
    - Probe output is classified in memory and is never persisted verbatim.
    - Agy models is catalog-only; Agy exposes no remaining-quota or reset-time command.
    - Grok models confirms native OAuth login and model availability but does not report remaining quota or reset time.
    - Codex login status and Hermes auth status are auth-only and do not report quota balances.
    - remaining and reset_at stay null until provider runtime evidence supplies them.

pools:
  agy_gemini_observer:
    shared_pool_id: agy_gemini_observer
    provider: agy_gemini_oauth
    billing_mode: subscription
    probe: [agy, models]
    probe_capability:
      kind: catalog_only
      reports_remaining: false
      reports_reset_at: false
      recovery_source: runtime_failure_evidence_and_reset_canary
    declared_windows:
      rolling:
        period_seconds: 18000
        limit: null
        remaining: null
        reset_at: null
        source_kind: user_declared
        confidence: medium
      weekly:
        period_seconds: 604800
        limit: null
        remaining: null
        reset_at: null
        source_kind: user_declared
        confidence: medium

