# AgentLab Model Pricing Reference
# Used by cost_tracker.py and agent_runtime/costing to estimate API usage cost.
#
# Schema notes:
# - Use *_per_1m_usd for new entries. Legacy input_per_1m/output_per_1m
#   remain accepted for compatibility.
# - Set per-unit prices to null for TBD/unknown/subscription pricing.
# - Numeric 0 is treated as unknown unless the entry explicitly says free: true.
# - Media rows use exact provider model IDs and named media_unit_prices_usd.
# - Future LiteLLM/tokencost/genai-prices adapters can populate the same fields.

