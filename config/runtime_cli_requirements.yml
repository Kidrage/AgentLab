schema_version: 1
policy_id: runtime_cli_requirements
authority:
  agent_inventory: config/shared_agent_directory.yml
  role_bindings: config/agent_role_bindings.yml
  invocation_contracts: config/worker_invocation_contracts.yml
  model_profiles: config/agent_model_profiles.yml
  model_catalog: config/model_catalog.yml

components:
  hermes:
    kind: agent_cli
    release_requirement: required
    command: hermes
    auth_mode: provider_specific_local_session_or_private_env
    model_binding: command_template
    install_source: Hermes Agent upstream installer
    version_probe: hermes --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker hermes
    live_smoke: hermes --provider deepseek -m deepseek-v4-flash --safe-mode -t "" -z "Return AGENTLAB_HERMES_DEEPSEEK_SMOKE_OK only."
    capacity_probe: hermes config check
    forbidden_probe: hermes status --all
    notes: General workflow/frontdesk shell, alter-tier DeepSeek Flash execution shell, and governed Codex-OAuth Supervisor shell. Retired providers are not selectable.
  claude_code:
    kind: agent_cli
    release_requirement: required_for_selected_writer_and_reviewer_tiers
    command: claude
    auth_mode: shell_managed_private_configuration
    model_binding: command_template
    install_source: npm package @anthropic-ai/claude-code
    version_probe: claude --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker claude
    live_smoke: claude --model deepseek-v4-pro --effort max --max-budget-usd 0.05 --safe-mode --restricted --strict-mcp-config --disable-slash-commands --no-chrome --no-session-persistence --permission-mode dontAsk --output-format json --tools "" -p "Return AGENTLAB_CLAUDE_WRITER_SMOKE_OK only."
    notes: The 2026-08-28 isolated live probes completed on both DeepSeek V4 Pro and V4 Flash with exact modelUsage binding and zero tool/subagent activity. AgentLab imports only a fixed provider/auth/proxy environment allowlist from the private Claude settings before starting safe mode; hooks, plugins, skills, memory, MCP and workspace discovery remain disabled.
  codex:
    kind: agent_cli
    release_requirement: required
    command: codex
    auth_mode: local_oauth_session
    model_binding: command_template
    install_source: OpenAI Codex standalone updater or npm package @openai/codex
    version_probe: codex --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker codex
    live_smoke: codex exec --json --model gpt-5.6-sol -c 'model_reasoning_effort="xhigh"' "Return AGENTLAB_CODEX_SMOKE_OK only."
    capacity_source: config/model_capacity.yml
    capacity_probe: codex login status
    notes: Codex is the current ArtifactProducer default at GPT-5.6 Sol medium and the explicit low-tier RepoScout exception at high reasoning. Other Codex roles remain governed optional routes. Every Codex route must use a Codex CLI provider/model identity and never borrow a DeepSeek or Hermes identity.
  qwen:
    kind: agent_cli
    release_requirement: required
    command: qwen
    auth_mode: shell_managed_private_configuration
    model_binding: shell_configuration
    install_source: npm package @qwen-code/qwen-code
    version_probe: qwen --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker qwen
    live_smoke: qwen --bare --auth-type openai --openai-base-url https://dashscope.aliyuncs.com/compatible-mode/v1 --model qwen3.6-flash --approval-mode default --output-format json "Return AGENTLAB_QWEN_SMOKE_OK only."
    notes: General analysis/audit worker and ArtifactTask backend for text, spreadsheet, and presentation ArtifactProducer outputs. Narrative heavy audit uses a dedicated sealed stdin contract with zero tool calls; private context requires explicit approval. Cross-provider mixed work remains blocked until a composite adapter exists, and provider/model selection is owned by the governed Qwen CLI route.
  agy:
    kind: agent_cli
    release_requirement: required
    command: agy
    auth_mode: local_agy_oauth_session
    model_binding: shell_configuration
    install_source: Agy upstream release
    version_probe: agy --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker agy
    live_smoke: ./agentlab.sh agy-cli-smoke --live
    capacity_source: config/model_capacity.yml
    capacity_probe: agy models
    quota_visibility: failure_observation_only
    notes: Multimodal Observer, isolated visual Reviewer, NarrativePlanner, Researcher, and Scribe use Gemini 3.6 through the shared Agy subscription pool. Claude Code owns the current Writer tiers through exact DeepSeek Pro/Flash contracts; Agy Writer remains an explicit alternate only. Agy has no quota/status command; agy models is catalog-only, and remaining/reset stay unknown until provider error evidence. Never invent /usage or use GEMINI_API_KEY.
  grok:
    kind: agent_cli_backend
    release_requirement: historical_only
    command: grok
    legacy_command: hermes
    auth_mode: local_grok_oauth_session
    model_binding: command_template
    install_source: native Grok CLI
    version_probe: grok --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker grok
    live_smoke: disabled
    capacity_probe: grok models
    forbidden_probe: hermes status --all
    notes: Retained only to parse and replay historical receipts. No active role, fallback, research, artifact, media, smoke, or capacity route may select it.
  bl:
    kind: specialist_cli
    release_requirement: optional_specialist
    command: bl
    auth_mode: shell_managed_private_configuration
    model_binding: capability_subcommand
    install_source: npm package bailian-cli
    version_probe: bl --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker bl
    live_smoke: bl doctor
    notes: Bailian multimodal, media, speech, RAG, and search specialist; not a default code or narrative worker.
  openclaw:
    kind: frontdesk_cli
    release_requirement: optional_frontdesk
    command: openclaw
    auth_mode: shell_managed_private_configuration
    model_binding: shell_configuration
    install_source: npm package openclaw
    version_probe: openclaw --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker openclaw
    live_smoke: ./agentlab.sh frontdesk-doctor --agent openclaw
    notes: Public chat frontdesk only; cannot execute AgentLab worker roles.
  gemini:
    kind: fallback_cli
    release_requirement: optional_explicit_fallback
    command: gemini
    auth_mode: env_GEMINI_API_KEY
    model_binding: command_template
    install_source: Gemini CLI upstream package
    version_probe: gemini --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker gemini
    live_smoke: disabled_by_default
    notes: Gemini 2.5 Flash High API free-tier fallback; never the default Gemini path.
  aider:
    kind: coding_cli
    release_requirement: optional
    command: aider
    auth_mode: provider_specific_private_env
    model_binding: command_template
    install_source: Python package aider-chat
    version_probe: aider --version
    safe_probe: ./agentlab.sh worker-invocation-probe --worker aider
    live_smoke: disabled_by_default
    notes: Optional Coder worker; absence must not invalidate the default Full CLI route.

deterministic_tools:
  git:
    release_requirement: required
    version_probe: git --version
  rg:
    release_requirement: required
    version_probe: rg --version
  ast_grep:
    release_requirement: required
    version_probe: ast-grep --version
  python:
    release_requirement: required
    version_probe: python3 --version
    minimum_version: "3.11"
  pytest:
    release_requirement: required
    version_probe: python3 -m pytest --version
  ruff:
    release_requirement: required
    version_probe: ruff --version
