# Private network topology for AgentLab dual-end collaboration.
# Copy this file to config/local_private_topology.yml and fill in your real values.
# config/local_private_topology.yml is gitignored — never commit real IPs/ports.

private_topology:
  relay_host: "<PRIVATE_RELAY_HOST>"       # e.g. 192.168.1.100
  relay_ssh_port: "<PRIVATE_RELAY_SSH_PORT>"  # e.g. 22
  cloud_runtime: "<PRIVATE_CLOUD_RUNTIME>"     # e.g. 192.168.1.200
  relay_workspace_path: "<RELAY_WORKSPACE>"      # e.g. /mnt/data/AgentLab_WorkSpace
  cloud_workspace_path: "<CLOUD_WORKSPACE>"     # e.g. /home/user/AgentLab
  relay_ssh_user: "<RELAY_SSH_USER>"            # e.g. agent
  cloud_ssh_user: "<CLOUD_SSH_USER>"            # e.g. deploy
