version: 1

defaults:
  provider: env:LLM_PROVIDER:deepseek
  model: env:DEFAULT_MODEL:deepseek-v4-pro
  base_url: env:DEEPSEEK_BASE_URL:https://api.deepseek.com
  api_key: env:DEEPSEEK_API_KEY
  temperature: 0.2
  top_p: 1.0

profiles:
  coordinator:
    description: Planning, routing, budget control, and synthesis.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEFAULT_MODEL:deepseek-v4-pro
    temperature: 0.2
    max_output_tokens: 1800

  scout:
    description: Repository reading and concise mapping. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.1
    max_output_tokens: 1200

  architect:
    description: Interfaces, contracts, boundaries, and architecture-sensitive review. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.15
    max_output_tokens: 1200

  coder:
    description: >
      Real code edits via structured SEARCH/REPLACE blocks. The model API generates
      AGENTLAB_EDIT blocks that the runtime applies to the filesystem. Works with any
      openai_compatible provider (Qwen, DeepSeek, OpenAI, etc.). For manual IDE-based
      execution, use external_ide_coder profile instead.
    provider: qwen
    model: env:QWEN_CODER_MODEL:qwen-plus
    temperature: 0.15
    max_output_tokens: 3200

  deepseek_coder:
    description: DeepSeek API coding profile for patch proposals and direct code edits when Codex Plus is unavailable.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_MODEL:deepseek-v4-pro
    temperature: 0.15
    max_output_tokens: 3200

  codex_prompt:
    description: DeepSeek-generated prompt handoff for Codex Plus implementation. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.2
    max_output_tokens: 1200

  auditor:
    description: Diff review, validation interpretation, and risk finding. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.1
    max_output_tokens: 1200

  archivist:
    description: Project memory compression and continuity updates. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.1
    max_output_tokens: 1000

  research:
    description: External source gathering and citation-oriented summaries. Uses flash model for cost efficiency.
    provider: env:LLM_PROVIDER:deepseek
    model: env:DEEPSEEK_FLASH_MODEL:deepseek-v4-flash
    temperature: 0.2
    max_output_tokens: 1200

  qwen_general:
    description: Optional Qwen profile for general agent reasoning when explicitly selected.
    provider: qwen
    model: env:QWEN_MODEL:qwen-plus
    temperature: 0.2
    max_output_tokens: 2200

  qwen_scout:
    description: Optional Qwen profile for repository reading and concise summaries.
    provider: qwen
    model: env:QWEN_SCOUT_MODEL:qwen-plus
    temperature: 0.1
    max_output_tokens: 2600

  qwen_architect:
    description: Optional Qwen profile for interface and architecture analysis.
    provider: qwen
    model: env:QWEN_ARCHITECT_MODEL:qwen-plus
    temperature: 0.15
    max_output_tokens: 2600

  qwen_research:
    description: Optional Qwen profile for research-style summaries when explicitly selected.
    provider: qwen
    model: env:QWEN_RESEARCH_MODEL:qwen-plus
    temperature: 0.2
    max_output_tokens: 2600

  qwen_auditor:
    description: Optional Qwen profile for validation analysis and code review.
    provider: qwen
    model: env:QWEN_AUDITOR_MODEL:qwen-plus
    temperature: 0.1
    max_output_tokens: 2600

  qwen_coder_aux:
    description: Optional Qwen coding assistant profile; only use for coding after explicit user approval.
    provider: qwen
    model: env:QWEN_CODER_MODEL:qwen-plus
    temperature: 0.15
    max_output_tokens: 3200

  external_ide_coder:
    description: External IDE AI (Codex, Claude, etc.) as Coder executor. Brain planning done by DeepSeek; external AI receives handoff prompt and executes.
    provider: external_ide_ai
    model: External AI
    temperature: 0.0
    max_output_tokens: 0
