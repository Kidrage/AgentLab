version: 2

# ─── AgentLab Model Profiles — 分层模型分配 v2.0 ──────────────────────────
#
# 架构法则:
#   T1 大脑层 — 顶级推理，绝不用 flash/plus (大脑层分配+全量)
#   T2 感知层 — 强推理用于代码理解，中推理用于搜索汇总
#   T3 执行层 — coder-next 主力 + 外部IDE窗口 + 本地LLM
#   T4 审核层 — flash 为主，复杂用 plus，全量用 max
#   T5 归档层 — flash 为主
#
# 三层预算模式:
#   🧠 brain_allocated (默认) — Supervisor 按 L1/L2/L3 自动选配
#   ⚡ max_quality           — 每个 Agent 用最强模型
#   💰 frugal                — flash + 跳过 = 最低成本
#
# Profile 命名规则:
#   {tier}_{agent}[_{budget_mode}]  — budget_mode 省略即 brain_allocated 默认值
#   例: brain_coordinator, brain_coordinator_maxq, brain_coordinator_frugal
#
#  外部 IDE 窗口 (可选增强):
#   - Coder 默认 profile = execution_coder_api (qwen3-coder-next)
#   - 外部 AI 接入方式: export AGENTLAB_EXTERNAL_CODER=1
#     或在 run_dir 写入 EXTERNAL_CODER_READY 信号文件
#   - 接入后 AgentLab 生成完整 handoff prompt 交由外部 AI 执行
#   - 外部 AI 可自由选择实现方式，但 scope 由 Supervisor 锁定
# ──────────────────────────────────────────────────────────────────────────

defaults:
  provider: deepseek
  model: deepseek-v4-pro
  temperature: 0.2
  top_p: 1.0
  budget_mode: brain_allocated

profiles:

  # ══════════════════════════════════════════════════════════════════════
  # T1 大脑层 (Brain Tier) — Supervisor
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配: L2/L3 默认 ─────────────────────────────────────────
  brain_coordinator:
    description: >
      Supervisor — L2/L3 默认。任务规划、路由决策、范围锁定、token 预算控制、合成。
      大脑层核心，需要顶级推理能力。默认 deepseek-v4-pro。
      L1 轻量项目时降级为 brain_coordinator_l1 (qwen3.6-plus)。
    provider: deepseek
    model: deepseek-v4-pro
    fallback_model: qwen3.7-max
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 4096
    tier: T1
    budget_mode: brain_allocated
    applies_to: [L2, L3]

  # ── 大脑层分配: L1 轻量 ────────────────────────────────────────────
  brain_coordinator_l1:
    description: >
      Supervisor L1 轻量 — 脚本修改、Bug修复、单文件调整。
      用 qwen3.6-plus 节省成本，性价比极高 ($0.325/M输入)。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.2
    top_p: 0.95
    max_output_tokens: 2600
    tier: T1
    budget_mode: brain_allocated
    applies_to: [L1]

  # ── 全量运算 ──────────────────────────────────────────────────────
  brain_coordinator_maxq:
    description: >
      Supervisor 全量 — Thinking Mode 启用，最强推理。
      适用: 安全关键/架构重构/长期核心项目。
    provider: deepseek
    model: deepseek-v4-pro
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 8192
    tier: T1
    budget_mode: max_quality
    thinking_mode: true

  # ── 最低成本 ──────────────────────────────────────────────────────
  brain_coordinator_frugal:
    description: >
      Supervisor 最低成本 — qwen3.6-flash。仅基本决策能力。
      适用: 原型验证/一次性脚本/低风险修改。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.3
    top_p: 0.95
    max_output_tokens: 2000
    tier: T1
    budget_mode: frugal

  # ── Qwen 备选 (DeepSeek 不可用时) ─────────────────────────────────
  brain_coordinator_qwen:
    description: >
      Supervisor 备选 — 当 deepseek-v4-pro 不可用或用户显式切换时使用 qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 4096
    tier: T1

  # ══════════════════════════════════════════════════════════════════════
  # T2 感知层 (Perception Tier) — RepoScout
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配: L2 默认 ────────────────────────────────────────────
  perception_reposcout:
    description: >
      RepoScout L2 — 仓库结构阅读、代码上下文提取、依赖关系映射。
      qwen3.6-plus 性价比最优 ($0.325/M输入)。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated
    applies_to: [L2]

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  perception_reposcout_l3:
    description: >
      RepoScout L3 — 大型代码库深度扫描，需要更强推理。
      qwen3.7-max，1M上下文。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  perception_reposcout_maxq:
    description: >
      RepoScout 全量 — qwen3.7-max 最强感知。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 4096
    tier: T2
    budget_mode: max_quality

  # ── 最低成本 ──────────────────────────────────────────────────────
  perception_reposcout_frugal:
    description: >
      RepoScout 最低成本 — qwen3.6-flash，可切换本地部署。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 2000
    tier: T2
    budget_mode: frugal

  # ══════════════════════════════════════════════════════════════════════
  # T2 感知层 (Perception Tier) — InterfaceMapper
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配: L2 默认 ────────────────────────────────────────────
  perception_interface:
    description: >
      InterfaceMapper L2 — 接口契约分析、跨层边界追踪。
      qwen3.6-plus 性价比最优。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated
    applies_to: [L2]

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  perception_interface_l3:
    description: >
      InterfaceMapper L3 — 复杂架构契约分析。
      qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  perception_interface_maxq:
    description: >
      InterfaceMapper 全量 — qwen3.7-max 最强契约分析。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 4096
    tier: T2
    budget_mode: max_quality

  # ── 最低成本 ──────────────────────────────────────────────────────
  perception_interface_frugal:
    description: >
      InterfaceMapper 最低成本 — Frugal 模式下通常跳过，仅在被强制需要时使用 flash。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 1500
    tier: T2
    budget_mode: frugal

  # ══════════════════════════════════════════════════════════════════════
  # T2 感知层 (Perception Tier) — Researcher
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配: 默认 ───────────────────────────────────────────────
  perception_research:
    description: >
      Researcher — 外部资料搜索、引用汇总、信息合成。
      搜索汇总不需要顶级推理。L2 用 flash, L3 用 plus。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.2
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  perception_research_l3:
    description: >
      Researcher L3 — 需要更高质量的信息合成。
      qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.2
    top_p: 0.95
    max_output_tokens: 2600
    tier: T2
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  perception_research_maxq:
    description: >
      Researcher 全量 — qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.15
    top_p: 0.9
    max_output_tokens: 4096
    tier: T2
    budget_mode: max_quality

  # ══════════════════════════════════════════════════════════════════════
  # T3 执行层 (Execution Tier) — Coder
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配 (默认) + 最低成本: API Coder 主力 ──────────────────
  execution_coder_api:
    description: >
      Coder API 主力 — qwen3-coder-next。代码生成专用，价格最低 ($0.11/$0.80)。
      所有预算模式下默认 API Coder 选项。
      自动生成 AGENTLAB_EDIT 块，由 patch_applicator 应用到文件系统。
    provider: qwen-coder
    model: qwen3-coder-next
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 4096
    tier: T3
    budget_mode: [brain_allocated, frugal]

  # ── 全量运算: DeepSeek 编码 ───────────────────────────────────────
  execution_coder_maxq:
    description: >
      Coder 全量 — deepseek-v4-pro。最强推理驱动编码。
      ⚠️ 成本极高 ($1.74/$3.48)，仅安全关键/架构重构使用。
    provider: deepseek-coder
    model: deepseek-v4-pro
    fallback_model: qwen3-coder-next
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 8192
    tier: T3
    budget_mode: max_quality

  # ── 外部 IDE AI 窗口 ──────────────────────────────────────────────
  execution_external_ide:
    description: >
      Coder 外部 IDE — 外部 AI (Codex/Claude/Cline) 作为编码执行者。
      AgentLab 大脑层完成所有规划后生成完整 handoff prompt。
      外部 AI 只需执行编码，无需自行规划范围或分析架构。
      外部 AI 的可编辑窗口：实现方式、代码风格、算法选择自由，
      但必须遵守 Supervisor 批准的 scope 和 interface 契约。
    provider: external_ide_ai
    model: External AI
    temperature: 0.0
    max_output_tokens: 0
    tier: T3
    external_window: true
    external_window_guidance: >
      You are an external IDE AI receiving a pre-planned task.
      AgentLab's brain has done ALL planning — you only execute.
      You CAN: choose implementation approach, code style, libraries, algorithms.
      You MUST: stay within the Supervisor-approved scope and interface contracts.
      Before coding, read: supervisor_plan.md, reposcout_report.md, interface_map.md.
      After coding, write: implementation_report.md.

  # ── 本地 LLM Coder (Frugal 模式优先) ──────────────────────────────
  execution_coder_local:
    description: >
      Coder 本地 — 使用本地 LLM (Ollama/vLLM/LM Studio)。
      零 API 成本，Frugal 模式优先。
      默认模型 qwen3.6-35b-a3b，可通过 .env 配置。
    provider: qwen-local
    model: env:AGENTLAB_LOCAL_CODER_MODEL:qwen3.6-35b-a3b
    fallback_model: qwen3-coder-next
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 4096
    tier: T3
    budget_mode: frugal
    local_only: true

  # ── Prompt Engineer — 稳定生成 Coder 执行 prompt ──────────────────
  execution_prompt_engineer:
    description: >
      PromptEngineer L2 — 读取 Supervisor plan + RepoScout report + Interface map,
      拼接成结构化、可复现的 Coder 实现引导 prompt。
      qwen3.6-plus 保证输出稳定可靠。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T3
    budget_mode: brain_allocated
    applies_to: [L2]

  execution_prompt_engineer_l3:
    description: PromptEngineer L3 — qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T3
    budget_mode: brain_allocated
    applies_to: [L3]

  execution_prompt_engineer_maxq:
    description: PromptEngineer 全量 — qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 4096
    tier: T3
    budget_mode: max_quality

  execution_prompt_engineer_frugal:
    description: PromptEngineer 最低成本 — qwen3.6-flash。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 2000
    tier: T3
    budget_mode: frugal

  # ══════════════════════════════════════════════════════════════════════
  # T4 审核层 (Audit Tier) — TesterAuditor / Verifier
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配 (默认) ──────────────────────────────────────────────
  audit_tester:
    description: >
      TesterAuditor L2 — Diff 审查、验证解读、风险发现、行为校验。
      qwen3.6-flash，性价比最优。L3 时升级为 audit_tester_l3。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T4
    budget_mode: brain_allocated
    applies_to: [L1, L2]

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  audit_tester_l3:
    description: >
      TesterAuditor L3 — 复杂项目需要更高质量审查。
      qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T4
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  audit_tester_maxq:
    description: >
      TesterAuditor 全量 — qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 4096
    tier: T4
    budget_mode: max_quality

  # ── 最低成本 ──────────────────────────────────────────────────────
  audit_tester_frugal:
    description: >
      TesterAuditor 最低成本 — qwen3.6-flash。仅基本验证。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 1500
    tier: T4
    budget_mode: frugal

  # ── 大脑层分配 (默认) ──────────────────────────────────────────────
  audit_verifier:
    description: >
      Verifier L2 — 输出匹配检查、行为完整性验证、agent 交接缺口检测。
      qwen3.6-flash。L3 时升级为 audit_verifier_l3。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T4
    budget_mode: brain_allocated
    applies_to: [L2]

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  audit_verifier_l3:
    description: >
      Verifier L3 — 复杂项目完整性验证。
      qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T4
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  audit_verifier_maxq:
    description: >
      Verifier 全量 — qwen3.7-max。
    provider: qwen3
    model: qwen3.7-max
    fallback_model: deepseek-v4-pro
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 4096
    tier: T4
    budget_mode: max_quality

  # ══════════════════════════════════════════════════════════════════════
  # T5 归档层 (Archive Tier) — Archivist
  # ══════════════════════════════════════════════════════════════════════

  # ── 大脑层分配 (默认) ──────────────────────────────────────────────
  archive_archivist:
    description: >
      Archivist L2 — 项目记忆压缩、连续性更新、长期记录维护。
      qwen3.6-flash。L3 升级为 archive_archivist_l3。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2000
    tier: T5
    budget_mode: brain_allocated
    applies_to: [L2]

  # ── 大脑层分配: L3 重型 ────────────────────────────────────────────
  archive_archivist_l3:
    description: >
      Archivist L3 — 长期项目需要更高质量记忆维护。
      qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2000
    tier: T5
    budget_mode: brain_allocated
    applies_to: [L3]

  # ── 全量运算 ──────────────────────────────────────────────────────
  archive_archivist_maxq:
    description: >
      Archivist 全量 — qwen3.6-plus。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.9
    max_output_tokens: 2600
    tier: T5
    budget_mode: max_quality
  # ── 升级版 (per-task + bulk doc mode) ──────────────────────────────
  archive_archivist_plus:
    description: >
      Archivist L2 升级版 — qwen3.6-plus。承担 per-task 归档 + 跨任务文档整合。
    provider: qwen
    model: qwen3.6-plus
    fallback_model: qwen3.7-max
    temperature: 0.1
    top_p: 0.95
    max_output_tokens: 2600
    tier: T5
    budget_mode: brain_allocated
    applies_to: [L2]

  # ── 最低成本 ──────────────────────────────────────────────────────
  archive_archivist_frugal:
    description: >
      Archivist 最低成本 — qwen3.6-flash。
    provider: qwen-flash
    model: qwen3.6-flash
    fallback_model: qwen3.6-plus
    temperature: 0.15
    top_p: 0.95
    max_output_tokens: 2000
    tier: T5
    budget_mode: frugal

