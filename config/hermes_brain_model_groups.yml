schema_version: 1
policy_id: hermes_brain_model_groups
summary: >
  Hermes is the brain/supervisor layer. It owns model routing, durable plan
  handoffs, feedback interpretation, and budget-aware escalation before
  execution-layer agents receive task packets. Executable fallback selection
  belongs only to config/model_capacity.yml.

default_recommendation:
  model_mix: codex_gpt55_high_supervisor_with_specialists
  rationale:
    - Hermes JSON-RPC with Codex GPT-5.5 high is the registered primary Supervisor route.
    - Claude shell with DeepSeek V4 Pro owns bounded text production, review, and narrative planning.
    - Agy/Gemini OAuth is the preferred multimodal observer and visual-review route while its independent quota window is available.
    - Qwen models are selected by capability score as metered multimodal fallbacks, not treated as one interchangeable visual module.
    - Grok/xAI remains quarantined until its execution and usage telemetry pass a new canary.

providers:
  deepseek:
    role: low_cost_reasoning
    strengths:
      - search_planning
      - deep_text_reasoning
      - small_code_patch
      - critique_and_review
    default_models:
      - deepseek_v4_pro
      - deepseek_v4_flash
    multimodal: false
  qwen:
    role: metered_multimodal_fallback_family
    strengths:
      - image_and_pdf_understanding
      - text_reasoning
      - chinese_repo_understanding
      - structured_artifact_generation
    default_models:
      - qwen3_7_max_dashscope
      - qwen3_6_plus_dashscope
    multimodal: true
    selection_rule: choose_the_lowest_cost_model_that_meets_the_task_quality_floor
  codex:
    role: primary_supervisor_brain
    strengths:
      - large_codebase_changes
      - hard_debugging
      - architecture_refactor
      - tool_heavy_execution
    default_models:
      - codex_gpt_5_5_high_hermes_oauth
    quota_policy:
      source: config/model_capacity.yml
      refresh_window_hours: null
      remaining: null
      reset_at: null
      rule: never_guess_subscription_capacity
  grok_xai:
    role: quarantined_optional_provider
    strengths:
      - social_search
      - web_search
      - registered_image_tool_orchestration
      - registered_video_tool_orchestration
    default_models:
      - grok_4_3_hermes_oauth
    multimodal: tool_orchestration_only
    direct_media_generation: false
    audio_generation: false
    status: quarantined
    automatic_use: false

brain_layouts:
  recommended:
    name: codex_gpt55_high_supervisor_with_specialists
    brain_chain:
      supervisor: codex_gpt_5_5_high_hermes_oauth
      writer: deepseek_v4_pro
      multimodal_observer: gemini_3_5_flash_high_agy_oauth
      observer_fallback: claude_sonnet_4_6_agy_oauth
      researcher: gemini_3_5_flash_high_agy_oauth
      artifact_producer: deepseek_v4_pro
      independent_reviewer: deepseek_v4_pro
      independent_verifier: deepseek_v4_pro
      visual_review_fallback: qwen3_7_max_dashscope
    execution_rule: >
      Hermes with Codex GPT-5.5 high keeps Supervisor plan ownership and routes
      only verified task packets to the separate Writer, Observer, Researcher,
      ArtifactProducer, and independent Verifier roles. Producers cannot
      self-approve. Runtime selection, quota reserve, and provider switching
      must follow config/runtime_registry.yml and config/routing_policy.yml.
  single_multimodal_brain:
    name: agy_multimodal_observer_with_qwen_text_support
    examples:
      - gemini_3_5_flash_high_agy_oauth
      - claude_sonnet_4_6_agy_oauth
      - qwen3_6_plus_dashscope
    collaboration_mode: >
      Agy models stay inside Observer or VisualReviewer role sessions and emit
      evidence reports. Qwen Plus may support explicitly assigned text roles;
      this layout does not imply an automatic worker or provider fallback.
  pure_api_lowest_tier:
    name: deepseek_primary_with_qwen_multimodal_fallback
    examples:
      - deepseek_v4_pro
      - deepseek_v4_flash
      - qwen3_7_max_dashscope
    multimodal_policy: >
      DeepSeek remains the text reasoning route. Qwen may process assigned image
      or PDF evidence only when its selected model meets the quality floor and a
      subscription/OAuth route is unavailable or below reserve.
  premium_codex_brain:
    name: codex_gpt55_high_supervisor
    brain_chain:
      planner: codex_gpt_5_5_high_hermes_oauth
      reviewer: deepseek_v4_pro
      writer: deepseek_v4_pro
      multimodal_observer: gemini_3_5_flash_high_agy_oauth
      researcher: gemini_3_5_flash_high_agy_oauth
      visual_review_fallback: qwen3_7_max_dashscope
    execution_rule: >
      Codex GPT-5.5 high acts as the Hermes Supervisor brain. It must emit the standard
      Hermes handoff contract (plan_status, missing_facts, must_read_artifacts,
      dispatch_units, self_check, revision_log). Coder execution must be
      dispatched through role-session. Writer, Observer, Researcher, and
      ArtifactProducer remain separate producers and cannot self-approve.
    quota_policy:
      source: config/model_capacity.yml
      refresh_window_hours: null
      remaining: null
      reset_at: null

handoff_requirements:
  - plan_status
  - missing_facts
  - must_read_artifacts
  - dispatch_units
  - self_check
  - revision_log

feedback_interpretation:
  hermes_must_extract:
    - blocked_reason
    - artifact_paths
    - test_or_review_evidence
    - cost_or_quota_signal
    - suggested_plan_revision
  update_plan_before_retry: true
