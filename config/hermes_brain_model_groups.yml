schema_version: 1
policy_id: hermes_brain_model_groups
summary: >
  AgentLab's default brain/supervisor layer runs through Claude Code with
  DeepSeek V4 Pro.
  It owns durable plan handoffs, feedback interpretation, and budget-aware
  escalation before execution-layer agents receive task packets. Hermes remains
  a non-default workflow/frontdesk shell. Executable fallback selection belongs
  only to config/model_capacity.yml.

default_recommendation:
  model_mix: deepseek_supervisor_with_current_specialists
  rationale:
    - Claude Code with DeepSeek V4 Pro is the default registered Supervisor route.
    - Claude shell with DeepSeek owns bounded Chinese Writer work.
    - Every full_cli tier uses Agy Gemini subscription capacity for NarrativePlanner.
    - Agy Gemini 3.6 observes multimodal evidence and handles governed Writer/Scribe roles; it does not claim image generation.
    - Grok 4.5 owns sourced social/web research.
    - Codex GPT-5.6 Sol medium owns text artifact production.

providers:
  deepseek:
    role: low_cost_reasoning
    strengths:
      - search_planning
      - deep_text_reasoning
      - small_code_patch
      - critique_and_review
    default_models:
      - deepseek_v4_pro
      - deepseek_v4_flash
    multimodal: false
  qwen:
    role: current_qwen_text_reasoning
    strengths:
      - text_reasoning
      - chinese_repo_understanding
      - broad_model_selection
    default_models:
      - qwen3_7_max_dashscope
      - qwen3_6_plus_dashscope
    multimodal: false
  codex:
    role: primary_supervisor_brain
    strengths:
      - large_codebase_changes
      - hard_debugging
      - architecture_refactor
      - tool_heavy_execution
    default_models:
      - codex_gpt_5_6_sol_xhigh_cli_oauth
    quota_policy:
      source: config/model_capacity.yml
      refresh_window_hours: null
      remaining: null
      reset_at: null
      rule: never_guess_subscription_capacity
  grok_xai:
    role: social_web_research_and_registered_media_tool_orchestration
    strengths:
      - social_search
      - web_search
      - registered_image_tool_orchestration
      - registered_video_tool_orchestration
    default_models:
      - grok_4_5_hermes_oauth
    multimodal: tool_orchestration_only
    direct_media_generation: false
    audio_generation: false

brain_layouts:
  recommended:
    name: deepseek_supervisor_with_current_specialists
    brain_chain:
      supervisor: deepseek_v4_pro
      writer: gemini_3_6_flash_high_agy_oauth
      multimodal_observer: gemini_3_6_flash_high_agy_oauth
      observer_fallback: claude_sonnet_4_6_agy_oauth
      social_web_research: grok_4_5_hermes_oauth
      artifact_producer: codex_gpt_5_6_sol_medium_cli_oauth
      performance_narrative_planner: gemini_3_6_flash_high_agy_oauth
      full_narrative_planner: gemini_3_6_flash_high_agy_oauth
      independent_verifier: deepseek_v4_flash
    execution_rule: >
      Claude Code with DeepSeek V4 Pro keeps Supervisor plan ownership and routes
      only verified task packets to the separate Writer, Observer, Researcher,
      ArtifactProducer, and independent Verifier roles. Producers cannot
      self-approve, and capacity changes must follow config/model_capacity.yml.
  single_multimodal_brain:
    name: agy_multimodal_observer_with_qwen_text_support
    examples:
      - gemini_3_6_flash_high_agy_oauth
      - claude_sonnet_4_6_agy_oauth
      - qwen3_6_plus_dashscope
    collaboration_mode: >
      Agy models stay inside Observer, VisualReviewer, or performance
      NarrativePlanner role sessions and emit evidence or planning reports.
      Qwen Plus may support explicitly assigned text roles;
      this layout does not imply an automatic worker or provider fallback.
  pure_api_lowest_tier:
    name: deepseek_qwen_text_only
    examples:
      - deepseek_v4_pro
      - deepseek_v4_flash
      - qwen3_7_max_dashscope
    multimodal_gap_policy: >
      These brain models do not process media directly. When multimodal evidence
      is required, Hermes must request execution-layer multimodal tools or
      workers to produce observations, captions, transcripts, embeddings, or QA
      reports, then reason over those returned artifacts.
  premium_codex_brain:
    name: codex_gpt56_sol_supervisor
    brain_chain:
      planner: codex_gpt_5_6_sol_xhigh_cli_oauth
      reviewer: qwen3_6_flash_dashscope
      writer: deepseek_v4_pro
      multimodal_observer: gemini_3_6_flash_high_agy_oauth
      social_web_research: grok_4_5_hermes_oauth
    execution_rule: >
      Codex GPT-5.6 Sol xhigh acts through the native Codex Supervisor shell. It
      must emit the standard AgentLab handoff contract (plan_status,
      missing_facts, must_read_artifacts,
      dispatch_units, self_check, revision_log). Coder execution must be
      dispatched through role-session. Writer, Observer, Researcher, and
      ArtifactProducer remain separate producers and cannot self-approve.
    quota_policy:
      source: config/model_capacity.yml
      refresh_window_hours: null
      remaining: null
      reset_at: null

handoff_requirements:
  - plan_status
  - missing_facts
  - must_read_artifacts
  - dispatch_units
  - self_check
  - revision_log

feedback_interpretation:
  supervisor_must_extract:
    - blocked_reason
    - artifact_paths
    - test_or_review_evidence
    - cost_or_quota_signal
    - suggested_plan_revision
  update_plan_before_retry: true
