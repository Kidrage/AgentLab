schema_version: 3
enabled: true

retrieval:
  max_skills_per_task: 3
  min_confidence: 0.0
  high_risk_requires_approval: true
  default_injected_agents:
    - Coder
    - TesterAuditor
  route_injected_agents:
    narrative_light_chapter:
      - Writer
    narrative_batch_chapters:
      - Writer
    narrative_heavy_audit:
      - Reviewer
      - Scribe
    fiction_chapter_pipeline:
      - Writer
      - Reviewer
      - Scribe

matching:
  trigger_weight: 3
  applies_to_weight: 2
  summary_weight: 1

usage:
  write_run_usage: true
  scope: run_local
  retention_authority: config/run_retention_policy.yml
