    max_output: 384000
    capacity_pool: hermes_deepseek_private
    strengths: [cheap, fast, long_context, routing, summarization, tool_calls]
    weaknesses: [private_hermes_configuration, metered_api]
    suitable_agents: [prompt_generator, auditor, verifier, archivist, senior_editor]
    pricing_key: deepseek-v4-flash
    notes: >
      DeepSeek V4 Flash through Hermes' private provider configuration. AgentLab
      never copies its credential and binds the exact runtime provider/model in
