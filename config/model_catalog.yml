# ── Provider 配置 ──────────────────────────────────────────────────────

providers:
  grok_cli_oauth:
    availability: historical_only
    selectable: false
    display: Native Grok CLI OAuth
    currency: subscription_or_oauth_quota
    auth: local_grok_oauth_session
    command: grok
    runtime_provider: grok-cli-oauth
    default_model: grok-4.5
    capacity_source: config/model_capacity.yml
    notes: >
      Historical Native Grok CLI provider retained only for receipt replay.
      Runtime selection is centrally blocked.

  codex_cli_oauth:
    display: Codex CLI OAuth
    currency: subscription_or_oauth_quota
    auth: local_codex_oauth_session
    command: codex
    runtime_provider: codex-cli
    default_model: gpt-5.6-sol
    reasoning_effort: xhigh
    notes: >
      Native Codex CLI provider for AgentLab role workers. Do not assign this
      provider to Hermes or represent Hermes' internal openai-codex provider as
      the Codex worker.

  deepseek_official:
    display: DeepSeek 官方 API
    currency: USD
    base_url: https://api.deepseek.com
    auth: env:DEEPSEEK_API_KEY
    notes: 当前 V4 Flash/Pro 成本非常有竞争力。

  hermes_deepseek_private:
    display: Hermes private DeepSeek provider
    currency: USD
    auth: hermes_private_configuration
    command: hermes
    runtime_provider: deepseek
    default_model: deepseek-v4-flash
    notes: Credentials remain exclusively in Hermes private configuration.

  dashscope_cn:
    display: DashScope 中国内地（北京）
    currency: CNY
    region: cn-beijing
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    auth: env:DASHSCOPE_API_KEY
    notes: 当前唯一可用 Qwen 模型入口。替代了原 OpenRouter 链路。

  dashscope_intl:
    display: DashScope 国际（新加坡，备用）
    currency: CNY
    region: singapore
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    auth: env:DASHSCOPE_API_KEY
    notes: 备用。无免费额度，适合非中国内地部署。

  qwen_token_plan:
    display: Qwen Token Plan
    currency: token_plan
    base_url: env:QWEN_TOKEN_PLAN_BASE_URL
    auth: env:QWEN_TOKEN_PLAN_API_KEY
    notes: >
      用户购买的 Qwen Token Plan 专用入口。当前仓库没有现成 key，
      需要用户提供 API key 和 OpenAI-compatible base URL 后启用。

  hermes_codex_oauth:
    display: Hermes Codex OAuth
    currency: subscription_or_oauth_quota
    auth: local_hermes_oauth_session
    command: hermes
    base_url: https://chatgpt.com/backend-api/codex
    runtime_provider: openai-codex
    default_model: gpt-5.6-sol
    reasoning_effort: xhigh
    notes: >
      Hermes 内部的 Codex OAuth provider。仅保留给非默认/兼容 Supervisor 路径通过
      hermes --provider openai-codex -m gpt-5.6-sol 调用，并要求 xhigh reasoning effort；
      不等同于 Codex CLI worker。

  hermes_xai_oauth:
    availability: historical_only
    selectable: false
    display: Hermes xAI OAuth
    currency: subscription_or_oauth_quota
    auth: local_hermes_oauth_session
    command: hermes
    runtime_provider: xai-oauth
    default_model: grok-4.6
    capacity_source: config/model_capacity.yml
    notes: >
      Used separately by Grok Researcher and Grok media-tool contracts. Runtime
      auth/cooldown evidence is dynamic; this catalog entry never claims a
      remaining percentage or reset time.

  ark_agent_plan:
    display: Volcengine Ark Agent Plan via Hermes + Ark Skills
    availability: unavailable_current_host
    selectable: false
    currency: subscription_or_oauth_quota
    auth: local_arkcli_sso_agent_plan_profile
    command: hermes
    worker: hermes_ark
    invocation_contract: hermes_ark_artifact_producer
    runtime_provider: ark-agent-plan
    default_model: doubao-seedance-1-5-pro-251215
    notes: >
      Task-scoped Seedance media provider backed by the active local Agent Plan
      subscription. Hermes is the primary bounded shell; Claude + the repository
      Seedance Skill is fallback-only. Credentials remain outside AgentLab.

  agy_gemini_oauth:
    display: Agy / Antigravity Gemini OAuth
    currency: subscription_or_oauth_quota
    auth: local_oauth_session
    command: agy
    region_requirement: vpn_or_proxy_to_supported_region
    default_model: gemini-3.6-flash-high
    cli_model_id: gemini-3.6-flash-high
    notes: >
      AgentLab 默认 Gemini 路径。Agy 通过本地 OAuth 会话调用 Gemini 模型，
      不读取 GEMINI_API_KEY，不按本地 Gemini API key 计费。

  agy_claude_oauth:
    availability: unavailable_current_host
    selectable: false
    display: Agy / Antigravity Claude OAuth
    currency: subscription_or_oauth_quota
    auth: local_oauth_session
    command: agy
    region_requirement: vpn_or_proxy_to_supported_region
    default_model: Claude Sonnet 4.6 (Thinking)
    never_primary: true
    notes: >
      Agy Observer 的独立备用容量池；provider surface 仍为
      cli_agent:agy，不允许 API key fallback，未知剩余额度保持 null。

  gemini_api_free_tier:
    display: Gemini API Free Tier
    currency: free_tier_limited
    auth: env:GEMINI_API_KEY
    default_model: gemini-2.5-flash-high
    never_default: true
    notes: >
      显式备用通道。免费 API 额度有限，只有用户明确开启时才使用。
