schema_version: 3
last_verified: "2026-07-13"
valid_until_days: 14

# ─── AgentLab Model Catalog v3.1 ─────────────────────────────────────
# 事实源：模型能力与 provider 身份集中管理；所有数值定价只由
# config/model_pricing.yml 管理，本文件仅保存 pricing_key 或计费模式。
# 每 14 天由 runtime 或人工刷新。不在白皮书或注释中硬编码价格。
# 当前登记 Provider 包括 deepseek_official、dashscope_cn、hermes_codex_oauth、
# agy_gemini_oauth、agy_claude_oauth、gemini_api_free_tier 等；实际默认选择由
# config/agent_model_profiles.yml 决定。
# (OpenRouter 已移除，替换为 DashScope 平替)
# ──────────────────────────────────────────────────────────────────────

models:
  deepseek_v4_flash:
    provider: deepseek_official
    model_id: deepseek-v4-flash
    context_window: 1000000
    max_output: 384000
    strengths: [cheap, fast, long_context, routing, summarization, tool_calls]
    weaknesses: [less_deep_than_pro]
    suitable_agents: [writer, frugal_supervisor, frugal_auditor, light_verifier, prompt_generator]
    pricing_key: deepseek-v4-flash
    notes: >
      Thinking/non-thinking 均支持。低风险任务高性价比首选。
      AgentLab Frugal 模式 Supervisor / TesterAuditor / 轻量 Verifier 推荐。

  deepseek_v4_pro:
    provider: deepseek_official
    model_id: deepseek-v4-pro
    context_window: 1000000
    max_output: 384000
    strengths: [planning, reasoning, risk_analysis, long_context, coding_agent]
    weaknesses: [slower_than_flash]
    suitable_agents: [writer, supervisor, auditor, verifier, maxq_coder]
    pricing_key: deepseek-v4-pro
    notes: >
      AgentLab L2/L3 Balanced 大脑层默认。MaxQ 模式规划+审查主力。
      BenchLM: Agentic 74, Coding 75.9 — 在 coding/agentic 维度优于 Qwen3.7-Max。

  codex_gpt_5_6_sol_xhigh_hermes_oauth:
    provider: hermes_codex_oauth
    runtime_provider: openai-codex
    cli_provider: openai-codex
    model_id: gpt-5.6-sol
    reasoning_effort: xhigh
    reasoning_effort_label: extra
    context_window: 272000
    capacity_pool: openai_codex_agentic
    strengths: [oauth_cli, high_reasoning, supervision, planning, code_review, agentic_control]
    weaknesses: [requires_hermes_oauth_session, subscription_or_oauth_quota, not_direct_api]
    suitable_agents: [supervisor, max_quality_supervisor, brain_layer]
    pricing:
      currency: subscription_or_oauth_quota
      billing_source: codex_oauth
    notes: >
      GPT-5.6 Sol through the local Hermes OAuth provider. This is a
      Hermes runtime provider registration, not the Codex CLI worker. AgentLab
      invokes it through Hermes with --provider openai-codex -m gpt-5.6-sol.
      The installed Hermes v0.17.0 exposes xhigh as its strongest supported
      reasoning value; AgentLab maps the user's "extra" label to xhigh and must
      not claim ultra until a future Hermes capability probe proves it.
    evidence:
      official_model: https://developers.openai.com/api/docs/models/gpt-5.6-sol
      local_model_cache_verified: "2026-07-13"
      local_hermes_reasoning_verified: xhigh

  gemini_3_5_flash_high_agy_oauth:
    provider: agy_gemini_oauth
    runtime_provider: agy-gemini-oauth
    model_id: gemini-3.5-flash-high
    cli_model_id: Gemini 3.5 Flash (High)
    context_window: 1000000
    capacity_pool: agy_gemini_observer
    strengths: [oauth_cli, fast, high_throughput, long_context, multimodal_understanding, scientific_analysis, subscription_quota]
    weaknesses: [requires_regional_network_access, cli_session_required, text_output_only, no_image_generation]
    suitable_agents: [observer, visual_reviewer, frontdesk_gateway]
    capabilities:
      input_modalities: [text, image, video, audio, pdf]
      output_modalities: [text]
      image_generation: false
      evidence_observation: true
    pricing:
      currency: subscription_or_oauth_quota
      billing_source: agy_oauth
    notes: >
      Agy/Antigravity Observer 默认模型。Agy 接的是 Gemini 模型，走本地 OAuth
      会话和地区网络条件，不使用 GEMINI_API_KEY，也不按本地 Gemini API
      key 计费。它理解多模态材料但只输出文本，不能被登记为真实图片生成器。
    evidence:
      official_model: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash
      local_cli_models_verified: "2026-07-13"

  claude_sonnet_4_6_agy_oauth:
    provider: agy_claude_oauth
    runtime_provider: agy-claude-oauth
    model_id: claude-sonnet-4-6
    cli_model_id: Claude Sonnet 4.6 (Thinking)
    context_window: 1000000
    capacity_pool: agy_claude_observer
    strengths: [oauth_cli, multimodal_understanding, reasoning, independent_subscription_quota]
    weaknesses: [requires_regional_network_access, cli_session_required, not_primary]
    suitable_agents: [observer, visual_reviewer]
    capabilities:
      input_modalities: [text, image, pdf]
      output_modalities: [text]
      evidence_observation: true
    pricing:
      currency: subscription_or_oauth_quota
      billing_source: agy_oauth
    usage_policy:
      never_primary: true
      perception_fallback_only: true
      rotates_from: gemini_3_5_flash_high_agy_oauth
      allowed_failure_classes: [quota_exhausted, rate_limited, model_unavailable]
      capacity_source: config/model_capacity.yml
      same_cli_worker: agy
      provider_surface_change_allowed: false
      api_key_fallback_allowed: false
    notes: >
      Agy 多模态感知角色的第二个独立容量池。只有默认 Gemini Observer
      或 visual Reviewer 返回 quota_exhausted、rate_limited 或
      model_unavailable 且容量策略预批准时，才允许
      在同一个 Agy shell 中切换。`agy models` 1.1.1 已验证 CLI 标签；Agy 没有额度查询命令，
      因此 remaining/reset 未知时必须保持 null，不能猜测五小时重置点。

  grok_4_3_hermes_oauth:
    provider: hermes_xai_oauth
    runtime_provider: xai-oauth
    cli_provider: xai-oauth
    model_id: grok-4.3
    capacity_pool: xai_subscription_shared
    strengths: [social_research, web_research, x_search, media_tool_orchestration, current_events]
    weaknesses: [requires_hermes_xai_oauth, subscription_quota_unknown, not_aesthetic_judge, text_output]
    suitable_agents: [researcher, artifact_producer]
    capabilities:
      input_modalities: [text, image]
      output_modalities: [text]
      web_search: true
      social_search: true
      direct_image_generation: false
      may_call_registered_image_tool: true
    pricing:
      currency: subscription_or_oauth_quota
      billing_source: xai_oauth
    notes: >
      Grok 4.3 is the Hermes+xAI research brain and media-tool orchestrator.
      Text output is not a generated image. ArtifactProducer completion requires
      a real Grok Imagine tool artifact path and a separate aesthetic review.
    evidence:
      official_hermes_integration: https://x.ai/news/grok-hermes
      local_hermes_models_verified: "2026-07-13"

  gemini_2_5_flash_high_api:
    provider: gemini_api_free_tier
    runtime_provider: gemini-api
    model_id: gemini-2.5-flash-high
    context_window: 1000000
    strengths: [free_tier, fast, rough_work, summarization]
    weaknesses: [quota_limited, not_default, api_key_required]
    suitable_agents: [rough_work_agent, disposable_analysis]
    pricing:
      currency: free_tier_limited
      billing_source: gemini_api_key
    usage_policy:
      never_default: true
      enable_only_when_explicitly_requested: true
    notes: >
      本地 Gemini API key 路径，仅作为显式启用的免费额度/有限次数备用通道。
      不作为 AgentLab 默认 Gemini 路径；默认 Gemini 路径是 agy OAuth。

  qwen3_7_max_dashscope:
    provider: dashscope_cn
    model_id: qwen3.7-max
    context_window: 1000000
    strengths: [repo_understanding, coding_agents, chinese, long_context]
    weaknesses: [expensive, verbose_output]
    suitable_agents: [reposcout_large, interface_mapper_large, perception_maxq]
    pricing_key: qwen3.7-max
    notes: >
      DashScope 版 qwen3.7-max。适合 L3 感知层、中文仓库理解、复杂接口分析。
      平替原 OpenRouter qwen3_7_max_openrouter。

  qwen3_6_plus_dashscope:
    provider: dashscope_cn
    model_id: qwen3.6-plus
    context_window: 1000000
    strengths: [balanced, repo_understanding, chinese, interface_analysis]
    weaknesses: [not_top_tier_reasoning]
    suitable_agents: [reposcout, interface_mapper, researcher, auditor_balanced]
    pricing_key: qwen3.6-plus
    notes: >
      DashScope 版 qwen3.6-plus。Balanced 感知层主力。
      平替原 OpenRouter qwen3_6_plus_openrouter。

  qwen3_6_flash_dashscope:
    provider: dashscope_cn
    model_id: qwen3.6-flash
    context_window: 1000000
    strengths: [fast, cheap, batch, summary, light_audit]
    weaknesses: [weak_reasoning, no_deep_planning]
    suitable_agents: [frugal_reposcout, frugal_interface, researcher_light, archivist_light]
    pricing_key: qwen3.6-flash
    notes: >
      DashScope 版 qwen3.6-flash。Frugal 模式轻量感知/审核。
      平替原 OpenRouter qwen3_6_flash_openrouter。

  qwen3_coder_next_dashscope:
    provider: dashscope_cn
    model_id: qwen3-coder-next
    context_window: 262000
    strengths: [coding_agent, cheap_coder, code_generation]
    weaknesses: [shorter_context, no_planning, no_multimodal]
    suitable_agents: [coder, frugal_coder]
    pricing_key: qwen3-coder-next
    notes: >
      DashScope 版 qwen3-coder-next，默认 API Coder。
      平替原 OpenRouter qwen3_coder_next_openrouter。

  qwen3_coder_plus_dashscope:
    provider: dashscope_cn
    model_id: qwen3-coder-plus
    context_window: 1000000
    strengths: [coding_agent, code_generation, code_review, larger_context]
    weaknesses: [higher_cost_than_next]
    suitable_agents: [coder_maxq, code_review]
    pricing_key: qwen3-coder-plus
    notes: >
      DashScope/OpenAI-compatible 千问 Coder Plus。作为 MaxQ API Coder，
      替代不可用或不稳定的 OpenRouter Qwen Coder 路由。

  qwen3_7_max_tokenplan:
    provider: qwen_token_plan
    runtime_provider: tokenplan-qwen
    model_id: qwen3.7-max
    context_window: 1000000
    strengths: [repo_understanding, coding_agents, chinese, long_context]
    weaknesses: [expensive_without_plan, verbose_output]
    suitable_agents: [reposcout_large, interface_mapper_large, perception_maxq]
    pricing:
      currency: token_plan
      billing_source: qwen_token_plan
    notes: >
      Qwen Token Plan 入口。需要 QWEN_TOKEN_PLAN_API_KEY 与
      QWEN_TOKEN_PLAN_BASE_URL，由用户提供，不落盘保存明文密钥。

  qwen3_6_plus_tokenplan:
    provider: qwen_token_plan
    runtime_provider: tokenplan-qwen
    model_id: qwen3.6-plus
    context_window: 1000000
    strengths: [balanced, repo_understanding, chinese, interface_analysis]
    weaknesses: [not_top_tier_reasoning]
    suitable_agents: [reposcout, interface_mapper, researcher, auditor_balanced]
    pricing:
      currency: token_plan
      billing_source: qwen_token_plan
    notes: >
      Qwen Token Plan 入口。用于保留原 full_cli balanced 配置时消耗
      token plan，而不是默认 DashScope API 计费链路。

  qwen3_6_flash_tokenplan:
    provider: qwen_token_plan
    runtime_provider: tokenplan-qwen
    model_id: qwen3.6-flash
    context_window: 1000000
    strengths: [fast, cheap, batch, summary, light_audit]
    weaknesses: [weak_reasoning, no_deep_planning]
    suitable_agents: [frugal_reposcout, frugal_interface, researcher_light, archivist_light]
    pricing:
      currency: token_plan
      billing_source: qwen_token_plan
    notes: >
      Qwen Token Plan flash 入口。用于低档和轻量 verifier/archive 路线。

  qwen3_coder_next_tokenplan:
    provider: qwen_token_plan
    runtime_provider: tokenplan-qwen
    model_id: qwen3-coder-next
    context_window: 262000
    strengths: [coding_agent, cheap_coder, code_generation]
    weaknesses: [shorter_context, no_planning, no_multimodal]
    suitable_agents: [coder, frugal_coder]
    pricing:
      currency: token_plan
      billing_source: qwen_token_plan
    notes: >
      Qwen Token Plan coder-next 入口。用于原配置 low Coder。

  qwen3_coder_plus_tokenplan:
    provider: qwen_token_plan
    runtime_provider: tokenplan-qwen
    model_id: qwen3-coder-plus
    context_window: 1000000
    strengths: [coding_agent, code_generation, code_review, larger_context]
    weaknesses: [higher_cost_than_next]
    suitable_agents: [coder_maxq, code_review]
    pricing:
      currency: token_plan
      billing_source: qwen_token_plan
    notes: >
      Qwen Token Plan coder-plus 入口。用于原配置 performance/full Coder。

# ── Provider 配置 ──────────────────────────────────────────────────────

providers:
  deepseek_official:
    display: DeepSeek 官方 API
    currency: USD
    base_url: https://api.deepseek.com
    auth: env:DEEPSEEK_API_KEY
    notes: 当前 V4 Flash/Pro 成本非常有竞争力。

  dashscope_cn:
    display: DashScope 中国内地（北京）
    currency: CNY
    region: cn-beijing
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    auth: env:DASHSCOPE_API_KEY
    notes: 当前唯一可用 Qwen 模型入口。替代了原 OpenRouter 链路。

  dashscope_intl:
    display: DashScope 国际（新加坡，备用）
    currency: CNY
    region: singapore
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    auth: env:DASHSCOPE_API_KEY
    notes: 备用。无免费额度，适合非中国内地部署。

  qwen_token_plan:
    display: Qwen Token Plan
    currency: token_plan
    base_url: env:QWEN_TOKEN_PLAN_BASE_URL
    auth: env:QWEN_TOKEN_PLAN_API_KEY
    notes: >
      用户购买的 Qwen Token Plan 专用入口。当前仓库没有现成 key，
      需要用户提供 API key 和 OpenAI-compatible base URL 后启用。

  hermes_codex_oauth:
    display: Hermes Codex OAuth
    currency: subscription_or_oauth_quota
    auth: local_hermes_oauth_session
    command: hermes
    base_url: https://chatgpt.com/backend-api/codex
    runtime_provider: openai-codex
    default_model: gpt-5.6-sol
    reasoning_effort: xhigh
    notes: >
      Hermes 内部的 Codex OAuth provider。用于 Supervisor 等脑力层通过
      hermes --provider openai-codex -m gpt-5.6-sol 调用，并要求 xhigh reasoning effort；
      不等同于 Codex CLI worker。

  hermes_xai_oauth:
    display: Hermes xAI OAuth
    currency: subscription_or_oauth_quota
    auth: local_hermes_oauth_session
    command: hermes
    runtime_provider: xai-oauth
    default_model: grok-4.3
    capacity_source: config/model_capacity.yml
    notes: >
      Used separately by Grok Researcher and Grok media-tool contracts. Runtime
      auth/cooldown evidence is dynamic; this catalog entry never claims a
      remaining percentage or reset time.

  agy_gemini_oauth:
    display: Agy / Antigravity Gemini OAuth
    currency: subscription_or_oauth_quota
    auth: local_oauth_session
    command: agy
    region_requirement: vpn_or_proxy_to_supported_region
    default_model: gemini-3.5-flash-high
    cli_model_id: Gemini 3.5 Flash (High)
    notes: >
      AgentLab 默认 Gemini 路径。Agy 通过本地 OAuth 会话调用 Gemini 模型，
      不读取 GEMINI_API_KEY，不按本地 Gemini API key 计费。

  agy_claude_oauth:
    display: Agy / Antigravity Claude OAuth
    currency: subscription_or_oauth_quota
    auth: local_oauth_session
    command: agy
    region_requirement: vpn_or_proxy_to_supported_region
    default_model: Claude Sonnet 4.6 (Thinking)
    never_primary: true
    notes: >
      Agy Observer 的独立备用容量池；provider surface 仍为
      cli_agent:agy，不允许 API key fallback，未知剩余额度保持 null。

  gemini_api_free_tier:
    display: Gemini API Free Tier
    currency: free_tier_limited
    auth: env:GEMINI_API_KEY
    default_model: gemini-2.5-flash-high
    never_default: true
    notes: >
      显式备用通道。免费 API 额度有限，只有用户明确开启时才使用。
