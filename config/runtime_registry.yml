    allowed_data_classes: [public, internal]
    credential_source: environment_reference
    automatic_use: false
  dashscope_api:
    billing_mode: api_metered
    allowed_data_classes: [public, internal, private]
    credential_source: environment_reference
  xai_oauth:
    billing_mode: oauth_subscription
