schema_version: 1
authority:
  purpose: normalized_shell_adapter_provider_model_and_credential_pool_registry
  secret_storage: forbidden
  user_shell_configuration: read_only_reference
  hermes_optional_accelerator: true
  native_agentlab_execution_required: true

shells:
  hermes:
    worker_id: hermes
    command: hermes
    preferred_channel: json_rpc_ws
    control_plane: cli
    channel_config:
      endpoint: ws://127.0.0.1:9119/api/ws
      auto_start: true
      startup_timeout_seconds: 15
    capabilities:
      reasoning: 0.98
      agentic_control: 0.98
      coding: 0.94
      writing: 0.94
      narrative_continuity: 0.92
      audit: 0.96
      research: 0.95
      multimodal: 0.92
      artifact_generation: 0.93
      summarization: 0.96
    production_forbidden_flags: [-z, --ignore-rules, --yolo, --dangerously-skip-permissions]
    features:
      kanban: durable_cross_role_work
      delegate_task: same_role_short_parallelism_only
      profiles: agentlab_managed_isolated_profiles
      discovery: read_only

  claude:
    worker_id: claude_code
    command: claude
    capabilities:
      reasoning: 0.96
      agentic_control: 0.92
      coding: 0.98
      writing: 0.96
      narrative_continuity: 0.95
      audit: 0.95
      research: 0.82
      multimodal: 0.75
      artifact_generation: 0.90
      summarization: 0.95
    production_forbidden_flags: [--dangerously-skip-permissions, --allow-dangerously-skip-permissions]

  agy:
    worker_id: agy
    command: agy
    capabilities:
      reasoning: 0.94
      agentic_control: 0.86
      coding: 0.86
      writing: 0.93
      narrative_continuity: 0.91
      audit: 0.94
      research: 0.93
      multimodal: 0.98
      artifact_generation: 0.82
      summarization: 0.95

  qwen:
    worker_id: qwen
    command: qwen
    capabilities:
      reasoning: 0.93
      agentic_control: 0.90
      coding: 0.91
      writing: 0.91
      narrative_continuity: 0.88
      audit: 0.94
      research: 0.86
      multimodal: 0.96
      artifact_generation: 0.96
      summarization: 0.94
    production_forbidden_flags: [--yolo]

  grok:
    worker_id: grok
    command: grok
    status: quarantined
    capabilities:
      reasoning: 0.94
      agentic_control: 0.88
      coding: 0.88
      writing: 0.91
      narrative_continuity: 0.87
      audit: 0.93
      research: 0.98
      multimodal: 0.95
      artifact_generation: 0.94
      summarization: 0.93

  native:
    worker_id: native_api
    command: null
    capabilities:
      reasoning: 1.0
      agentic_control: 0.82
      coding: 0.90
      writing: 0.96
      narrative_continuity: 0.94
      audit: 0.96
      research: 0.80
      multimodal: 0.98
      artifact_generation: 0.82
      summarization: 0.97

adapters:
  hermes_runs:
    protocol: hermes_runs
    status: active
    transport: websocket_json_rpc
    contract_methods:
      - session.create
      - prompt.submit
      - session.usage
      - session.close
    capabilities: &broad_adapter_caps
      reasoning: 0.99
      agentic_control: 0.99
      coding: 0.97
      writing: 0.98
      narrative_continuity: 0.97
      audit: 0.98
      research: 0.98
      multimodal: 0.96
      artifact_generation: 0.97
      summarization: 0.99
  hermes_cli:
    protocol: hermes_cli
    status: active
    capabilities: *broad_adapter_caps
  claude_cli:
    protocol: claude_cli
    status: active
    capabilities: *broad_adapter_caps
  agy_cli:
    protocol: agy_cli
    status: active
    capabilities: *broad_adapter_caps
  qwen_cli:
    protocol: qwen_cli
    status: active
    capabilities: *broad_adapter_caps
  grok_cli:
    protocol: grok_cli
    status: quarantined
    capabilities: *broad_adapter_caps
  openai_chat:
    protocol: openai_chat
    status: active
    capabilities: *broad_adapter_caps
  openai_responses:
    protocol: openai_responses
    status: active
    capabilities: *broad_adapter_caps
  anthropic_messages:
    protocol: anthropic_messages
    status: active
    capabilities: *broad_adapter_caps
  gemini_generate_content:
    protocol: gemini_generate_content
    status: active
    capabilities: *broad_adapter_caps

providers:
  openai_codex_oauth:
    billing_mode: oauth_subscription
    allowed_data_classes: [public, internal, private]
    credential_source: user_managed_hermes_profile
  deepseek_api:
    billing_mode: api_metered
    allowed_data_classes: [public, internal, private]
    credential_source: environment_reference
  agy_gemini_oauth:
    billing_mode: oauth_subscription
    allowed_data_classes: [public, internal, private]
