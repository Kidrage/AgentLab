      shell_id: hermes
      argv: [hermes, -p, agentlabsupervisor, chat]
      slash_command: /usage
      exit_command: /exit
      timeout_seconds: 30
  deepseek_metered:
    provider_id: deepseek_api
    billing_mode: api_metered
    legacy_capacity_pool_id: deepseek_metered_api
  agy_gemini:
    provider_id: agy_gemini_oauth
    billing_mode: oauth_subscription
    legacy_capacity_pool_id: agy_gemini_observer
