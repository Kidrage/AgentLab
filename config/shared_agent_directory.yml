schema_version: 1
authority: _shared/AGENT_PROTOCOL.md
generated_inventory_policy: explicit_registration

peer_discovery:
  required_before_collaboration: true
  required_reads:
    - _shared/AGENT_PROTOCOL.md
    - config/shared_agent_directory.yml
    - config/capability_routing_policy.yml
    - config/agent_collaboration.yml
    - config/repository_handoff_policy.yml
  required_checks:
    - identify_current_endpoint
    - identify_current_agent
    - list_peer_endpoints
    - list_peer_agents
    - validate_target_invocation_contract
    - inspect_target_status_and_locks
    - discover_or_create_repository_handoff
  unknown_peer_behavior: stop_and_report_inventory_gap

repository_memory:
  applies_to_all_endpoints_and_agents: true
  policy: config/repository_handoff_policy.yml
  discover_command: ./agentlab.sh repository-handoff --repo "{repository_path}"
  refresh_command: ./agentlab.sh repository-handoff --repo "{repository_path}" --write
  project_root_visible_path: PROJECT_HANDOFF.md
  local_path: .agentlab/HandOff.md
  compatible_project_memory_path: agent_docs/HandOff.md
  shared_path: memory/repositories/{repository_id}/HandOff.md

endpoints:
  local_source:
    display_name: Local Source Workstation
    role: source_of_truth_development
    workspace: /Users/saintpeter/Desktop/AgentLab
    writable_scopes: [source, config, protocols, tests, projects]
    sync_out: [git, relay_rsync]
    peer_awareness_required: true
  relay_hub:
    display_name: Relay Hub
    role: mirror_and_exchange_only
    workspace: <RELAY_WORKSPACE>
    writable_scopes: [workspace_mirror, agent_namespaces, shared_state]
    execution_allowed: false
    peer_awareness_required: true
  cloud_runtime:
    display_name: Cloud Runtime
    role: deployment_and_continuous_execution
    workspace: /home/admin/AgentLab
    writable_scopes: [runtime_state, task_runs, deployment_artifacts]
    source_changes_require_upstream_handoff: true
    peer_awareness_required: true
  localization_69:
    display_name: Localization Endpoint 69
    role: localization_target
    workspace: /Users/saintpeter/Desktop/AgentLab
    status: ready
    evidence: "Verified clean workspace, pulled commit 2d7c4239298806768e3a867431de4a45f59f2caf. Installed and verified all missing tools (ripgrep, ast-grep, uv, ruff, pnpm) and agents (codex, qwen). Aligned bailian-cli version and credentials with Cloud 250. All pytest shared agent protocol tests passed successfully."
    writable_scopes: [localization_workspace]
    peer_awareness_required: true
    resolved_workspace: /Users/saintpeter/Desktop/AgentLab
    installed_agents:
      agentlab: "0.1.0"
      openclaw: "2026.6.9"
      hermes: "v0.17.0"
      claude_code: "2.1.186"
      agy: "1.0.10"
      bl: "1.4.1"
      codex: "0.142.0"
      qwen: "0.19.1"
    invocation_contracts:
      hermes: "hermes -z \"You are an AgentLab CLI executor. Read the JSON task packet at {task_packet_path}, perform the requested AgentLab role work, and return a concise markdown report with findings, actions taken, verification, and blockers.\""
      claude_code: "claude -p \"{prompt}\""
      bl: "bl chat -p \"{prompt}\""
      agy: "agy --sandbox -p \"{prompt}\""
      openclaw: "openclaw run --prompt \"{prompt}\""
      codex: "codex --task \"{prompt}\""
      qwen: "qwen --bare --approval-mode default --output-format json \"{prompt}\""
    skill_inventory:
      - name: agent-reach
        version: "universal"
        path: /Users/saintpeter/.agents/skills/agent-reach
        trigger: "research/search/look up/find anything on the internet"
      - name: bailian-cli
        version: "1.4.1"
        path: /Users/saintpeter/.agents/skills/bailian-cli
        trigger: "specialist cloud tool for DashScope / Aliyun Model Studio"
      - name: codebase-design
        version: "universal"
        path: /Users/saintpeter/.agents/skills/codebase-design
        trigger: "design or improve a module's interface"
      - name: ponytail
        version: "universal"
        path: /Users/saintpeter/.agents/skills/ponytail
        trigger: "forces the laziest solution that actually works"
      - name: tdd
        version: "universal"
        path: /Users/saintpeter/.agents/skills/tdd
        trigger: "test-driven development"
      - name: review
        version: "universal"
        path: /Users/saintpeter/.agents/skills/review
        trigger: "review the changes since a fixed point"
    mcp_inventory:
      - name: codebase-memory-mcp
        transport: mcp-lazy
        command: null
        permissions: read-write
      - name: agentlab_stdio
        transport: stdio
        command: scripts/agentlab_mcp_stdio.sh
        permissions: read-write
    deterministic_tool_inventory:
      git: "/usr/bin/git"
      rg: "/Users/saintpeter/.local/bin/rg"
      ast_grep: "/Users/saintpeter/.local/bin/ast-grep"
      pytest: "/Users/saintpeter/anaconda3/bin/pytest"
      ruff: "/Users/saintpeter/anaconda3/bin/ruff"
      uv: "/Users/saintpeter/.local/bin/uv"
      npm: "/Users/saintpeter/.local/bin/npm"
      pnpm: "/Users/saintpeter/.local/bin/pnpm"
    service_inventory:
      agentlab_mcp: "inactive"
      agentlab_ops_console: "inactive"
      openclaw_gateway: "inactive"

agents:
  agentlab:
    display_name: AgentLab Control Plane
    class: governance_control_plane
    primary_roles: [contract_compile, routing, approval, evidence, acceptance, archive]
    invocation:
      command: ./agentlab.sh
      task_route: ./agentlab.sh route-task --task-packet "{task_packet_path}"
      status: ./agentlab.sh status --project "{project}" --task-id "{task_id}"
    may_edit_project_files: false
    may_write_governance_artifacts: true
  openclaw:
    display_name: OpenClaw Front Desk
    class: frontdesk_gateway
    primary_roles: [user_intake, approval_display, delegation, result_delivery]
    invocation:
      command: openclaw
      one_turn: openclaw agent --agent "{frontdesk_agent_id}" --message "{prompt}"
    explicit_named_delegation_mode: relay_only
    may_edit_task_files_when_relaying: false
  hermes:
    display_name: Hermes CLI Frontdesk and Supervisor Shell
    class: frontdesk_and_supervisor_cli
    primary_roles: [user_intake, task_routing, planning, decomposition, coordination, recovery, global_memory]
    invocation:
      command: hermes
      frontdesk_session: >-
        hermes --provider deepseek -m deepseek-v4-pro -z "$(./agentlab.sh frontdesk-session --agent hermes)"
      one_shot: >-
        hermes -z "Read the task packet at {task_packet_path}; perform only the assigned role;
        return findings, actions, verification, changed files, and blockers."
    frontdesk_model: deepseek_v4_pro
    frontdesk_provider: deepseek
    frontdesk_model_id: deepseek-v4-pro
    high_risk: true
  codex:
    display_name: Codex
    class: coding_agent
    primary_roles: [scoped_implementation, refactor, review, ci_repair]
    invocation:
      command: codex
      noninteractive: >-
        codex exec --json -C "{workspace_path}" "Read the task packet at
        {task_packet_path}; perform only the assigned work and report actual changes." < /dev/null
    high_risk: true
  claude_code:
    display_name: Claude Code
    class: coding_agent
    primary_roles: [deep_analysis, architecture, multi_file_implementation, review]
    invocation:
      command: claude
      noninteractive: >-
        claude --permission-mode bypassPermissions --output-format json -p "Read the task packet at {task_packet_path};
        perform only the assigned work and report actual changes."
    high_risk: true
  qwen:
    display_name: Qwen Code
    class: general_agent
    primary_roles: [planning, analysis, scoped_implementation, audit]
    invocation:
      command: qwen
      noninteractive: >-
        qwen --bare --approval-mode default --output-format json "Read the task packet at
        {task_packet_path}; perform only the assigned role and report actual changes."
    high_risk: true
  gemini:
    display_name: Gemini API CLI
    class: rough_work_agent
    primary_roles: [summarization, first_pass_classification, log_scanning, checklist_generation, disposable_analysis]
    invocation:
      command: gemini
      noninteractive: >-
        gemini --approval-mode plan --model gemini-2.5-flash-high --prompt "Read the task packet at
        {task_packet_path}; do read-only rough work only and report findings, confidence, and escalation points."
    default_path: false
    auth: env:GEMINI_API_KEY
    notes: Explicit Gemini API-key fallback only; free tier has usage limits.
    may_edit_project_files: false
    may_execute_commands: false
    high_risk: medium
  agy:
    display_name: Antigravity / Agy Gemini OAuth
    class: frontdesk_and_artifact_cli
    primary_roles: [user_intake, agentlab_command_translation, status_explanation, handoff_dispatch, artifact_production, longform_writing]
    invocation:
      command: agy
      frontdesk_session: >-
        agy --sandbox -p "$(./agentlab.sh frontdesk-session --agent agy)"
    default_model: gemini-3.5-flash-high
    auth: local_oauth_session
    billing: subscription_or_oauth_quota
    region_requirement: VPN/proxy to a Gemini-supported region when local region is blocked.
    explicit_named_delegation_mode: relay_only
    may_edit_task_files_when_relaying: false
    may_execute_agentlab_roles_directly: [ArtifactProducer]
    high_risk: true
  grok:
    display_name: Hermes Grok OAuth Media Worker
    class: media_backend_worker
    primary_roles: [media_candidate_generation, image_generation_handoff, video_generation_handoff]
    invocation:
      command: hermes
      role_session: >-
        hermes --ignore-rules --provider xai-oauth -m grok-build-0.1 -z "Read the AgentLab ArtifactProducer task packet at {task_packet_path};
        execute only media generation or media handoff work; return generated
        artifact paths, settings-fetch/auth errors, and validation notes."
    auth: hermes_xai_oauth_session
    default_path: media_backend_only
    may_act_as_general_frontdesk: false
    may_execute_agentlab_roles_directly: [ArtifactProducer]
    forbidden_roles: [Supervisor, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
    high_risk: medium
  bl:
    display_name: Bailian CLI
    class: specialist_cloud_tool
    primary_roles: [multimodal, media_generation, speech, rag, bailian_search]
    invocation:
      command: bl
      contract: capability_specific_subcommand_required
    may_act_as_general_frontdesk: false
    high_risk: medium

deterministic_tools:
  rg:
    capabilities: [repo_search]
    token_cost: 0
    priority: first
  git:
    capabilities: [history, diff, status, archive]
    token_cost: 0
    priority: first
  ast_grep:
    command: ast-grep
    capabilities: [structural_search]
    availability_required: true
  pytest:
    capabilities: [python_test]
    local_command: uv run --python 3.11 --with-requirements requirements.txt python -m pytest
  ruff:
    capabilities: [python_lint, format_check]
    availability_required: true

mcp_servers:
  agentlab_stdio:
    transport: stdio
    command: scripts/agentlab_mcp_stdio.sh
    exposure: local_only
    state_changing_tools_require_approval: true
  worker_local:
    status: delegated_opaque_until_declared
    invocation_allowed_only_if_registered: true

services:
  agentlab_mcp:
    transport: stdio
    port: null
    exposure: local_process_only
  agentlab_ops_console:
    bind: 127.0.0.1
    port_env: AGENTLAB_PORT
    default_port: 8765
    exposure: local_only
  openclaw_gateway:
    bind: 127.0.0.1
    default_port: 18789
    status: optional_runtime_service
    exposure: local_or_private_network_only
  openclaw_agentlab_webhook:
    bind: 127.0.0.1
    default_port: 19118
    status: optional_feedback_adapter
    exposure: local_only
  hermes_dashboard:
    bind: 127.0.0.1
    default_port: 9119
    status: optional_operator_ui
    exposure: local_only

network_policy:
  public_bind_default: forbidden
  credentials_in_directory: forbidden
  endpoint_specific_overrides_require_approval: true
