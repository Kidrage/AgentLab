schema_version: 3

# ─── AgentLab Agent Model Profiles & Executor Registry v3.1 ─────────────
# This file defines the active executor mappings, fallback chains, and
# interface configuration for both direct API usage and custom CLI agents.
# Each role in AgentLab has a configurable executor_type to switch between
# CLI/IDE agents and direct LLM API calls.
# ────────────────────────────────────────────────────────────────────────

profiles:
  frugal:
    # Under Frugal budget, we prefer direct APIs for cost-efficiency.
    supervisor:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_dashscope
    reposcout:
      executor_type: direct_api
      default: qwen3_6_flash_dashscope
      fallback: deepseek_v4_flash
      skip_for: [S0]
    interface_mapper:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_flash_dashscope
    researcher:
      executor_type: direct_api
      default: skip_unless_required
    coder:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_coder_next_dashscope
      external_ide_allowed: false
    tester_auditor:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_dashscope
      skip_for: [S0_non_critical]
    verifier:
      executor_type: direct_api
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      executor_type: direct_api
      default: template_only
    notes: >
      Low cost / direct API mode.

  balanced:
    # Balanced mode uses CLI executors for brain (Hermes) and coding (Claude Code).
    supervisor:
      # 智能体执行接口：可用 CLI 智能体接管，或使用 direct_api 裸跑
      executor_type: cli_agent
      cli_agent: hermes
      cli_command: "hermes --task {task_packet_path}"
      default: deepseek_v4_pro
      fallback: qwen3_6_plus_dashscope
    reposcout:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: qwen3_6_flash_dashscope
      skip_for: [S0]
    interface_mapper:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_plus_dashscope
    researcher:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_flash_dashscope
    coder:
      # Coder 阶段使用 Claude Code 作为默认 CLI 智能体接管，并提供直连 API 降级
      executor_type: cli_agent
      cli_agent: claude_code
      cli_command: "claude --task {task_packet_path}"
      default: qwen3_coder_plus_dashscope
      fallback: deepseek_v4_flash
      external_ide_allowed: true
    tester_auditor:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: deepseek_v4_flash
    verifier:
      executor_type: direct_api
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      executor_type: direct_api
      default: qwen3_6_flash_dashscope
      fallback: qwen3_6_plus_dashscope
    notes: >
      AgentLab default hybrid mode.

  max_quality:
    # Max Quality uses CLI executors and higher-grade direct APIs for reviews.
    supervisor:
      executor_type: cli_agent
      cli_agent: hermes
      cli_command: "hermes --task {task_packet_path} --max-quality"
      default: deepseek_v4_pro
      fallback: qwen3_6_plus_dashscope
    reposcout:
      executor_type: direct_api
      default: qwen3_7_max_dashscope
      fallback: qwen3_6_plus_dashscope
    interface_mapper:
      executor_type: direct_api
      default: qwen3_7_max_dashscope
      fallback: qwen3_6_plus_dashscope
    researcher:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: qwen3_6_flash_dashscope
    coder:
      executor_type: cli_agent
      cli_agent: claude_code
      cli_command: "claude --task {task_packet_path} --max-quality"
      default: qwen3_coder_plus_dashscope
      fallback: deepseek_v4_flash
      external_ide_allowed: true
    tester_auditor:
      executor_type: direct_api
      default: qwen3_7_max_dashscope
      fallback: deepseek_v4_pro
    verifier:
      executor_type: direct_api
      default: deepseek_v4_pro
      fallback: qwen3_7_max_dashscope
    archivist:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: qwen3_6_flash_dashscope
    notes: >
      Maximum quality mode.

  low_cost:
    # Low-cost direct API profile: no CLI agents, cheap models only.
    supervisor:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_dashscope
    reposcout:
      executor_type: direct_api
      default: qwen3_6_flash_dashscope
      fallback: deepseek_v4_flash
      skip_for: [S0]
    interface_mapper:
      executor_type: direct_api
      default: skip_unless_required
    researcher:
      executor_type: direct_api
      default: skip_unless_required
    coder:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_coder_next_dashscope
      external_ide_allowed: false
    tester_auditor:
      executor_type: direct_api
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_dashscope
      skip_for: [S0_non_critical]
    verifier:
      executor_type: direct_api
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      executor_type: direct_api
      default: template_only
    notes: >
      Low-cost direct API only — no CLI agents, cheap models, deterministic/test mode.

  direct_api_only:
    # All roles use direct API; no CLI agent executors at all.
    supervisor:
      executor_type: direct_api
      default: deepseek_v4_pro
      fallback: qwen3_6_plus_dashscope
    reposcout:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: qwen3_6_flash_dashscope
    interface_mapper:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_plus_dashscope
    researcher:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_flash_dashscope
    coder:
      executor_type: direct_api
      default: qwen3_coder_plus_dashscope
      fallback: deepseek_v4_flash
    tester_auditor:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: deepseek_v4_flash
    verifier:
      executor_type: direct_api
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      executor_type: direct_api
      default: qwen3_6_flash_dashscope
    notes: >
      Direct API only — no CLI agent executors. Useful for environments without
      Hermes/Claude Code installed, CI, or deterministic testing.

  hybrid_agent_executor:
    # Explicit hybrid mode: Hermes for brain, Claude Code for coding, API fallback.
    supervisor:
      executor_type: cli_agent
      cli_agent: hermes
      cli_command: "hermes --task-packet {task_packet_path}"
      default: deepseek_v4_pro
      fallback:
        executor_type: direct_api
        provider: deepseek
        model: deepseek_v4_flash
    reposcout:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: qwen3_6_flash_dashscope
      skip_for: [S0]
    interface_mapper:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_plus_dashscope
    researcher:
      executor_type: direct_api
      default: skip_unless_required
      fallback: qwen3_6_flash_dashscope
    coder:
      executor_type: cli_agent
      cli_agent: claude_code
      cli_command: "claude --task-packet {task_packet_path}"
      default: qwen3_coder_plus_dashscope
      fallback:
        executor_type: direct_api
        provider: qwen
        model: qwen3_coder_plus_dashscope
      external_ide_allowed: true
    tester_auditor:
      executor_type: direct_api
      default: qwen3_6_plus_dashscope
      fallback: deepseek_v4_flash
    verifier:
      executor_type: direct_api
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      executor_type: direct_api
      default: qwen3_6_flash_dashscope
      fallback: qwen3_6_plus_dashscope
    notes: >
      Hybrid agent executor mode: Hermes (Supervisor/Brain) + Claude Code (Coder)
      as primary executors, direct API as fallback.