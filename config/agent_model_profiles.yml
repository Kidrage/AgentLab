  trusted_headless_cli:
    notes: Deprecated compatibility profile. Production bypass flags remain forbidden even with approval.
    safety:
      requires_env:
        AGENTLAB_ALLOW_DANGEROUS_CCS: "1"
      requires_human_approval: true
      never_default: true
    tiers:
      full:
        coder:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --model "{model_id}" --permission-mode plan --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_coder_plus_dashscope
          external_ide_allowed: true
