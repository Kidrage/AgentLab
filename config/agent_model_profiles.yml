schema_version: 3

# ─── AgentLab Agent Model Profiles v3 ──────────────────────────────────
# 替代 v2 的 model_profiles.yml。
# 模型引用基于 model_catalog.yml 中的 model key。
# 三层预算模式 × S0-S4 项目体量 × R0-R3 风险等级。
# ────────────────────────────────────────────────────────────────────────

profiles:
  frugal:
    supervisor:
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_openrouter
    reposcout:
      default: qwen3_6_flash_openrouter
      fallback: deepseek_v4_flash
      skip_for: [S0]
    interface_mapper:
      default: skip_unless_required
      fallback: qwen3_6_flash_openrouter
    researcher:
      default: skip_unless_required
    coder:
      default: qwen3_coder_next_openrouter
      fallback: deepseek_v4_flash
      external_ide_allowed: false
    tester_auditor:
      default: deepseek_v4_flash
      fallback: qwen3_6_flash_openrouter
      skip_for: [S0_non_critical]
    verifier:
      default: skip_unless_required
      fallback: deepseek_v4_flash
    archivist:
      default: template_only
    risk_upgrade:
      R2: balanced
      R3: max_quality
    notes: >
      适合实验脚本、一次性 demo、小 bug。
      不适合架构重构、插件核心、数据迁移、安全相关代码。

  balanced:
    supervisor:
      S0: deepseek_v4_flash
      S1: qwen3_6_plus_openrouter
      S2: deepseek_v4_pro
      S3: deepseek_v4_pro
      S4: deepseek_v4_pro
      R2_extra: must_output_risk_checklist
      R3: max_quality  # 自动升级
    reposcout:
      S0: skip
      S1: qwen3_6_flash_openrouter
      S2: qwen3_6_plus_openrouter
      S3: qwen3_7_max_openrouter
      S4: qwen3_7_max_openrouter
      R2_extra: must_output_related_file_list
    interface_mapper:
      S0: skip
      S1: skip_unless_required
      S2: qwen3_6_plus_openrouter
      S3: qwen3_7_max_openrouter
      S4: qwen3_7_max_openrouter
      R2_extra: must_list_interface_contracts
    researcher:
      S0: skip
      S1: skip_unless_required
      S2: qwen3_6_flash_openrouter
      S3: qwen3_6_plus_openrouter
      S4: qwen3_6_plus_openrouter
    coder:
      default: qwen3_coder_next_openrouter
      external_ide_allowed: true
      R2_extra: no_single_monolithic_patch
      patch_mode: [patch_plan, diff, implementation_notes]
    tester_auditor:
      R0: deepseek_v4_flash
      R1: qwen3_6_plus_openrouter
      R2: qwen3_6_plus_openrouter
      cross_review: >
        与 Coder 使用不同模型家族。Coder 用 Qwen → 审查用 DeepSeek；
        Coder 用 DeepSeek → 审查用 Qwen。
    verifier:
      R0: skip_unless_required
      R1: deepseek_v4_flash
      R2: deepseek_v4_pro
    archivist:
      R0: template_only
      R1: qwen3_6_flash_openrouter
      R2: qwen3_6_plus_openrouter
    notes: >
      AgentLab 默认模式。适合真实项目日常开发。
      核心是"不要所有步骤都用最贵模型"，但关键节点必须用强模型。

  max_quality:
    supervisor:
      default: deepseek_v4_pro
      extra_outputs: [architecture_plan, failure_modes, rollback_strategy]
    reposcout:
      default: qwen3_7_max_openrouter
      extra_outputs: [repo_structure_map, ranked_related_files]
    interface_mapper:
      default: qwen3_7_max_openrouter
      extra_outputs: [data_structures, interface_contracts, call_chains]
    researcher:
      default: qwen3_6_plus_openrouter
      enable_external_search: true
    coder:
      default: qwen3_coder_next_openrouter
      external_ide_allowed: true
      patch_mode: [batch_patch_only]
      extra: no_monolithic_overhaul
    tester_auditor:
      primary: qwen3_7_max_openrouter
      secondary: deepseek_v4_pro
      cross_review: >
        双模型复核。关注不同错误模式。与 Coder 不同模型家族。
    verifier:
      default: deepseek_v4_pro
      cross_review: 与 Coder 不同模型家族，防止同源幻觉。
    archivist:
      default: qwen3_6_plus_openrouter
      extra_outputs: [full_changelog, risks, test_results, rollback_points]
    notes: >
      核心架构、生产安全、长期主干、不可逆操作。
      不是"全部都用最贵模型"，而是"关键决策双模型 + 强门禁"。

# ── 高风险门禁 (R2+/R3 强制) ──────────────────────────────────────────

high_risk_gates:
  R2:
    - require_test_plan
    - require_independent_model_review
    - require_changed_files_summary
    - forbid_single_monolithic_patch
  R3:
    - require_human_confirmation_before_write
    - require_backup_or_git_clean_state
    - require_rollback_plan
    - require_test_plan
    - require_independent_model_review
    - require_changed_files_summary
    - dual_model_review_mandatory