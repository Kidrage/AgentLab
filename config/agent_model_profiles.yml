schema_version: 4.0
default_mode: full_cli
dynamic_runtime:
  enabled: true
  enabled_modes: [full_cli]
  registry: config/runtime_registry.yml
  routing_policy: config/routing_policy.yml
  pricing_catalog: config/pricing_catalog.yml
  legacy_matrix_role: generated_compatibility_view_only
authority:
  purpose: mode_metadata_and_generated_compatibility_views
  owns:
    - agent_backend_mode
    - non_dynamic_mode_profiles
  does_not_own:
    - full_cli_runtime_route_selection
    - cli_command_templates
    - model_provider_facts
    - task_level_manual_executor_priority
  full_cli_runtime_source: config/runtime_registry.yml
  full_cli_routing_source: config/routing_policy.yml
  command_template_source: config/worker_invocation_contracts.yml
  model_fact_source: config/model_catalog.yml
  provider_fact_source: config/model_providers.yml
  external_executor_router_source: config/executor_router.yml
  automatic_fallback_source: config/runtime_registry.yml
  legacy_capacity_source: config/model_capacity.yml
  undeclared_failure_policy: stop_and_report
  notes:
    - Dynamic full_cli route selection comes only from config/runtime_registry.yml plus config/routing_policy.yml.
    - The full_cli tier matrix below is a generated compatibility view and is never a fallback input.
    - CLI command strings are resolved from invocation_contract keys, not duplicated here.
    - A runtime candidate switch is executable only at a completed checkpoint after a fresh route decision.
    - A failed dynamic route never falls through to the compatibility matrix or legacy capacity routes.
    - trusted_headless_cli is an explicit safety-gated exception and must never be default.
tier_policy:
  default_tier: performance
  tiers:
    full:
      budget_aliases: [max_quality, full]
      intent: highest_quality_local_or_api_execution
    performance:
      budget_aliases: [balanced, performance, brain_allocated]
      intent: balanced_quality_cost_default
    low:
      budget_aliases: [frugal, low, low_cost]
      intent: cheapest_safe_execution_with_optional_roles_skipped
