schema_version: 4.0
default_mode: full_cli
modes:
  full_cli:
    notes: 全 Agents CLI 模式。所有可用角色都通过本地命令行智能体拉起。
    tiers:
      full:
        supervisor:
          executor_type: cli_agent
          cli_agent: hermes
          cli_command: 'hermes -z "You are an AgentLab CLI executor. Read the JSON task packet at {task_packet_path}, perform the requested AgentLab role work, and return a concise markdown report with findings, actions taken, verification, and blockers."'
          default: deepseek_v4_pro
        reposcout:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_7_max_dashscope
        interface_mapper:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_7_max_dashscope
        researcher:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
        prompt_engineer:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_7_max_dashscope
        coder:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_coder_plus_dashscope
          external_ide_allowed: true
        artifact_producer:
          executor_type: cli_agent
          cli_agent: codex
          cli_command: 'codex exec "Read task packet {task_packet_path}; perform only the ArtifactProducer role and return produced artifacts, validation, and fallback status."'
          default: qwen3_7_max_dashscope
        tester_auditor:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_7_max_dashscope
        verifier:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: deepseek_v4_pro
        archivist:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
      performance:
        supervisor:
          executor_type: cli_agent
          cli_agent: hermes
          cli_command: 'hermes -z "You are an AgentLab CLI executor. Read the JSON task packet at {task_packet_path}, perform the requested AgentLab role work, and return a concise markdown report with findings, actions taken, verification, and blockers."'
          default: deepseek_v4_pro
        reposcout:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
        interface_mapper:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
        researcher:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_flash_dashscope
        prompt_engineer:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
        coder:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_coder_plus_dashscope
          external_ide_allowed: true
        artifact_producer:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the ArtifactProducer role and report produced artifacts, validation, and fallback status."'
          default: qwen3_6_plus_dashscope
        tester_auditor:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
        verifier:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_flash_dashscope
        archivist:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_6_plus_dashscope
      low:
        supervisor:
          executor_type: cli_agent
          cli_agent: hermes
          cli_command: 'hermes -z "You are an AgentLab CLI executor. Read the JSON task packet at {task_packet_path}, perform the requested AgentLab role work, and return a concise markdown report with findings, actions taken, verification, and blockers."'
          default: deepseek_v4_flash
        reposcout:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report concise actual changes."'
          default: qwen3_6_flash_dashscope
        interface_mapper: skip
        researcher: skip
        prompt_engineer:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report concise actual changes."'
          default: qwen3_6_flash_dashscope
        coder:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --effort low --output-format json -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_coder_next_dashscope
          external_ide_allowed: false
        artifact_producer:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the ArtifactProducer role and report concise artifact evidence."'
          default: qwen3_6_flash_dashscope
        tester_auditor:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report concise actual changes."'
          default: deepseek_v4_flash
        verifier: skip
        archivist:
          executor_type: cli_agent
          cli_agent: agy
          cli_command: 'agy --sandbox -p "Read task packet {task_packet_path}; perform only the assigned role and report concise actual changes."'
          default: qwen3_6_flash_dashscope
  full_api:
    notes: 纯 API 模式。根据环境中的 API 密钥及能力动态选配，或回退至静态降级链。
    tiers:
      full:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_pro
          fallback: qwen3_7_max_dashscope
        reposcout:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
          fallback: qwen3_6_plus_dashscope
        interface_mapper:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
          fallback: qwen3_6_plus_dashscope
        researcher:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
          fallback: qwen3_6_plus_dashscope
        coder:
          executor_type: direct_api
          default: qwen3_coder_plus_dashscope
          fallback: deepseek_v4_pro
        artifact_producer:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
          fallback: qwen3_6_plus_dashscope
        tester_auditor:
