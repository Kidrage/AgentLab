schema_version: 4.0
default_mode: full_cli
professional_role_profiles:
  authorial_director: {base_role_key: supervisor, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalSupervisorStrict}
  canon_timeline_steward: {base_role_key: reviewer, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalReviewerStrict}
  plot_causality_architect: {base_role_key: narrative_planner, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalNarrativePlannerStrict}
  character_ensemble_director: {base_role_key: narrative_planner, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalNarrativePlannerStrict}
  relationship_director: {base_role_key: reviewer, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalReviewerStrict}
  world_archaeologist: {base_role_key: researcher, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalResearcherStrict}
  foreshadow_mystery_keeper: {base_role_key: narrative_planner, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalNarrativePlannerStrict}
  arc_scene_planner: {base_role_key: narrative_planner, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalNarrativePlannerStrict}
  research_style_curator: {base_role_key: researcher, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalResearcherStrict}
  writer: {base_role_key: writer, execution_tier: alter, execution_kind: cli_agent, capacity_route: AlterWriterStrict}
  senior_editor:
    base_role_key: reviewer
    execution_tier: alter
    execution_kind: cli_agent
    capacity_route: ProfessionalIndependentReviewerStrict
    execution_override:
      cli_agent: hermes
      invocation_contract: hermes_deepseek_narrative_audit
      default: deepseek_v4_flash_hermes_private
  reader_simulation_panel: {base_role_key: reviewer, execution_tier: alter, execution_kind: cli_agent, capacity_route: ProfessionalReviewerStrict}
  state_projector: {base_role_key: scribe, execution_tier: deterministic, execution_kind: deterministic_tool}
authority:
  purpose: canonical_agent_backend_selection
  owns:
    - agent_backend_mode
    - tier_role_executor
    - default_model_key
  does_not_own:
    - cli_command_templates
    - model_provider_facts
    - task_level_manual_executor_priority
  command_template_source: config/worker_invocation_contracts.yml
  model_fact_source: config/model_catalog.yml
  provider_fact_source: config/model_providers.yml
  external_executor_router_source: config/executor_router.yml
  automatic_fallback_source: config/model_capacity.yml
  undeclared_failure_policy: stop_and_report
  notes:
    - This file is the single runtime source for selecting each AgentLab role backend.
    - CLI command strings are resolved from invocation_contract keys, not duplicated here.
    - A CLI-owned provider/model may only be assigned to the worker whose command owns that provider surface; Codex worker routes must use Codex CLI model facts, never DeepSeek or Hermes provider identities.
    - Automatic fallback is executable only when a capacity_route delegates to config/model_capacity.yml.
    - Every failure outside a capacity-approved route stops and reports without switching worker, model, or provider.
tier_policy:
  default_tier: alter
  tiers:
    alter:
      budget_aliases: [alter, altered]
      intent: subscription_first_codex_agy_and_deepseek_without_active_grok
    full:
      budget_aliases: [max_quality, full, high_reasoning]
      intent: highest_quality_local_or_api_execution
    performance:
      budget_aliases: [balanced, performance, brain_allocated]
      intent: balanced_quality_cost_default
    low:
      budget_aliases: [frugal, low, low_cost]
      intent: cheapest_safe_execution_with_optional_roles_skipped
