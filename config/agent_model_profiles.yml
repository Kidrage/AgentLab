          default: deepseek_v4_pro
          fallback: qwen3_7_max_dashscope
        archivist:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
      performance:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_pro
          fallback: qwen3_6_plus_dashscope
        reposcout:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
        interface_mapper:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
        researcher:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
        coder:
          executor_type: direct_api
          default: qwen3_coder_plus_dashscope
          fallback: deepseek_v4_flash
        artifact_producer:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
        tester_auditor:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: deepseek_v4_flash
        verifier:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        archivist:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
          fallback: qwen3_6_flash_dashscope
      low:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_flash
          fallback: qwen3_6_flash_dashscope
        reposcout:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        interface_mapper: skip
        researcher: skip
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        coder:
          executor_type: direct_api
          default: qwen3_coder_next_dashscope
          fallback: deepseek_v4_flash
        artifact_producer:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        tester_auditor:
          executor_type: direct_api
          default: deepseek_v4_flash
        verifier: skip
        archivist:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
  hybrid_ide:
    notes: 外部 IDE 协作模式。内部使用便宜的大脑流转与测试审计，核心编码交由外部接管。
    tiers:
      full:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_pro
          fallback: qwen3_7_max_dashscope
        reposcout:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
        interface_mapper:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
        researcher:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
        coder:
          executor_type: special
          provider: external_ide_ai
        artifact_producer:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
        tester_auditor:
          executor_type: direct_api
          default: qwen3_7_max_dashscope
        verifier:
          executor_type: direct_api
          default: deepseek_v4_pro
        archivist:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
      performance:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_flash
        reposcout:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        interface_mapper:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        researcher: skip
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        coder:
          executor_type: special
          provider: external_ide_ai
        artifact_producer:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
        tester_auditor:
          executor_type: direct_api
          default: qwen3_6_plus_dashscope
        verifier: skip
        archivist:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
      low:
        supervisor:
          executor_type: direct_api
          default: deepseek_v4_flash
        reposcout:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        interface_mapper: skip
        researcher: skip
        prompt_engineer:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        coder:
          executor_type: special
          provider: external_ide_ai
        artifact_producer:
          executor_type: direct_api
          default: qwen3_6_flash_dashscope
        tester_auditor:
          executor_type: direct_api
          default: deepseek_v4_flash
        verifier: skip
        archivist: skip
  trusted_headless_cli:
    notes: Explicit opt-in profile for trusted local-only headless CLI automation. Requires env gate and human approval.
    safety:
      requires_env:
        AGENTLAB_ALLOW_DANGEROUS_CCS: "1"
      requires_human_approval: true
      never_default: true
    tiers:
      full:
        coder:
          executor_type: cli_agent
          cli_agent: claude_code
          binary_candidates:
            - claude
            - ccs
          cli_command: 'claude --output-format json --allow-dangerously-skip-permissions -p "Read task packet {task_packet_path}; perform only the assigned role and report actual changes."'
          default: qwen3_coder_plus_dashscope
          external_ide_allowed: true
