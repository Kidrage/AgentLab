schema_version: 3
authority:
  purpose: driver_mode_selection
  owns:
    - workflow_driver
    - driver_to_agent_backend_mode_mapping
    - retired_driver_aliases
  does_not_own:
    - tier_role_executor
    - cli_command_templates
    - model_provider_facts
  agent_backend_source: config/agent_model_profiles.yml
  notes:
    - Driver modes decide who leads the workflow.
    - Agent backend modes decide how each AgentLab role is executed.
    - Do not add per-agent model or CLI command defaults here.
    - A worker shell receives only its assigned AgentLab role; no shell may emulate the full route.
default_mode: agentlab_orchestrated_cli
execution_modes:
  agentlab_orchestrated_cli:
    description: "AgentLab owns the workflow and dispatches each role to its configured CLI worker."
    driver_scope: agentlab_orchestrated
    agent_backend_mode: full_cli
    artifact_required: true
    allow_worker_all_roles: false

legacy_aliases:
  codex_full_driver:
    status: retired
    replacement: agentlab_orchestrated_cli
    read_compatibility_only: true
    dispatch_allowed: false
    reason: "A single external shell must not impersonate an AgentLab role chain."
