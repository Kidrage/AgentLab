schema_version: task-input-tier-policy/v1

sealed_source_policy:
  max_total_bytes: 2097152
  allowed_extensions: [.md, .txt, .json, .yml, .yaml]
  project_roots: [production, project_brain, reset_manifests]
  candidate_run_roots: [outputs, artifacts]
  same_task_attempt_output: output.md
  same_task_runtime_roots: [artifacts/versions, records/immutable]

# Classification is fact-based. Natural-language keywords never lower a route.
# Unknown or missing facts fail closed to L3 so the Brain must plan the work.
tiers:
  L0:
    label: exact_micro_patch
    route: brain_direct
    worker_limit: 0
    delegation_mode: brain_only
    minimum_successful_delegated_attempts: 0
    pre_worker_records: []
    brain_decision_required: false
    full_audit_required: false
    validation_gates:
      - schema_validation
      - targeted_diff_check
    required_records:
      - input_classification
      - change_receipt
      - memory_update
    gate_evidence:
      schema_validation: change_receipt
      targeted_diff_check: change_receipt
  L1:
    label: local_creative_patch
    route: single_worker
    worker_limit: 1
    delegation_mode: single_worker_identity
    minimum_successful_delegated_attempts: 1
    pre_worker_records: []
    brain_decision_required: false
    full_audit_required: false
    validation_gates:
      - schema_validation
      - targeted_diff_check
      - local_quality_check
    required_records:
      - input_classification
      - worker_attempt_receipt
      - local_validation_receipt
      - change_receipt
      - memory_update
    gate_evidence:
      schema_validation: change_receipt
      targeted_diff_check: change_receipt
      local_quality_check: local_validation_receipt
  L2:
    label: guarded_local_patch
    route: single_worker_checked
    worker_limit: 1
    delegation_mode: single_worker_identity
    minimum_successful_delegated_attempts: 1
    pre_worker_records: []
    brain_decision_required: false
    full_audit_required: false
    validation_gates:
      - schema_validation
      - targeted_diff_check
      - targeted_continuity_check
      - local_quality_check
    required_records:
      - input_classification
      - worker_attempt_receipt
      - targeted_validation_receipt
      - change_receipt
      - memory_update
    gate_evidence:
      schema_validation: change_receipt
      targeted_diff_check: change_receipt
      targeted_continuity_check: targeted_validation_receipt
      local_quality_check: targeted_validation_receipt
  L3:
    label: governed_pipeline
    route: governed_pipeline
    worker_limit: null
    delegation_mode: governed_multi_worker
    minimum_successful_delegated_attempts: 2
    pre_worker_records:
      - brain_scope_decision
      - execution_plan
    brain_decision_required: true
    full_audit_required: true
    validation_gates:
      - brain_plan_gate
      - input_snapshot_gate
      - full_quality_gate
      - continuity_gate
      - evidence_selection_gate
    required_records:
      - input_classification
      - brain_scope_decision
      - execution_plan
      - worker_attempt_receipt
      - quality_receipt
      - evidence_binding
      - change_receipt
      - memory_update
    gate_evidence:
      brain_plan_gate: brain_scope_decision
      input_snapshot_gate: execution_plan
      full_quality_gate: quality_receipt
      continuity_gate: quality_receipt
      evidence_selection_gate: evidence_binding

classification:
  kind_minimum:
    exact_patch: L0
    creative_patch: L1
    consistency_patch: L2
    prose_build: L3
    structural_change: L3
    audit_review: L3
    canon_promotion: L3
    unclassified: L3
  scope_minimum:
    single_detail: L0
    localized: L1
    cross_artifact: L3
    multi_chapter: L3
    project_wide: L3
    unknown: L3
  canon_impact_minimum:
    none: L0
    candidate: L0
    canonical: L2
    unknown: L3
  risk_minimum:
    age_continuity: L2
    relationship_continuity: L2
    magic_cost_continuity: L2
    sensitive_content: L2
    longform_continuity: L3
    main_arc_change: L3
    world_model_change: L3
    destructive_change: L3
  target_count:
    l0_max: 1
    l1_max: 3
    l2_max: 3

trace_record_contracts:
  narrative_task_packet:
    schema_version: narrative-task-packet/v1
    producer_roles: [Runtime]
    fields:
      status: {type: string, equals: compiled}
      runtime_standard: {type: string, equals: task-runtime-v2}
      project: {type: string}
      task_id: {type: string}
      change_kind: {type: string}
      request: {type: mapping, minimum_items: 1}
      truth_bindings: {type: mapping, minimum_items: 1}
      required_roles: {type: list, minimum_items: 1}
  brain_scope_decision:
    schema_version: brain-scope-decision/v1
    producer_roles: [Supervisor]
    producer_attempt_id_field: producer_attempt_id
    source_output_sha256_field: source_output_sha256
    source_output_key: brain_scope_decision
    fields:
      producer_attempt_id: {type: string}
      source_output_sha256: {type: sha256}
      approved: {type: boolean, equals: true}
      chapter_start: {type: integer, minimum: 1}
      chapter_end: {type: integer, minimum: 1}
      target_cjk_chars: {type: integer, minimum: 1000}
      quality_thresholds: {type: mapping, minimum_items: 1}
    relations:
      - {left: chapter_end, operator: gte_field, right: chapter_start}
  execution_plan:
    schema_version: task-execution-plan/v1
    producer_roles: [Supervisor]
    producer_attempt_id_field: producer_attempt_id
    source_output_sha256_field: source_output_sha256
    source_output_key: execution_plan
    fields:
      producer_attempt_id: {type: string}
      source_output_sha256: {type: sha256}
      status: {type: string, equals: approved}
      route: {type: string, equals: governed_pipeline}
      work_items: {type: list, minimum_items: 2}
  narrative_user_acceptance:
    schema_version: narrative-user-acceptance-gate/v1
    producer_roles: [Runtime]
    fields:
      status: {type: string, equals: accepted}
      receipt_path: {type: string}
      candidate_set_id: {type: string}
      candidate_set_sha256: {type: sha256}
      evidence_bundle_sha256: {type: sha256}
  worker_attempt_receipt:
    schema_version: worker-attempt-receipt/v1
    producer_roles: [Runtime]
    attempt_id_field: attempt_ids
    attempt_receipt_hashes_field: receipt_hashes
    fields:
      status: {type: string, equals: pass}
      attempt_ids: {type: list, minimum_items: 1}
      receipt_hashes: {type: mapping, minimum_items: 1}
  local_validation_receipt:
    schema_version: local-validation-receipt/v1
    producer_roles: [Supervisor, TesterAuditor, Runtime]
    fields:
      status: {type: string, equals: pass}
      checks: {type: list, minimum_items: 1}
  targeted_validation_receipt:
    schema_version: targeted-validation-receipt/v1
    producer_roles: [Supervisor, TesterAuditor, Runtime]
    fields:
      status: {type: string, equals: pass}
      checks: {type: list, minimum_items: 1}
  quality_receipt:
    schema_version: brain-quality-receipt/v1
    producer_roles: [Supervisor]
    producer_attempt_id_field: producer_attempt_id
    source_output_sha256_field: source_output_sha256
    source_output_key: quality_receipt
    attempt_receipt_hash_links:
      - {attempt_id_field: review_attempt_id, hash_field: review_receipt_hash, allowed_roles: [Reviewer, TesterAuditor, Verifier]}
    record_data_hash_links:
      - {record_type: brain_scope_decision, data_field: quality_thresholds, hash_field: quality_thresholds_hash}
    fields:
      producer_attempt_id: {type: string}
      source_output_sha256: {type: sha256}
      review_attempt_id: {type: string}
      decision: {type: string, equals: pass}
      brain_acceptance: {type: boolean, equals: true}
      quality_thresholds_hash: {type: sha256}
      review_receipt_hash: {type: sha256}
  change_receipt:
    schema_version: change-receipt/v1
    producer_roles: [Supervisor, Runtime]
    path_list_field: changed_paths
    path_hashes_field: content_hashes
    fields:
      status: {type: string, equals: pass}
      changed_paths: {type: list, minimum_items: 1}
      content_hashes: {type: mapping, minimum_items: 1}
  memory_update:
    schema_version: memory-update-receipt/v1
    producer_roles: [Supervisor, Archivist, Runtime]
    path_list_field: updated_paths
    path_hashes_field: content_hashes
    fields:
      status: {type: string, equals: pass}
      updated_paths: {type: list, minimum_items: 1}
      content_hashes: {type: mapping, minimum_items: 1}
