root_policy:
  allowed_root_files:
    - .git
    - .gitignore
    - AGENTS.md
    - CLAUDE.md
    - CLI_ROADMAP.md
    - CONTEXT.md
    - DRIVER_PROTOCOL.md
    - OPERATING_MODEL.md
    - PROJECT_HANDOFF.md
    - README.md
    - USAGE_PLAN.md
    - agentlab.sh
    - agentlab_app.py
    - run_crown_ep1.sh
    - pyproject.toml
    - requirements.txt
    - requirements-dev.txt
    - pytest.ini
    - tox.ini
    - mypy.ini
    - .env
    - atomic_io.py
    - state_store.py
  allowed_root_dirs:
    - .git
    - .github
    - .agentlab
    - .agentlab_runtime
    - .agents
    - .agy
    - .claude
    - .clinerules
    - .codex
    - .gemini
    - .hermes
    - .openclaw
    - .pytest_cache
    - .qwen
    - .ruff_cache
    - .venv
    - __pycache__
    - _shared
    - acceptance_runs
    - agent_runtime
    - agent_templates
    - agentlab_app
    - agentlab_tui
    - config
    - docs
    - deploy
    - examples
    - memory
    - observability
    - projects
    - scripts
    - shared_protocols
    - skills
    - tests
    - web_ui
  ignored_runtime_dirs:
    - .agentlab
    - .agentlab_runtime
    - .agents
    - .agy
    - .claude
    - .codex
    - .gemini
    - .hermes
    - .openclaw
    - .qwen
    - .ruff_cache
    - .venv
    - __pycache__
    - .pytest_cache
  ignored_root_files:
    - .DS_Store
    - .claude.json
  forbidden_root_patterns:
    - "*.tmp"
    - "*handoff*.md"
    - "*draft*.md"
    - "粘贴的*"
    - "untitled*"
    - "scratch*"
  require_gitignore_for:
    - .agentlab/
    - memory/repositories/
    - projects/*/runs/
    - projects/*/tmp/
    - projects/*/scratch/
