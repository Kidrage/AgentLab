# ══════════════════════════════════════════════════════════════════════
# 跳过规则
# ══════════════════════════════════════════════════════════════════════

skip_rules:
  Researcher: >
    Skip unless external facts, current information, competitive analysis,
    vendor docs, standards, pricing, or regulation lookup is required.
    Include Researcher when the user asks about competitors, alternatives,
    surveys, benchmarks, or industry analysis.

  InterfaceMapper: >
    Skip unless a boundary, API, schema, I/O, metadata, or integration may change.
    L1/L2 without interface keywords: skip. L3: always include.

  RepoScout: >
    Skip only for L1 narrow tasks with obvious target files.
    L2: include. L3: include (deep scan with max model).

  Archivist: >
    L1: skip. L2: include (flash). L3: include (plus).
    Frugal mode: always skip.

  Verifier: >
    L1: skip. L2: include (flash). L3: include (plus).
    Frugal mode: skip.

  TesterAuditor: >
    L1: optional (flash, Supervisor decides).
    L2: include (flash). L3: include (plus).
    Frugal mode: include (flash) for basic validation.
