  large_characters: 2500

# ══════════════════════════════════════════════════════════════════════
# Agent 执行顺序
# ══════════════════════════════════════════════════════════════════════

agent_order:
  - Supervisor
  - RepoScout
  - Researcher
  - Observer
  - InterfaceMapper
  - PromptEngineer
  - Coder
  - ArtifactProducer
  - Writer
  - Reviewer
  - Scribe
  - TesterAuditor
  - Verifier
  - Archivist

# ══════════════════════════════════════════════════════════════════════
# 路由配置 (更新 v2.0 — 集成项目体量)
# ══════════════════════════════════════════════════════════════════════

routes:

  # ── 显式多模态输入观察 ──────────────────────────────
  observation_task:
    size: L2
    description: 显式长文本、附件图片、视频、音频、PDF或文档的只读观察、总结、OCR、转录与提取
    analysis_only: true
    agents:
      - Supervisor
      - Observer

  # ── 本地确定性工作区扫描 ──────────────────────────────
  workspace_analysis_task:
    size: L2
    description: 本地工作区目录与 Git 元数据扫描，不调用模型、不虚构生产角色
    analysis_only: true
    agents:
      - Supervisor
      - RepoScout

  # ── L3 评估/审计项目 — 分析路线，不做源码实现 ─────────────────────
  evaluation_task:
    size: L3
    description: 系统评估/性能评估/架构审计/对比分析
    analysis_only: true
    agents:
      - Supervisor
      - RepoScout
      - Researcher
      - InterfaceMapper  # perception_interface_l3 → qwen3.7-max
      - TesterAuditor    # audit_tester_l3 → qwen3.6-plus
      - Verifier         # audit_verifier_l3 → qwen3.6-plus
      - Archivist        # archive_archivist_l3 → qwen3.6-plus

  # ── L1 轻量项目 ────────────────────────────────────────────────────
  small_task:
    size: L1
    description: 脚本修改/Bug修复/单文件调整
    agents:
      - Supervisor
      - Coder
      - TesterAuditor

  artifact_production_task:
    size: L2
    description: 文本/图片/视频/音频/表格/演示文稿/混合产物生成
    agents:
      - Supervisor
      - ArtifactProducer
      - TesterAuditor
      - Verifier
      - Archivist

  media_generation_task:
    size: L2
    description: 图像/视频生成与编辑路线，先生成媒体合同、后端选择、审批卡、生成台账和验收门
    agents:
      - Supervisor
      - ArtifactProducer
      - Observer
      - Reviewer
      - TesterAuditor
      - Verifier

  narrative_light_chapter:
    size: L1
    description: 长篇小说单章/续写/日更轻路径，只生成候选章节和最小连续性闭环
    agents:
      - Supervisor
      - Writer

  narrative_batch_chapters:
    size: L2
    description: 长篇小说多章节候选批次路径，生成批次计划、章节候选目录、批次连续性账本和交付回执
    agents:
      - Supervisor
      - Writer

  narrative_blueprint_build:
    size: L3
    description: 长篇小说前置蓝本路线，生成候选世界、人物、关系、因果、分卷章卡、独立评审与确定性状态投影
    agents:
      - Supervisor
      - Researcher
      - NarrativePlanner
      - Writer
      - Reviewer
      - Scribe

  article_light_draft:
    size: L1
    description: 普通文章/短文/说明文轻路径，生成正文和简单结构检查
    agents:
      - Supervisor
      - ArtifactProducer

  narrative_heavy_audit:
    size: L3
    description: 长篇小说阶段审计/验收/质量争议路径，审计已产出文本而不默认生成正文
    analysis_only: true
    agents:
      - Supervisor
      - Reviewer
      - Scribe
      - Verifier

  narrative_rewrite_plan:
    size: L3
    description: 阻断级小说审计后的逐章重写规划，只生成候选 chapter_state_plan，不生成正文
    analysis_only: true
    agents:
      - Supervisor
      - NarrativePlanner

  fiction_chapter_pipeline:
    size: L2
    status: legacy_compatibility
    default_selectable: false
    description: 兼容旧小说章节全流程路线；新任务默认使用 narrative_light_chapter 或 narrative_heavy_audit
    agents:
      - Supervisor
      - Writer
      - Reviewer
      - Scribe
      - Verifier
      - Archivist

  # ── L2 标准项目 — 基础版 (无接口/无外部资料需求) ──────────────────
  medium_task:
    size: L2
    description: 功能模块开发/跨文件实现
    agents:
      - Supervisor
      - RepoScout
      - Coder
      - TesterAuditor
      - Verifier
      - Archivist      # archive_archivist → qwen3.6-flash

  # ── L2 标准项目 — 接口敏感 ────────────────────────────────────────
  interface_sensitive_task:
    size: L2
    description: 涉及API/接口/契约变更
    agents:
      - Supervisor
      - RepoScout
      - InterfaceMapper  # perception_interface → qwen3.6-plus
      - Coder
      - TesterAuditor
      - Verifier
      - Archivist

  # ── L2 标准项目 — 外部资料敏感 ────────────────────────────────────
  research_sensitive_task:
    size: L2
    description: 需要搜索外部资料/文档/竞品
    agents:
      - Supervisor
      - Researcher       # perception_research → qwen3.6-flash
      - Coder
      - TesterAuditor
      # InterfaceMapper 按需
      - Verifier
      - Archivist

  # ── L3 重型项目 — 全流程 ──────────────────────────────────────────
  large_or_risky_task:
    size: L3
    description: 架构重构/多模块系统/安全关键 → 全流程所有Agent
    agents:
      - Supervisor
      - RepoScout
      - Researcher
      - InterfaceMapper
      - Coder
      - TesterAuditor
      - Verifier
      - Archivist        # archive_archivist_l3 → qwen3.6-plus

