approval_policy:
  policy_id: default-auto
  default_mode: auto
  require_approval_for_unknown_cli_cost: true
  require_approval_for_risky_capabilities: true
  require_approval_above_usd: 0.10
  risky_capabilities:
    - shell_execution
    - network_access
    - filesystem_write
    - external_execution
    - browser_fetch
  critical_capabilities:
    - secrets_access
    - private_path_access
    - destructive_shell
  forbidden_actions:
    - approval_bypass
    - evidence_tampering
    - secret_exposure
    - unbounded_destructive_operation
  human_required_actions:
    - public_release
    - production_promotion
    - git_push
    - merge
    - private_data_egress
    - public_network_bind
    - provider_route_change
    - budget_override
    - destructive_operation
    - subjective_acceptance
  default_expiry_minutes: 1440
