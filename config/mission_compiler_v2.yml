# Scale estimation heuristics
scale_heuristics:
  small:
    max_words: 500
    max_phases: 1
  medium:
    max_words: 2000
    max_phases: 3
  large:
    min_words: 2000
    min_phases: 3

# Default approval requirements
default_approvals:
  external_executor_needed: false
  human_approval_required: true

# Non-goal detection patterns (things that trigger warnings)
non_goal_patterns:
  - real platform post
  - auto post
  - auto publish
  - spam
  - fake engagement
  - scrape login
  - bypass paywall
  - bulk account
  - impersonate
  - steal content
  - pirate

# Hard constraint detection
constraint_patterns:
  - must not use
  - cannot use
  - forbidden
  - prohibited
  - must use
  - require
  - only use
  - must be
  - must run locally
  - offline only
  - no network
