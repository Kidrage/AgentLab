    display_name: Qwen Code Sealed Narrative Auditor
    model_profile: qwen3_6_flash_dashscope
    command: qwen
    invocation_style: sealed_packet_stdin
    packet_delivery: stdin
    structured_output: narrative_heavy_audit
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
