    required_placeholders: [task_packet_path, model_id]
    safe_probe: [hermes, auth, status, xai-oauth]
    forbidden_probes: [[hermes, status, --all]]
    expected_parse:
      argv_prefix: [hermes, chat, -Q, --provider, xai-oauth]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_auth_required: capacity_manager

  grok_media:
    worker_id: grok
    display_name: Hermes Grok OAuth Media Worker
    command: hermes
    invocation_style: media_backend_task_packet
    workflow_shell: true
    coalescing_allowed: false
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_backend: hermes
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
    template: >-
      hermes chat -Q --provider xai-oauth -m {model_id} -q "Read the AgentLab ArtifactProducer task packet at
      {task_packet_path}; execute only the media generation or media handoff
      work described there. Use the Hermes image-generation tool backed by a
      registered Grok Imagine model; a text response from Grok is not a media
      asset. Return generated artifact paths, sha256 receipts, prompt/parameters,
      references, settings-fetch/auth errors, and validation notes. Keep every
      artifact candidate-only and never approve its aesthetics yourself. Do not
      emit media_qc_report.yml, perform code edits, research, or longform prose
      writing; Observer, Reviewer, and Verifier own downstream acceptance."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe: [hermes, --help]
    expected_parse:
      argv_prefix: [hermes, chat, -Q, --provider, xai-oauth]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      auth_required_patterns:
        - "Settings fetch failed"
        - "auth"
        - "OAuth"
      network_failure_patterns:
        - "network"
        - "timeout"
    fallback:
      on_binary_missing: stop_and_report
      on_auth_required: local_oauth_session_unhealthy
      on_network_required: retry_with_required_region_or_vpn

  git:
    worker_id: git
    display_name: Git VCS
    command: git
    invocation_style: deterministic_tool
    template: 'git {args}'
    required_placeholders:
      - args
    safe_probe:
      - git
      - --version
    expected_parse:
      argv_prefix:
        - git
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: stop_and_report
