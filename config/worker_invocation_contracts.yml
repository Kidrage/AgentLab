    required_runtime_provider: codex-cli
    required_model_key: codex_gpt_5_6_sol_xhigh_cli_oauth
    display_name: Codex Native GPT Supervisor
    command: codex
    invocation_style: governed_supervisor_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    required_receipts:
      - role_session_receipt.yml
      - model_execution_chain_supervisor.yml
      - supervisor_plan.md
    template: >-
      codex exec --json --model "{model_id}" -c 'model_reasoning_effort="xhigh"'
      --sandbox read-only --ephemeral --ignore-rules --skip-git-repo-check -C "{workspace_path}"
      "Read the AgentLab Supervisor task packet at {task_packet_path}; own planning,
      decomposition, progress, recovery, and final synthesis only. Do not take over
      producer work or edit repository files. Return only the governed plan."
    required_placeholders:
      - workspace_path
      - task_packet_path
      - model_id
    requested_reasoning_label: extra
    resolved_reasoning_effort: xhigh
    safe_probe:
      - codex
      - --version
    expected_parse:
      argv_prefix:
        - codex
        - exec
        - --json
        - --model
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: capacity_manager

  codex:
