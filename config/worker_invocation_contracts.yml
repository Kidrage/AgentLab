# Configuration for local worker command invocation contracts
contracts:
  hermes:
    worker_id: hermes
    display_name: Hermes CLI
    command: hermes
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - collaboration_board_governance
    required_receipts:
      - role_session_receipt.yml
      - tool_or_mcp_usage_ledger.yml
      - artifact_manifest_or_findings.yml
    template: >-
      hermes --provider {provider} -m {model_id} -z "You are an AgentLab CLI executor.
      Read the JSON task packet at {task_packet_path},
      perform the requested AgentLab role work, and return a concise markdown report
      with findings, actions taken, verification, and blockers."
    required_placeholders:
      - task_packet_path
      - provider
      - model_id
    safe_probe:
      - hermes
      - --help
    expected_parse:
      argv_prefix:
        - hermes
        - --provider
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
      auth_required_patterns:
        - "API key"
        - "unauthorized"
        - "auth required"
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  hermes_alter_high:
    worker_id: hermes
    display_name: Hermes Alter Grok 4.5 High
    command: hermes
    invocation_style: governed_profile_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_profile: agentlabalter
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      hermes -p agentlabalter chat -Q --provider {provider} -m {model_id}
      --ignore-rules --max-turns 90 -q "You are an AgentLab CLI executor.
      Read the JSON task packet at {task_packet_path}, perform only the assigned
      AgentLab role work, and return a concise markdown report with findings,
      actions taken, verification, and blockers."
    required_placeholders: [task_packet_path, provider, model_id]
    required_shell_state:
      model.provider: xai-oauth
      model.default: grok-4.5
      agent.reasoning_effort: high
      fallback_providers: []
      fallback_model: null
    requested_reasoning_label: high
    resolved_reasoning_effort: high
    reasoning_resolution_note: >-
      The classic chat path loads the isolated agentlabalter profile so Grok 4.5
      receives high reasoning. Hermes one-shot mode does not bind profile
      reasoning state and is therefore not used by Alter roles.
    safe_probe: [hermes, -p, agentlabalter, config, check]
    expected_parse:
      argv_prefix: [hermes, -p, agentlabalter, chat, -Q, --provider, xai-oauth, -m, grok-4.5]
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report
      on_auth_required: capacity_manager

  hermes_alter_artifact:
    worker_id: hermes
    display_name: Hermes Alter Grok 4.5 High Artifact Producer
    command: hermes
    invocation_style: governed_profile_artifact_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_profile: agentlabalter
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
    template: >-
      hermes -p agentlabalter chat -Q --provider {provider} -m {model_id}
      --ignore-rules --max-turns 90 -q "Read the AgentLab ArtifactProducer task
      packet at {task_packet_path}; create only the requested text, spreadsheet,
      presentation, image, or video candidate artifacts. Use the registered
      Hermes generation tools when media generation is requested. Return
      artifact paths, sha256 receipts, parameters, validation notes, and any
      auth or settings errors. Never approve the candidate's quality yourself;
      Observer, Reviewer, and Verifier own downstream acceptance."
    required_placeholders: [task_packet_path, provider, model_id]
    required_shell_state:
      model.provider: xai-oauth
      model.default: grok-4.5
      agent.reasoning_effort: high
      fallback_providers: []
      fallback_model: null
    requested_reasoning_label: high
    resolved_reasoning_effort: high
    safe_probe: [hermes, -p, agentlabalter, config, check]
    expected_parse:
      argv_prefix: [hermes, -p, agentlabalter, chat, -Q, --provider, xai-oauth, -m, grok-4.5]
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report
      on_auth_required: capacity_manager

  hermes_supervisor:
    worker_id: hermes
    display_name: Legacy Hermes Supervisor (Codex OAuth, Non-Default)
    default_path: false
    command: hermes
    invocation_style: governed_supervisor_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    required_receipts:
      - role_session_receipt.yml
      - model_execution_chain_supervisor.yml
      - model_execution_receipt_supervisor_<route>_<attempt>.yml
      - supervisor_plan.md
    workflow_shell_profile: agentlabsupervisor
    template: >-
      hermes -p agentlabsupervisor chat -Q --provider {provider} -m {model_id} --ignore-rules --max-turns 6 -q "Read the AgentLab Supervisor task packet at
      {task_packet_path}; own planning, decomposition, progress, recovery, and
      final synthesis only. Do not take over producer work. Return the governed
      plan and receipt paths. AgentLab owns the model execution receipt from the
      verified command and isolated profile state."
    required_placeholders: [task_packet_path, provider, model_id]
    required_shell_state:
      model.provider: openai-codex
      model.default: gpt-5.6-sol
      agent.reasoning_effort: xhigh
      fallback_providers: []
      fallback_model: null
    requested_reasoning_label: extra
    resolved_reasoning_effort: xhigh
    reasoning_resolution_note: >-
      Hermes v0.17.0 exposes xhigh as its strongest supported reasoning setting.
      AgentLab maps the user-facing label extra to xhigh and must not claim ultra
      unless a future Hermes probe proves it. The classic chat query path is
      required because the one-shot -z path does not apply profile reasoning state.
      The role session must ignore ambient AGENTS/memory rules and cap tool turns so
      Supervisor cannot drift into repository onboarding instead of returning its plan.
    safe_probe: [hermes, auth, status, openai-codex]
    forbidden_probes: [[hermes, status, --all]]
    expected_parse:
      argv_prefix: [hermes, -p, agentlabsupervisor, chat, -Q, --provider, openai-codex, -m]
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_auth_required: capacity_manager

  claude:
    worker_id: claude_code
    display_name: Claude Code
    command: claude
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - native_subagent_orchestration
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      claude --model "{model_id}" --safe-mode --no-session-persistence
      --permission-mode bypassPermissions --output-format json -p "Read the task packet at {task_packet_path};
      perform only the assigned work and report actual changed files and validation."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe:
      - claude
      - --help
    expected_parse:
      argv_prefix:
        - claude
        - --model
        - --safe-mode
        - --no-session-persistence
        - --permission-mode
        - bypassPermissions
        - --output-format
        - json
        - -p
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  claude_writer:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Writer
    command: claude
    invocation_style: sealed_packet_stdin
    packet_delivery: stdin
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - outbound_context_manifest_writer.yml
      - model_execution_chain_writer.yml
      - model_execution_receipt_writer_<route>_<attempt>.yml
      - narrative_delivery_receipt.yml
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 1.00
      --permission-mode bypassPermissions --output-format json --tools "" -p "Treat the
      complete sealed AgentLab Writer packet on stdin as the only task context.
      Follow its messages in order and act as a pure Writer: produce high-quality
      final Chinese prose while preserving voice, POV, continuity, and length
      constraints. Enforce fact_invention_policy literally: facts absent from
      sealed evidence remain unknown, and only transient scene texture may be
      invented. Do not browse, read workspace files, edit source files, plan
      other roles, or invoke subagents. Return only the required candidate output
      envelopes. AgentLab owns the model execution receipt and derives observed
      provider/model/session/usage fields from Claude's JSON envelope."
    required_placeholders: [model_id]
    safe_probe: [claude, --help]
    max_budget_usd: 1.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  agy_writer:
    worker_id: agy
    display_name: Agy Gemini OAuth Writer
    command: agy
    invocation_style: bounded_writer_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - outbound_context_manifest_writer.yml
      - model_execution_chain_writer.yml
      - model_execution_receipt_writer_<route>_<attempt>.yml
      - narrative_delivery_receipt.yml
    template: >-
      agy --sandbox --model "{model_id}" -p "Treat the complete sealed
      AgentLab Writer packet at {task_packet_path} as the only task context. Read
      that packet before writing, follow its
      messages in order and act only as the prose Writer. Produce high-quality
      final Chinese candidate prose while preserving voice, POV, continuity,
      and length constraints. Do not browse, scan the workspace, edit source
      files, invoke tools, or delegate. Return only the required AGENTLAB_EDIT
      candidate output envelopes."
    required_placeholders: [task_packet_path, model_id]
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: capacity_manager
      on_quota_exhausted: capacity_manager

  claude_narrative_planner:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Narrative Rewrite Planner
    command: claude
    invocation_style: sealed_narrative_rewrite_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - outbound_context_manifest_narrativeplanner.yml
      - model_execution_chain_narrativeplanner.yml
      - model_execution_receipt_narrativeplanner_<route>_<attempt>.yml
      - chapter_state_plan.yml
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 2.00
      --permission-mode plan --output-format json --tools "" -p "Read only the
      sealed AgentLab NarrativePlanner packet at {task_packet_path}. Convert the
      blocking heavy-audit evidence into one coherent candidate chapter state
      plan. Do not browse, scan, invoke subagents, write prose, edit production,
      promote facts, or change project memory. Return raw YAML for
      chapter_state_plan.yml only. AgentLab owns receipts and validation."
    required_placeholders: [task_packet_path, model_id]
    safe_probe: [claude, --help]
    max_budget_usd: 2.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: stop_and_report

  claude_narrative_audit:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Sealed Narrative Audit Role
    command: claude
    invocation_style: sealed_packet_stdin
    packet_delivery: stdin
    structured_output: narrative_heavy_audit
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - outbound_context_manifest_reviewer.yml
      - model_execution_chain_reviewer.yml
      - model_execution_receipt_reviewer_<route>_<attempt>.yml
      - narrative_heavy_audit_output_contract.yml
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 3.00
      --permission-mode bypassPermissions --output-format json --tools ""
      --json-schema '{narrative_audit_schema}' -p "Treat the complete sealed
      AgentLab narrative-audit role packet on stdin as the only task context.
      Perform only the role assigned by that packet. When assigned Reviewer,
      audit every requested chapter against its exact evidence and continuity contracts.
      Treat any persistent fact absent from sealed evidence as a blocking
      continuity failure, including invented backstory, institutions, taxes,
      laws, supernatural classifications, exact rule counts, debts, caches,
      resources, relationships, or offscreen history. Enforce each
      fact_invention_policy, forbidden_facts, character_intent_gate, hook
      contract, POV boundary, dialogue quotation, paragraph rhythm, and target
      length; do not reward plausible but unsupported lore.
      Do not browse, read workspace files, edit files, draft replacement prose,
      perform another role, or invoke subagents. Return exactly the structured JSON
      required by the enforced schema. AgentLab alone serializes and validates
      the candidate-only audit files."
    required_placeholders: [model_id, narrative_audit_schema]
    safe_probe: [claude, --help]
    max_budget_usd: 3.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: stop_and_report

  claude_supervisor_fallback:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Supervisor Capacity Fallback
    command: claude
    invocation_style: bounded_supervisor_fallback_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
      - model_execution_chain_supervisor.yml
      - model_execution_receipt_supervisor_<route>_<attempt>.yml
      - supervisor_plan.md
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 1.00
      --permission-mode plan --output-format json --tools "" -p "Read only the
      bounded AgentLab Supervisor packet at {task_packet_path}. This route is an
      explicitly approved same-role capacity fallback. Plan, decompose, recover,
      and synthesize; do not perform producer work, invoke subagents, browse,
      mutate files, or write final prose. Return the Supervisor plan plus the
      governed plan only. AgentLab owns the model execution receipt and derives
      observed provider/model/session/usage fields from Claude's JSON envelope."
    required_placeholders: [task_packet_path, model_id]
    max_budget_usd: 1.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  claude_writer_ultracode:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Writer Developmental Ultracode
    command: claude
    invocation_style: sealed_writer_developmental_workflow
    workflow_shell: true
    coalescing_allowed: false
    opt_in_only: true
    requires_task_packet:
      ultracode_opt_in: true
      writer_mode: developmental_ultracode
      work_type: one_of_allowed_work
    allowed_work: [developmental_edit, structure, continuity, revision_plan]
    forbidden_work: [final_prose_draft]
    environment:
      unset: [CLAUDE_CODE_EFFORT_LEVEL]
    required_receipts:
      - ultracode_activation_receipt.yml
      - model_execution_chain_writer.yml
      - model_execution_receipt_writer_<route>_<attempt>.yml
      - revision_plan.yml
    template: >-
      claude --model "{model_id}" --max-budget-usd 2.00 --permission-mode plan
      --output-format json -p "Read only the sealed AgentLab Writer packet at
      {task_packet_path}. The packet explicitly authorizes the Claude Code
      ultracode workflow for developmental editing, structure, continuity, or
      revision planning. Activate ultracode only if the installed shell exposes
      it, use bounded subagents, and return a revision plan and activation
      receipt. Never draft or approve final prose in this mode."
    required_placeholders: [task_packet_path, model_id]
    max_budget_usd: 2.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_capability_missing: stop_and_report

