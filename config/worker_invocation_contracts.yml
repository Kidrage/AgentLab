      files, or approve your own observations. Use exactly the selected Agy
      OAuth model. Do not use GEMINI_API_KEY or any API-key fallback."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, --model]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  agy_visual_reviewer:
