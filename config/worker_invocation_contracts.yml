# Configuration for local worker command invocation contracts
contracts:
  hermes:
    worker_id: hermes
    display_name: Hermes CLI
    command: hermes
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - collaboration_board_governance
    required_receipts:
      - role_session_receipt.yml
      - tool_or_mcp_usage_ledger.yml
      - artifact_manifest_or_findings.yml
    template: >-
      hermes --provider {provider} -m {model_id} -z "You are an AgentLab CLI executor.
      Read the JSON task packet at {task_packet_path},
      perform the requested AgentLab role work, and return a concise markdown report
      with findings, actions taken, verification, and blockers."
    required_placeholders:
      - task_packet_path
      - provider
      - model_id
    safe_probe:
      - hermes
      - --help
    expected_parse:
      argv_prefix:
        - hermes
        - --provider
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
      auth_required_patterns:
        - "API key"
        - "unauthorized"
        - "auth required"
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  claude:
    worker_id: claude_code
    display_name: Claude Code
    command: claude
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - native_subagent_orchestration
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      claude --permission-mode bypassPermissions --output-format json -p "Read the task packet at {task_packet_path};
      perform only the assigned work and report actual changed files and validation."
    required_placeholders:
      - task_packet_path
    safe_probe:
      - claude
      - --help
    expected_parse:
      argv_prefix:
        - claude
        - --permission-mode
        - bypassPermissions
        - --output-format
        - json
        - -p
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  bl:
    worker_id: bl
    display_name: Bailian CLI
    command: bl
    invocation_style: one_shot_prompt
    template: 'bl text chat --message "{prompt}"'
    required_placeholders:
      - prompt
    safe_probe:
      - bl
      - --help
    expected_parse:
      argv_prefix:
        - bl
        - text
        - chat
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  aider:
    worker_id: aider
    display_name: Aider
    command: aider
    invocation_style: one_shot_prompt
    template: 'aider --message "{prompt}"'
    required_placeholders:
      - prompt
    safe_probe:
      - aider
      - --help
    expected_parse:
      argv_prefix:
        - aider
        - --message
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  codex:
    worker_id: codex
    display_name: Codex Code
    command: codex
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - permission_and_sandbox_control
      - workspace_context_control
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      codex exec --json -C "{workspace_path}" "Read the task packet at
      {task_packet_path}; perform only the assigned work and report actual changes."
    required_placeholders:
      - workspace_path
      - task_packet_path
    safe_probe:
      - codex
      - --help
    expected_parse:
      argv_prefix:
        - codex
        - exec
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  openclaw:
    worker_id: openclaw
    display_name: OpenClaw Operator
    command: openclaw
    invocation_style: one_shot_prompt
    template: 'openclaw agent --agent "{frontdesk_agent_id}" --message "{prompt}"'
    required_placeholders:
      - frontdesk_agent_id
      - prompt
    safe_probe:
      - openclaw
      - --help
    expected_parse:
      argv_prefix:
        - openclaw
        - agent
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  qwen:
    worker_id: qwen
    display_name: Qwen Code
    command: qwen
    invocation_style: task_packet_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - permission_and_sandbox_control
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - structured_findings_or_artifacts.yml
    template: >-
      qwen --bare --approval-mode default --output-format json "Read the task packet at
      {task_packet_path}; perform only the assigned role and report actual changes."
    required_placeholders:
      - task_packet_path
    safe_probe: [qwen, --help]
    expected_parse:
      argv_prefix: [qwen, --bare]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  gemini:
    worker_id: gemini
    display_name: Gemini API CLI (explicit fallback)
    command: gemini
    invocation_style: task_packet_prompt
    template: >-
      gemini --approval-mode plan --model gemini-2.5-flash-high --prompt "Read the
      AgentLab task packet at {task_packet_path}; perform only low-risk rough
      work such as summarization, first-pass classification, redundant log
      scanning, candidate checklist generation, or disposable draft analysis.
      This is the explicit Gemini API-key fallback path, not the default Gemini
      path. Do not edit files or execute commands. Return concise findings,
      confidence, and escalation points."
    required_placeholders:
      - task_packet_path
    safe_probe: [gemini, --help]
    expected_parse:
      argv_prefix: [gemini, --approval-mode, plan]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  agy:
    worker_id: agy
    display_name: Antigravity CLI Frontdesk (Gemini OAuth)
    command: agy
    invocation_style: frontdesk_session_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - skills_plugins_and_bundles
      - workspace_context_control
      - permission_and_sandbox_control
    required_receipts:
      - frontdesk_session_receipt.yml
    template: >-
      agy --sandbox --model gemini-3.5-flash-high -p "Read the AgentLab frontdesk session packet at
      '{frontdesk_session_path}'; act only as the user-facing AgentLab frontdesk."
    required_placeholders:
      - frontdesk_session_path
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, --model, gemini-3.5-flash-high, -p]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  agy_coder:
    worker_id: agy
    display_name: Antigravity CLI Worker (Gemini OAuth)
    command: agy
    invocation_style: task_packet_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - skills_plugins_and_bundles
      - workspace_context_control
      - permission_and_sandbox_control
    required_receipts:
      - role_session_receipt.yml
      - generated_or_changed_artifacts.yml
    template: >-
      agy --sandbox --model {model_id} -p "Read the AgentLab task packet at
      {task_packet_path}; perform only the assigned AgentLab role.
      Use the local Agy Gemini OAuth path as the default Gemini runtime
      (gemini-3.5-flash-high). Do not use GEMINI_API_KEY or the Gemini API
      free-tier path unless the task packet explicitly authorizes that fallback.
      If the OAuth session or regional network path is blocked, stop and report
      oauth_session_or_region_blocked. Report all changed files, executed
      commands, and validation results. Your output will be reviewed by the
      assigned AgentLab audit role."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, --model]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  agy_writer:
    worker_id: agy
    display_name: Antigravity Sealed Writer (Gemini OAuth)
    command: agy
    invocation_style: sealed_task_packet_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - workspace_context_control
      - permission_and_sandbox_control
    required_receipts:
      - outbound_context_manifest_writer.yml
      - narrative_delivery_receipt.yml
    template: >-
      agy --sandbox --model {model_id} -p "Read only the sealed AgentLab Writer packet at
      {task_packet_path}. Use only its embedded messages; do not read any other
      file, run shell commands, browse, or scan the repository. Return only the
      required candidate AGENTLAB_EDIT blocks on stdout. Use the local Agy
      Gemini OAuth runtime (gemini-3.5-flash-high); do not use GEMINI_API_KEY or
      the Gemini API free-tier fallback."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, --model]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  grok:
    worker_id: grok
    display_name: Hermes Grok OAuth Media Worker
    command: hermes
    invocation_style: media_backend_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_backend: hermes
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - generation_ledger.yml
      - media_qc_report.yml
    template: >-
      hermes --ignore-rules --provider xai-oauth -m grok-build-0.1 -z "Read the AgentLab ArtifactProducer task packet at
      {task_packet_path}; execute only the media generation or media handoff
      work described there. Use the Hermes xAI OAuth Grok session. Return a concise
      report with generated artifact paths, settings-fetch/auth errors, and
      validation notes. Do not perform code edits or longform prose writing."
    required_placeholders:
      - task_packet_path
    safe_probe: [hermes, --help]
    expected_parse:
      argv_prefix: [hermes, --ignore-rules, --provider, xai-oauth]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      auth_required_patterns:
        - "Settings fetch failed"
        - "auth"
        - "OAuth"
      network_failure_patterns:
        - "network"
        - "timeout"
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_auth_required: local_oauth_session_unhealthy
      on_network_required: retry_with_required_region_or_vpn

  git:
    worker_id: git
    display_name: Git VCS
    command: git
    invocation_style: deterministic_tool
    template: 'git {args}'
    required_placeholders:
      - args
    safe_probe:
      - git
      - --version
    expected_parse:
      argv_prefix:
        - git
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
