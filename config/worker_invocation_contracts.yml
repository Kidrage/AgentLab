  grok_research:
    worker_id: grok
    display_name: Hermes Grok OAuth Research Worker
    command: hermes
    invocation_style: sourced_research_task_packet
    workflow_shell: true
    coalescing_allowed: false
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_backend: hermes
    required_receipts:
      - outbound_context_manifest_researcher.yml
      - 03_research_notes.md
      - model_execution_chain_researcher.yml
