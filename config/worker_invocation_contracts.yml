# Configuration for local worker command invocation contracts
contracts:
  hermes:
    worker_id: hermes
    display_name: Hermes CLI
    command: hermes
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - collaboration_board_governance
    required_receipts:
      - role_session_receipt.yml
      - tool_or_mcp_usage_ledger.yml
      - artifact_manifest_or_findings.yml
    template: >-
      hermes chat -Q --provider {provider} -m {model_id} -q "You are an AgentLab CLI executor.
      Read the JSON task packet at {task_packet_path},
      perform the requested AgentLab role work, and return a concise markdown report
      with findings, actions taken, verification, and blockers."
    required_placeholders:
      - task_packet_path
      - provider
      - model_id
    safe_probe:
      - hermes
      - --help
    expected_parse:
      argv_prefix:
        - hermes
        - chat
        - -Q
        - --provider
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
      auth_required_patterns:
        - "API key"
        - "unauthorized"
        - "auth required"
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  hermes_supervisor:
    worker_id: hermes
    display_name: Hermes Supervisor (Codex OAuth)
    command: hermes
    invocation_style: governed_supervisor_task_packet
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    required_receipts:
      - role_session_receipt.yml
      - model_execution_chain_supervisor.yml
      - model_execution_receipt_supervisor_<route>_<attempt>.yml
      - supervisor_plan.md
    workflow_shell_profile: agentlabsupervisor
    template: >-
      hermes -p agentlabsupervisor chat -Q --provider {provider} -m {model_id} -q "Read the AgentLab Supervisor task packet at
      {task_packet_path}; own planning, decomposition, progress, recovery, and
      final synthesis only. Do not take over producer work. Return the governed
      plan and receipt paths. AgentLab owns the model execution receipt from the
      verified command and isolated profile state."
    required_placeholders: [task_packet_path, provider, model_id]
    required_shell_state:
      model.provider: openai-codex
      model.default: gpt-5.5
      agent.reasoning_effort: high
      fallback_providers: []
      fallback_model: null
    requested_reasoning_label: high
    resolved_reasoning_effort: high
    reasoning_resolution_note: >-
      The operator-approved full matrix binds Supervisor to GPT-5.5 high. The
      classic chat query path is required because production bypass/YOLO paths are forbidden and do not
      provide a governed profile or receipt boundary.
    safe_probe: [hermes, auth, status, openai-codex]
    forbidden_probes: [[hermes, status, --all]]
    expected_parse:
      argv_prefix: [hermes, -p, agentlabsupervisor, chat, -Q, --provider, openai-codex, -m]
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_auth_required: capacity_manager

  claude:
    worker_id: claude_code
    display_name: Claude Code
    command: claude
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - session_and_checkpoint_reuse
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - structured_output_and_qc
      - native_command_surface_inventory
      - native_subagent_orchestration
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      claude --model "{model_id}" --permission-mode auto --output-format json -p "Read the task packet at {task_packet_path};
      perform only the assigned work and report actual changed files and validation."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe:
      - claude
      - --help
    expected_parse:
      argv_prefix:
        - claude
        - --model
        - --permission-mode
        - auto
        - --output-format
        - json
        - -p
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  claude_longform_governance:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Long-form Governance
    command: claude
    invocation_style: read_only_longform_governance_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
      - returned_role_artifact
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 1.00
      --permission-mode plan --output-format json -p "Read the governed
      long-form task packet at {task_packet_path} and inspect only its assigned
      evidence. Return the requested review, ledger, or revision proposal in
      the response. Do not edit candidate or production text, apply a rewrite,
      promote an artifact, invoke subagents, or broaden scope."
    required_placeholders: [task_packet_path, model_id]
    safe_probe: [claude, --help]
    max_budget_usd: 1.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  claude_writer:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Writer
    command: claude
    invocation_style: sealed_writer_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - outbound_context_manifest_writer.yml
      - model_execution_chain_writer.yml
      - model_execution_receipt_writer_<route>_<attempt>.yml
      - narrative_delivery_receipt.yml
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 1.00
      --permission-mode plan --output-format json --tools "" -p "Read only the
      sealed AgentLab Writer packet at {task_packet_path}. Act as a pure Writer:
      produce high-quality final Chinese prose while preserving voice, POV,
      continuity, and length constraints. Do not browse, edit source files,
      plan other roles, or invoke subagents. Return only the required candidate
      output envelopes. AgentLab owns the model execution receipt and derives
      observed provider/model/session/usage fields from Claude's JSON envelope."
    required_placeholders: [task_packet_path, model_id]
    safe_probe: [claude, --help]
    max_budget_usd: 1.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  claude_supervisor_fallback:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Supervisor Capacity Fallback
    command: claude
    invocation_style: bounded_supervisor_fallback_task_packet
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
      - model_execution_chain_supervisor.yml
      - model_execution_receipt_supervisor_<route>_<attempt>.yml
      - supervisor_plan.md
    template: >-
      claude --model "{model_id}" --effort max --max-budget-usd 1.00
      --permission-mode plan --output-format json --tools "" -p "Read only the
      bounded AgentLab Supervisor packet at {task_packet_path}. This route is an
      explicitly approved same-role capacity fallback. Plan, decompose, recover,
      and synthesize; do not perform producer work, invoke subagents, browse,
      mutate files, or write final prose. Return the Supervisor plan plus the
      governed plan only. AgentLab owns the model execution receipt and derives
      observed provider/model/session/usage fields from Claude's JSON envelope."
    required_placeholders: [task_packet_path, model_id]
    max_budget_usd: 1.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  claude_writer_ultracode:
    worker_id: claude_code
    display_name: Claude Shell DeepSeek Writer Developmental Ultracode
    command: claude
    invocation_style: sealed_writer_developmental_workflow
    workflow_shell: true
    coalescing_allowed: false
    opt_in_only: true
    requires_task_packet:
      ultracode_opt_in: true
      writer_mode: developmental_ultracode
      work_type: one_of_allowed_work
    allowed_work: [developmental_edit, structure, continuity, revision_plan]
    forbidden_work: [final_prose_draft]
    environment:
      unset: [CLAUDE_CODE_EFFORT_LEVEL]
    required_receipts:
      - ultracode_activation_receipt.yml
      - model_execution_chain_writer.yml
      - model_execution_receipt_writer_<route>_<attempt>.yml
      - revision_plan.yml
    template: >-
      claude --model "{model_id}" --max-budget-usd 2.00 --permission-mode plan
      --output-format json -p "Read only the sealed AgentLab Writer packet at
      {task_packet_path}. The packet explicitly authorizes the Claude Code
      ultracode workflow for developmental editing, structure, continuity, or
      revision planning. Activate ultracode only if the installed shell exposes
      it, use bounded subagents, and return a revision plan and activation
      receipt. Never draft or approve final prose in this mode."
    required_placeholders: [task_packet_path, model_id]
    max_budget_usd: 2.00
    output_parser: claude_json
    expected_parse:
      argv_prefix: [claude, --model]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_capability_missing: stop_and_report

  bl:
    worker_id: bl
    display_name: Bailian CLI
    command: bl
    invocation_style: one_shot_prompt
    template: 'bl text chat --message "{prompt}"'
    required_placeholders:
