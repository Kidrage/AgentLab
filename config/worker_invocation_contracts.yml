# Configuration for local worker command invocation contracts
contracts:
  hermes:
    worker_id: hermes
    display_name: Hermes CLI
    command: hermes
    invocation_style: one_shot_prompt
    template: >-
      hermes -z "You are an AgentLab CLI executor. Read the JSON task packet at {task_packet_path},
      perform the requested AgentLab role work, and return a concise markdown report
      with findings, actions taken, verification, and blockers."
    required_placeholders:
      - task_packet_path
    safe_probe:
      - hermes
      - --help
    expected_parse:
      argv_prefix:
        - hermes
        - -z
    validation:
      shlex_parse_required: true
      require_existing_binary: false
      allow_shell: false
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
      auth_required_patterns:
        - "API key"
        - "unauthorized"
        - "auth required"
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  claude:
    worker_id: claude_code
    display_name: Claude Code
    command: claude
    invocation_style: one_shot_prompt
    template: >-
      claude --output-format json -p "Read the task packet at {task_packet_path};
      perform only the assigned work and report actual changed files and validation."
    required_placeholders:
      - task_packet_path
    safe_probe:
      - claude
      - --help
    expected_parse:
      argv_prefix:
        - claude
        - --output-format
        - json
        - -p
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    error_classification:
      invalid_exit_codes:
        - 2
      invalid_invocation_patterns:
        - "usage:"
        - "unrecognized arguments"
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  bl:
    worker_id: bl
    display_name: Bailian CLI
    command: bl
    invocation_style: one_shot_prompt
    template: 'bl text chat --message "{prompt}"'
    required_placeholders:
      - prompt
    safe_probe:
      - bl
      - --help
    expected_parse:
      argv_prefix:
        - bl
        - text
        - chat
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
      on_invalid_invocation: direct_api

  aider:
    worker_id: aider
    display_name: Aider
    command: aider
    invocation_style: one_shot_prompt
    template: 'aider --message "{prompt}"'
    required_placeholders:
      - prompt
    safe_probe:
      - aider
      - --help
    expected_parse:
      argv_prefix:
        - aider
        - --message
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  codex:
    worker_id: codex
    display_name: Codex Code
    command: codex
    invocation_style: one_shot_prompt
    template: >-
      codex exec --json -C "{workspace_path}" "Read the task packet at
      {task_packet_path}; perform only the assigned work and report actual changes."
    required_placeholders:
      - workspace_path
      - task_packet_path
    safe_probe:
      - codex
      - --help
    expected_parse:
      argv_prefix:
        - codex
        - exec
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  openclaw:
    worker_id: openclaw
    display_name: OpenClaw Operator
    command: openclaw
    invocation_style: one_shot_prompt
    template: 'openclaw agent --agent "{frontdesk_agent_id}" --message "{prompt}"'
    required_placeholders:
      - frontdesk_agent_id
      - prompt
    safe_probe:
      - openclaw
      - --help
    expected_parse:
      argv_prefix:
        - openclaw
        - agent
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api

  qwen:
    worker_id: qwen
    display_name: Qwen Code
    command: qwen
    invocation_style: task_packet_prompt
    template: >-
      qwen --bare --approval-mode default --output-format json "Read the task packet at
      {task_packet_path}; perform only the assigned role and report actual changes."
    required_placeholders:
      - task_packet_path
    safe_probe: [qwen, --help]
    expected_parse:
      argv_prefix: [qwen, --bare]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  agy:
    worker_id: agy
    display_name: Antigravity CLI Frontdesk
    command: agy
    invocation_style: frontdesk_session_prompt
    template: >-
      agy --sandbox -p "Read the AgentLab frontdesk session packet at
      '{frontdesk_session_path}'; act only as the user-facing AgentLab frontdesk."
    required_placeholders:
      - frontdesk_session_path
    safe_probe: [agy, --help]
    expected_parse:
      argv_prefix: [agy, --sandbox, -p]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  git:
    worker_id: git
    display_name: Git VCS
    command: git
    invocation_style: deterministic_tool
    template: 'git {args}'
    required_placeholders:
      - args
    safe_probe:
      - git
      - --version
    expected_parse:
      argv_prefix:
        - git
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: alternate_worker_or_direct_api
