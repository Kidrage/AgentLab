  claude_seedance_artifact_fallback:
    worker_id: claude_ark
    display_name: Claude + Ark Seedance Skill Fallback Artifact Producer
    command: claude
    invocation_style: sealed_media_request
    workflow_shell: true
    coalescing_allowed: false
    fallback_only: true
    fallback_from: [hermes_ark_artifact_producer]
    required_receipts:
      - outbound_context_manifest_media.yml
      - role_session_receipt.yml
      - generation_ledger.yml
      - generation_receipt.yml
      - generated_assets_manifest.yml
    template: >-
      claude --no-session-persistence --permission-mode bypassPermissions
      --output-format json --tools Skill,Bash -p "Use the repository Skill
      byted-ark-seedance-skill for exactly one sealed AgentLab ArtifactProducer
      request. Let the Skill wrapper select the Seedance model; do not pass --model
      and do not call ArkCLI +gen directly. Invoke it with --wait true, set
      ARK_SEEDANCE_SAVE_PATH to request.output_dir, do not edit source or production
      files, and return compact JSON. AGENTLAB_MEDIA_REQUEST={media_request_json}"
    required_placeholders: [media_request_json]
    safe_probe: [claude, --help]
    expected_parse:
      argv_prefix: [claude, --no-session-persistence, --permission-mode, bypassPermissions]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_worker_timeout: stop_and_report
      on_worker_error: stop_and_report

  git:
    worker_id: git
    display_name: Git VCS
    command: git
    invocation_style: deterministic_tool
    template: 'git {args}'
    required_placeholders:
      - args
    safe_probe:
      - git
      - --version
    expected_parse:
      argv_prefix:
        - git
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: stop_and_report
