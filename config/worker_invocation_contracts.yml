  codex:
    worker_id: codex
    display_name: Codex Code
    command: codex
    invocation_style: one_shot_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - permission_and_sandbox_control
      - workspace_context_control
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - changed_files_or_findings.yml
      - validation_evidence.yml
    template: >-
      codex exec --json --model "{model_id}" -C "{workspace_path}" "Read the task packet at
      {task_packet_path}; perform only the assigned work and report actual changes."
    required_placeholders:
      - workspace_path
      - task_packet_path
      - model_id
    safe_probe:
      - codex
      - --help
    expected_parse:
      argv_prefix:
        - codex
        - exec
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  openclaw:
    worker_id: openclaw
    display_name: OpenClaw Operator
    command: openclaw
    invocation_style: one_shot_prompt
    template: 'openclaw agent --agent "{frontdesk_agent_id}" --message "{prompt}"'
    required_placeholders:
      - frontdesk_agent_id
      - prompt
    safe_probe:
      - openclaw
      - --help
    expected_parse:
      argv_prefix:
        - openclaw
        - agent
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: stop_and_report

  qwen:
    worker_id: qwen
    display_name: Qwen Code
    command: qwen
    invocation_style: task_packet_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
      - one_shot_role_execution
      - tool_and_mcp_governance
      - skills_plugins_and_bundles
      - worktree_or_background_execution
      - permission_and_sandbox_control
      - structured_output_and_qc
    required_receipts:
      - role_session_receipt.yml
      - structured_findings_or_artifacts.yml
    template: >-
      qwen --bare --model "{model_id}" --approval-mode default --output-format json "Read the task packet at
      {task_packet_path}; perform only the assigned role and report actual changes."
    required_placeholders:
      - task_packet_path
      - model_id
    safe_probe: [qwen, --help]
    expected_parse:
      argv_prefix: [qwen, --bare]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report

  qwen_artifact:
    worker_id: qwen
    display_name: Qwen Code Bounded Artifact Producer
    command: qwen
    invocation_style: isolated_artifact_task_packet
    workflow_shell: true
    coalescing_allowed: false
    environment:
      api_key_source: DASHSCOPE_API_KEY
      api_key_target: OPENAI_API_KEY
      base_url_target: OPENAI_BASE_URL
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    required_receipts:
      - model_execution_chain_artifactproducer.yml
      - model_execution_receipt_artifactproducer_<route>_<attempt>.yml
      - artifact_task.yml
      - artifact_materialization_receipt.yml
    template: >-
      qwen --bare --auth-type openai --openai-base-url
      "https://dashscope.aliyuncs.com/compatible-mode/v1" --model "{model_id}"
      --sandbox --approval-mode default --output-format json --max-wall-time 10m
      --max-tool-calls 50 "Read only the bounded ArtifactTask packet at
      {task_packet_path}. Work only inside this isolated workspace. Create every
      exact required output path declared by the packet, validate each artifact,
      and return a concise report. Do not read any unlisted host path, use network
      tools beyond the selected model provider, or claim an artifact that does not
      exist. AgentLab copies only declared outputs and owns all runtime receipts."
    required_placeholders: [task_packet_path, model_id]
    safe_probe: [qwen, --help]
    output_parser: qwen_json
    expected_parse:
      argv_prefix: [qwen, --bare, --auth-type, openai]
    validation:
      shlex_parse_required: true
      allow_shell: false
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_quota_exhausted: capacity_manager

  gemini:
    worker_id: gemini
    display_name: Gemini API CLI (explicit fallback)
    command: gemini
    invocation_style: task_packet_prompt
    template: >-
      gemini --approval-mode plan --model gemini-2.5-flash-high --prompt "Read the
      AgentLab task packet at {task_packet_path}; perform only low-risk rough
      work such as summarization, first-pass classification, redundant log
      scanning, candidate checklist generation, or disposable draft analysis.
      This is the explicit Gemini API-key fallback path, not the default Gemini
      path. Do not edit files or execute commands. Return concise findings,
      confidence, and escalation points."
    required_placeholders:
      - task_packet_path
    safe_probe: [gemini, --help]
    expected_parse:
      argv_prefix: [gemini, --approval-mode, plan]
    validation:
      shlex_parse_required: true
      allow_unquoted_placeholders: true
    fallback:
      on_binary_missing: stop_and_report
      on_invalid_invocation: stop_and_report

  agy:
    worker_id: agy
    display_name: Antigravity CLI Frontdesk (Gemini OAuth)
    command: agy
    invocation_style: frontdesk_session_prompt
    workflow_shell: true
    workflow_shell_registry: config/cli_workflow_shells.yml
    workflow_shell_capability_families:
