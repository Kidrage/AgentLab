  qwen_narrative_audit:
    worker_id: qwen
    display_name: Qwen Code Sealed Narrative Auditor
    model_profile: qwen3_6_flash_dashscope
    command: qwen
    invocation_style: sealed_packet_stdin
    packet_delivery: stdin
    structured_output: narrative_heavy_audit
    workflow_shell: true
    coalescing_allowed: false
    required_receipts:
      - role_session_receipt.yml
      - narrative_heavy_audit_output_contract.yml
    environment:
      api_key_source: DASHSCOPE_API_KEY
      api_key_target: OPENAI_API_KEY
      base_url_target: OPENAI_BASE_URL
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    template: >-
      qwen --bare --auth-type openai --openai-base-url
      "https://dashscope.aliyuncs.com/compatible-mode/v1" --model "{model_id}"
      --approval-mode default --max-session-turns 6 --max-wall-time 9m
      --exclude-tools
      edit,write_file,read_file,grep_search,glob,run_shell_command,todo_write,save_memory,agent,skill,exit_plan_mode,enter_plan_mode,web_fetch,list_directory,lsp,ask_user_question,cron_create,cron_list,cron_delete,loop_wakeup,task_stop,task_create,task_update,task_list,team_create,team_delete,send_message,monitor,notebook_edit,tool_search,enter_worktree,exit_worktree,workflow,artifact
      --max-tool-calls 1 --json-schema
      @narrative_heavy_audit_output.schema.json --output-format stream-json -p "Treat
      the complete AgentLab
      sealed role-session packet on stdin as the only task context. Do not call
      workspace tools. Return exactly the enforced structured-output JSON object;
      never JSON-encode an object or array into a string. When blocking continuity
      exists, keep rewrite_required true and proposals non-empty. AgentLab serializes
      the accepted object to candidate YAML. Reviewer must populate both
      fiction_review and continuity_failure_report in one structured call; never call
      write_file."
    required_placeholders:
      - model_id
    safe_probe: [qwen, --help]
    expected_parse:
      argv_prefix: [qwen, --bare]
    validation:
      shlex_parse_required: true
    fallback:
      on_binary_missing: stop_and_report

