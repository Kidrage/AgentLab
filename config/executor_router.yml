executor_router:
  enabled: true
  default_mode: policy_auto
  authority:
    purpose: task_level_external_executor_routing
    runtime_agent_backend_source: config/agent_model_profiles.yml
    may_override_agent_backend: false
    notes:
      - This router is for external/manual/mock task execution requests.
      - It does not select Supervisor/RepoScout/Coder/etc. default backends.
      - Agent role backend selection lives in agent_model_profiles.yml.

  routing:
    require_approval_for_external: true
    require_review_for_all_external_results: true
    prefer_manual_handoff_until_approved: false
    allow_mock_executor: true
    allow_auto_execution: true

  budget:
    max_cost_usd_per_task: 0.25
    warn_cost_usd_per_task: 0.08
    unknown_cost_requires_approval: true

  safety:
    forbid_network_execution: false
    forbid_remote_clone: true
    forbid_external_script_execution: true
    forbid_secret_exposure: true
    forbid_subscription_misuse: true
    forbid_unreviewed_result_merge: true

  provider_priority:
    repo_patch:
      - agentlab.mock_patch
      - manual.codex
      - manual.cline
      - manual.ecc
      - api.deepseek
      - api.qwen
    architecture_review:
      - manual.codex
      - manual.cline
      - manual.ecc
      - api.deepseek
      - api.qwen
    research:
      - manual.anysearch
      - api.deepseek
      - api.qwen

  providers:
    - provider_id: agentlab.mock_patch
      provider_type: mock_executor
      display_name: AgentLab Mock Patch Executor
      enabled: true
      execution_mode: mock
      capabilities:
        - repo_patch
        - test_generation
      suitable_task_types:
        - repo_patch
      risk_level: low
      requires_approval: false
      cost_mode: none
      expected_cost_tier: free
      supports_auto_execution: true
      supports_manual_handoff: false
      notes:
        - Deterministic test-only executor.

    - provider_id: manual.codex
      provider_type: codex_cli
      display_name: Codex Manual Handoff
      enabled: true
      execution_mode: manual_handoff_only
      capabilities:
        - repo_patch
        - code_review
        - test_generation
      suitable_task_types:
        - repo_patch
        - architecture_review
      risk_level: medium
      requires_approval: true
      cost_mode: subscription_or_credit_external
      expected_cost_tier: unknown
      supports_auto_execution: false
      supports_manual_handoff: true

    - provider_id: manual.cline
      provider_type: cline
      display_name: Cline Manual Handoff
      enabled: true
      execution_mode: manual_handoff_only
      capabilities:
        - repo_patch
        - ide_workflow
      suitable_task_types:
        - repo_patch
      risk_level: medium
      requires_approval: true
      cost_mode: user_controlled_external
      expected_cost_tier: unknown
      supports_auto_execution: false
      supports_manual_handoff: true

    - provider_id: manual.ecc
      provider_type: ecc
      display_name: ECC Manual Handoff
      enabled: true
      execution_mode: manual_handoff_only
      capabilities:
        - planning
        - repo_strategy
        - code_review
        - repo_patch
      suitable_task_types:
        - architecture_review
        - repo_patch
      risk_level: medium
      requires_approval: true
      cost_mode: external_harness
      expected_cost_tier: unknown
      supports_auto_execution: false
      supports_manual_handoff: true

    - provider_id: api.deepseek
      provider_type: api_model
      display_name: DeepSeek API Model
      enabled: false
      execution_mode: disabled
      capabilities:
        - repo_patch
        - reasoning
      suitable_task_types:
        - repo_patch
        - architecture_review
      risk_level: medium
      requires_approval: true
      cost_mode: api_model
      expected_cost_tier: low
      supports_auto_execution: false
      supports_manual_handoff: true

    - provider_id: api.qwen
      provider_type: api_model
      display_name: Qwen API Model
      enabled: false
      execution_mode: disabled
      capabilities:
        - repo_patch
        - reasoning
      suitable_task_types:
        - repo_patch
        - architecture_review
      risk_level: medium
      requires_approval: true
      cost_mode: api_model
      expected_cost_tier: low
      supports_auto_execution: false
      supports_manual_handoff: true
