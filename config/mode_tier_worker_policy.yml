schema_version: 1
authority:
  purpose: advisory_worker_preferences
  runtime_decision_source: config/agent_model_profiles.yml
  command_template_source: config/worker_invocation_contracts.yml
  may_override_agent_backend: false
  notes:
    - This file ranks preferred workers for planning and audits only.
    - Runtime agent backend selection must come from agent_model_profiles.yml.
    - CLI command templates must come from worker_invocation_contracts.yml.
modes:
  single_cli_company:
    role_preferences:
      Supervisor: [claude_code, hermes]
      PromptEngineer: [claude_code, hermes]
      Coder: [claude_code, agy, aider]
      ArtifactProducer: [codex, agy, qwen]
  hybrid_local_company:
    role_preferences:
      RepoScout: [rg]
      InterfaceMapper: [ast_grep]
      TesterAuditor: [pytest]
      Verifier: [ruff, mypy, eslint]
      Archivist: [git]
  cost_saving_factory:
    role_preferences:
      RepoScout: [rg]
      InterfaceMapper: [ast_grep]
      Coder: [agy, claude_code]
      TesterAuditor: [pytest]
      Verifier: [ruff, mypy, eslint]
      Archivist: [git]
  max_quality_swarm:
    role_preferences:
      Supervisor: [hermes, claude_code, qwen, gemini]
      Coder: [claude_code, aider]
      ArtifactProducer: [codex, agy, qwen]
  frontdesk_gateway:
    role_preferences:
      Supervisor: [hermes, qwen, gemini]
tiers:
  low:
    cost_ceiling: low
    preferred_workers: [agy, rg, ast_grep, pytest, ruff, eslint, mypy, git]
  performance:
    cost_ceiling: high
    preferred_workers: []
  max_quality:
    cost_ceiling: high
    preferred_workers: [claude_code, codex, hermes]
