          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
    required_artifacts:
      - creative_scope_summary
      - creative_brief
      - content_constitution
      - world_or_topic_bible
      - outline
      - outline.md
      - scene_or_section_cards
      - draft
      - continuity_ledger
      - continuity_ledger.md
      - revision_notes
      - final_creative_package
    acceptance_gates:
      - genre_audience_defined
      - outline_first_gate
      - cards_precede_draft
      - continuity_review_complete
      - style_revision_complete
    risk_defaults:
      - continuity_drift_risk
      - tone_mismatch_risk
      - premature_draft_without_outline_risk
    failure_recovery:
      missing_brief: ask_user
      continuity_failure: revise_bible_and_outline
      style_mismatch: style_revision
    human_decision_points:
      - approve_outline_before_drafting
      - approve_major_style_change
    human_approval:
      required_by_default: false
      required_when:
        - approve_outline_before_drafting
        - approve_major_style_change
    route_preferences:
      default_route: creative
      allowed_routes:
        - creative
        - document
    risk_notes:
      - Creative workflows must not jump straight to drafting.
    notes:
      - Creative workflows must not jump straight to drafting.

  business_strategy:
