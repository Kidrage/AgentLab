        expected_artifacts:
          - final_creative_package
        acceptance_gates:
          - final_package_complete
        recommended_agents:
          - prompt_engineer
          - doc_manager
        recommended_skills:
          - creative_briefing
          - outline_first_planning
        required_capabilities:
          - file_write
          - long_document_reading
          - human_approval
        human_decision_point: false
        failure_recovery:
