# AgentLab S2 Domain Workflow Templates
# Deterministic planning data only: no execution, no network, no provider calls, no skill install.
templates:
  coding_software_engineering:
    template_id: coding_software_engineering
    display_name: Coding / Software Engineering
    description: Plan safe repository or software changes with scoped inspection, patch design, tests, audit, and rollback evidence.
    trigger_task_types:
      - coding
      - debugging
      - repo_patch
    task_types:
      - coding
      - debugging
      - repo_patch
    trigger_signals:
      - bug
      - repository
      - repo
      - pytest
      - test
      - patch
      - branch
      - commit
      - code
    required_capabilities:
      - file_read
      - repo_inspection
      - code_edit
      - test_execution
      - shell_command
    recommended_agents:
      - repo_scout
      - coder
      - tester_auditor
      - verifier
    recommended_skills:
      - repo_triage
      - safe_patch_planning
      - test_runner_interpretation
      - rollback_planning
    phase_plan:
      - phase_id: compile_mission
        title: Compile mission
        goal: Normalize the mission contract and preserve constraints.
        required_inputs:
          - mission_contract
        expected_artifacts:
          - scope_summary
        acceptance_gates:
          - scope_is_bounded
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: inspect_repo_context
        title: Inspect repo context
        goal: Identify branch, dirty files, entrypoints, and relevant docs without broad scanning.
        required_inputs:
          - mission_contract
        expected_artifacts:
          - repo_context_summary
        acceptance_gates:
          - repo_context_is_documented
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: locate_change_surface
        title: Locate change surface
        goal: Map likely files, symbols, tests, and interfaces touched by the requested change.
        required_inputs:
          - repo_context_summary
        expected_artifacts:
          - change_surface_map
        acceptance_gates:
          - change_surface_is_minimal
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: design_patch_plan
        title: Design patch plan
        goal: Design the smallest safe patch and rollback path before editing.
        required_inputs:
          - change_surface_map
        expected_artifacts:
          - patch_plan
          - rollback_plan
        acceptance_gates:
          - patch_plan_is_reviewable
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: true
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: implement_patch
        title: Implement patch
        goal: Apply only task-scoped code or documentation changes.
        required_inputs:
          - patch_plan
        expected_artifacts:
          - changed_files_summary
        acceptance_gates:
          - unrelated_files_untouched
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: run_tests
        title: Run tests
        goal: Run targeted verification or record explicit limitations.
        required_inputs:
          - changed_files_summary
        expected_artifacts:
          - test_results
        acceptance_gates:
          - relevant_tests_pass_or_limitations_recorded
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: audit_text_integrity
        title: Audit text integrity
        goal: Check for secrets, local paths, generated junk, and compressed text artifacts.
        required_inputs:
          - changed_files_summary
          - test_results
        expected_artifacts:
          - text_integrity_audit
        acceptance_gates:
          - no_secret_or_local_path_leak
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: produce_acceptance_report
        title: Produce acceptance report
        goal: Summarize verdict, changed files, verification, risks, and follow-ups.
        required_inputs:
          - test_results
          - text_integrity_audit
        expected_artifacts:
          - acceptance_report
        acceptance_gates:
          - acceptance_report_complete
        recommended_agents:
          - repo_scout
          - coder
        recommended_skills:
          - repo_triage
          - safe_patch_planning
        required_capabilities:
          - file_read
          - repo_inspection
          - code_edit
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
    required_artifacts:
      - scope_summary
      - repo_context_summary
      - change_surface_map
      - patch_plan
      - patch_plan.md
      - changed_files_summary
      - changed_files_summary.md
      - test_results
      - test_results.md
      - text_integrity_audit
      - acceptance_report
      - acceptance_report.md
    acceptance_gates:
      - scope_is_bounded
      - change_surface_is_minimal
      - relevant_tests_pass_or_limitations_recorded
      - text_integrity_audit_passes
      - rollback_notes_exist
    risk_defaults:
      - regression_risk
      - insufficient_test_coverage
      - local_path_or_secret_leak_risk
    failure_recovery:
      missing_evidence: inspect_repo_context_again
      test_failure: create_retry_plan
      ambiguous_scope: ask_user
    human_decision_points:
      - approve_large_patch
      - approve_external_execution
    human_approval:
      required_by_default: false
      required_when:
        - approve_large_patch
        - approve_external_execution
    route_preferences:
      default_route: coding
      allowed_routes:
        - coding
        - repo_patch
    risk_notes:
      - Do not modify unrelated files.
      - Do not force push or run destructive commands without approval.
    notes:
      - Do not modify unrelated files.
      - Do not force push or run destructive commands without approval.

  research_investigation:
    template_id: research_investigation
    display_name: Research / Investigation
    description: Plan source-grounded investigation with explicit source policy, quality review, citations, uncertainty, and no live web execution.
    trigger_task_types:
      - research
      - investigation
    task_types:
      - research
      - investigation
    trigger_signals:
      - research
      - investigate
      - source
      - citation
      - evidence
      - latest
      - current
      - report
    required_capabilities:
      - source_collection
      - web_search
      - source_citation
      - long_document_reading
    recommended_agents:
      - researcher
      - verifier
      - doc_manager
    recommended_skills:
      - source_planning
      - citation_grounding
      - evidence_table_building
      - uncertainty_labeling
    phase_plan:
      - phase_id: compile_mission
        title: Compile mission
        goal: Normalize the research contract and constraints.
        required_inputs:
          - mission_contract
        expected_artifacts:
          - research_scope_summary
        acceptance_gates:
          - scope_is_bounded
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: clarify_research_question
        title: Clarify research question
        goal: Convert the user goal into answerable subquestions and boundaries.
        required_inputs:
          - mission_contract
        expected_artifacts:
          - research_questions
        acceptance_gates:
          - question_is_answerable
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: true
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: build_source_plan
        title: Build source plan
        goal: Define approved source types, freshness needs, and citation policy.
        required_inputs:
          - research_questions
        expected_artifacts:
          - source_plan
        acceptance_gates:
          - source_policy_is_explicit
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: true
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: collect_sources_or_request_provider
        title: Collect sources or request provider
        goal: Plan source collection or request future web/source provider capability without executing it.
        required_inputs:
          - source_plan
        expected_artifacts:
          - source_collection_request
        acceptance_gates:
          - no_unapproved_web_execution
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: true
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: evaluate_source_quality
        title: Evaluate source quality
        goal: Score source reliability, recency, bias, and coverage.
        required_inputs:
          - source_collection_request
        expected_artifacts:
          - source_quality_table
        acceptance_gates:
          - source_quality_gate
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: extract_fact_table
        title: Extract fact table
        goal: Map facts to source references and distinguish assumptions.
        required_inputs:
          - source_quality_table
        expected_artifacts:
          - fact_table
        acceptance_gates:
          - claims_have_sources
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: synthesize_findings
        title: Synthesize findings
        goal: Produce findings with citations and caveats.
        required_inputs:
          - fact_table
        expected_artifacts:
          - citation_grounded_report
        acceptance_gates:
          - citation_grounding_gate
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: uncertainty_review
        title: Uncertainty review
        goal: Review stale facts, missing evidence, and confidence.
        required_inputs:
          - citation_grounded_report
        expected_artifacts:
          - uncertainty_review
        acceptance_gates:
          - uncertainty_is_labeled
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
      - phase_id: produce_citation_grounded_report
        title: Produce citation grounded report
        goal: Package final report and citation ledger.
        required_inputs:
          - uncertainty_review
        expected_artifacts:
          - final_research_report
          - citation_ledger
        acceptance_gates:
          - no_fake_citations
        recommended_agents:
          - researcher
          - verifier
        recommended_skills:
          - source_planning
          - citation_grounding
        required_capabilities:
          - source_collection
          - web_search
          - source_citation
        human_decision_point: false
        failure_recovery:
          missing_evidence: request_more_context
          phase_failure: create_retry_plan
          ambiguous_scope: ask_user
    required_artifacts:
      - research_scope_summary
      - research_questions
      - source_plan
      - source_collection_request
      - source_quality_table
      - fact_table
      - citation_grounded_report
      - uncertainty_review
      - final_research_report
      - citation_ledger
    acceptance_gates:
      - source_policy_is_explicit
      - source_quality_gate
      - claims_have_sources
      - citation_grounding_gate
      - no_fake_citations
    risk_defaults:
      - stale_source_risk
      - fake_citation_risk
      - source_quality_risk
    failure_recovery:
      missing_evidence: request_sources_or_provider
      source_conflict: label_uncertainty
      ambiguous_scope: ask_user
    human_decision_points:
      - approve_source_policy
      - approve_external_source_collection
    human_approval:
      required_by_default: false
      required_when:
        - approve_source_policy
        - approve_external_source_collection
    route_preferences:
      default_route: research
      allowed_routes:
        - research
        - analysis
    risk_notes:
      - S2 plans source collection only; it does not browse.
      - Do not invent citations.
    notes:
      - S2 plans source collection only; it does not browse.
      - Do not invent citations.

  creative_longform:
