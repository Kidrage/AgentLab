    worker_capabilities: [role_worker]
    allowed_roles: [RepoScout]
    forbidden_roles: [Supervisor, Observer, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
  ast_grep:
