schema_version: 1
policy_id: agent_role_bindings
authority: _shared/AGENT_PROTOCOL.md
summary: >
  Worker CLI identities are not AgentLab roles by themselves. AgentLab must
  bind a worker to either a frontdesk profile or one of the role session
  contracts before invoking it.
enforcement:
  require_workspace_entry_packet: true
  require_frontdesk_session_for_frontdesk_agents: true
  require_role_session_for_worker_roles: true
  forbid_frontdesk_profile_as_worker: true
  forbid_unbound_worker_role_assignment: true
capability_profiles:
  frontdesk_gateway: talk, read state, create tasks, and generate change proposals only
  micro_doc_editor: submit small documentation edits through the AgentLab write gate
  candidate_artifact_worker: write bounded candidates under runs/ or candidates/
  role_worker: execute formal AgentLab roles only through role-session/task-packet
  workflow_shell: expose reusable CLI-native workflow orchestration inside a bounded AgentLab role-session; AgentLab still owns memory, validation, and promotion
  core_config_editor: reserved for confirmed AgentLab config commands; no worker owns it by default
roles:
  Supervisor:
    allowed_workers: [codex, hermes, qwen, claude_code]
    required_session: true
  Observer:
    allowed_workers: [agy]
    required_session: true
  RepoScout:
    allowed_workers: [rg, claude_code, codex]
    required_session: true
  Researcher:
    allowed_workers: [grok, bl, claude_code, qwen, hermes]
    required_session: true
  InterfaceMapper:
    allowed_workers: [ast_grep, claude_code, codex]
    required_session: true
  PromptEngineer:
    allowed_workers: [hermes, claude_code, qwen]
    required_session: true
  Coder:
    allowed_workers: [claude_code, codex, aider, hermes]
    required_session: true
  ArtifactProducer:
    allowed_workers: [grok, codex, qwen]
    required_session: true
  NarrativePlanner:
    allowed_workers: [claude_code]
    required_session: true
  Writer:
    allowed_workers: [claude_code]
    required_session: true
  Reviewer:
    allowed_workers: [agy, qwen, claude_code]
    required_session: true
  Scribe:
    allowed_workers: [qwen, claude_code, codex]
    required_session: true
  TesterAuditor:
    allowed_workers: [pytest, claude_code, codex, hermes]
    required_session: true
  Verifier:
    allowed_workers: [ruff, mypy, eslint, claude_code, codex, hermes]
    required_session: true
  Archivist:
    allowed_workers: [git, claude_code, hermes]
    required_session: true
workers:
  agy:
    frontdesk_capable: true
    worker_capable: true
    worker_capabilities: [frontdesk_gateway, role_worker, workflow_shell]
    frontdesk_profiles: [local_chat_gateway]
    allowed_roles: [Observer, Reviewer]
    forbidden_roles: [Supervisor, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Scribe, TesterAuditor, Verifier, Archivist]
  grok:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [candidate_artifact_worker, role_worker, workflow_shell]
    allowed_roles: [Researcher, ArtifactProducer]
    forbidden_roles: [Supervisor, Observer, RepoScout, InterfaceMapper, PromptEngineer, Coder, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
  openclaw:
    frontdesk_capable: true
    worker_capable: false
    worker_capabilities: [frontdesk_gateway]
    frontdesk_profiles: [public_chat_gateway]
    allowed_roles: []
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
  codex:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [candidate_artifact_worker, role_worker, workflow_shell]
    allowed_roles: [Supervisor, RepoScout, InterfaceMapper, Coder, ArtifactProducer, Scribe, TesterAuditor, Verifier]
    forbidden_roles: [Observer, Researcher, PromptEngineer, NarrativePlanner, Writer, Reviewer, Archivist]
  claude_code:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker, workflow_shell]
    allowed_roles: [Supervisor, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
    forbidden_roles: [Observer, ArtifactProducer]
  hermes:
    frontdesk_capable: true
    worker_capable: true
    worker_capabilities: [frontdesk_gateway, role_worker, workflow_shell]
    frontdesk_profiles: [internal_cli_gateway]
    allowed_roles: [Supervisor, Researcher, PromptEngineer, Coder, TesterAuditor, Verifier, Archivist]
    forbidden_roles: [Observer, RepoScout, InterfaceMapper, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe]
  qwen:
    frontdesk_capable: true
    worker_capable: true
    worker_capabilities: [frontdesk_gateway, candidate_artifact_worker, role_worker, workflow_shell]
    frontdesk_profiles: [local_chat_gateway]
    allowed_roles: [Supervisor, Researcher, PromptEngineer, ArtifactProducer, Reviewer, Scribe]
    forbidden_roles: [Observer, RepoScout, InterfaceMapper, Coder, NarrativePlanner, Writer, TesterAuditor, Verifier, Archivist]
  bl:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [Researcher]
    forbidden_roles: [Supervisor, Observer, RepoScout, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
  rg:
