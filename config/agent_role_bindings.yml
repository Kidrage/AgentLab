    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [InterfaceMapper]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
  pytest:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [TesterAuditor]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, Verifier, Archivist]
  ruff:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [Verifier]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Archivist]
  mypy:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [Verifier]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Archivist]
  eslint:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [Verifier]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Archivist]
  git:
    frontdesk_capable: false
    worker_capable: true
    worker_capabilities: [role_worker]
    allowed_roles: [Archivist]
    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, Coder, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier]
  aider:
