    forbidden_roles: [Supervisor, Observer, RepoScout, Researcher, InterfaceMapper, PromptEngineer, ArtifactProducer, NarrativePlanner, Writer, Reviewer, Scribe, TesterAuditor, Verifier, Archivist]
