# 剧情路线图

## 第一卷 · 印中人（预估35章）
陆沉从隙月镇的一个鉴古小工——到被迫离开故乡。

### Act 1 · 碎玉（1-10章）
角色登场+世界观底层展示（通过日常而非说明）+夭夭初显
目标：让读者爱上隙月镇——和镇上的每一个人

### Act 2 · 入渊（11-20章）
出走隙月镇→进入裂兽活跃区→夭夭展露导师价值→第一场硬核战斗
关键事件：第一个重要女配的惨死——激发男主第一次深度黑化

### Act 3 · 裂痕（21-35章）
秘密组织现身→夭夭第一次燃烧自己→燕十七的选择→第一卷高潮
结尾：陆沉离开，夭夭更透明了，但她说"没关系"。

