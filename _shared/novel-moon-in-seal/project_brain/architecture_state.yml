## 当前活性区域：长衡野·隙月镇

- 隙月镇（Xì Yuè Zhèn）—— 长衡野南部边境的一座古镇
- 名字由来：传说在天裂的那一夜，小镇上空的月光从裂缝中漏下，照得整座镇子像浸在银色的水里
- "隙月"——裂缝中漏出的月光。暗合世界被撕裂的底色，但不直说
- 古镇以玉雕闻名乡里。街巷蜿蜒，青石板路，家家户户门口摆着石雕残件
- 鉴古街：老陈在这里开了四十年的"陈记鉴古"
- 不老阁——镇上最老的酒楼，也是消息最灵通的地方
- 铁拳猎团驻地——在镇西郊古战场边缘

## 已知主要势力（第一卷前半段）

1. **铁拳猎团** —— 猎杀裂兽/收容"打完仗后不知道做什么的人"的民间组织。分布于各国，隙月镇的这支由霍七带队。
2. **两不疑商会** —— 衡州商贸体系在七境的延伸。没有固定的善恶立场——只看价钱合不合适。
3. **（未命名）** —— 裴青黛所属的组织。意图回收混沌印碎片。第一卷中期展开。
